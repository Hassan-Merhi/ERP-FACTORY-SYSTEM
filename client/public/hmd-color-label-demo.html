<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>HMD — 100 Color Logo Label Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font:14px system-ui,Arial,sans-serif}
header{background:white;border-bottom:1px solid #dce3eb;padding:18px 24px;position:sticky;top:0;z-index:2}
h1{font-size:21px;margin:0 0 5px}p{margin:5px 0;color:#526174}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
button{border:0;background:#1648a5;color:white;border-radius:7px;padding:10px 18px;font-weight:700;cursor:pointer}
button.secondary{background:#e4eaf3;color:#172033}label{font-weight:600}select{padding:9px;border:1px solid #cbd5e1;border-radius:7px;background:white}
main{max-width:1200px;margin:20px auto;padding:0 16px}.sheet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.label{height:93px;min-width:0;background:white;border:1px solid #d0d5dd;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;break-inside:avoid;page-break-inside:avoid;padding:5px}
.label img{width:88%;height:62px;object-fit:contain;display:block}
.label .swatch{width:13px;height:13px;display:inline-block;border:1px solid rgba(0,0,0,.25);vertical-align:middle;margin-right:5px;flex-shrink:0}.label .details{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;letter-spacing:.2px;color:#4b5563;margin-top:0;white-space:nowrap}
.status{font-size:12px;color:#64748b}
@page{size:A4 portrait;margin:8mm}
@media print{body{background:white}header,.status{display:none!important}main{padding:0;margin:0;max-width:none}.sheet{grid-template-columns:repeat(5,minmax(0,1fr));gap:1.5mm}.label{height:19mm;border:.2mm solid #ccc;border-radius:0;padding:1mm}.label img{height:14mm;width:100%}.label .details{font-size:6.5pt}.label .swatch{width:3mm;height:3mm;margin-right:1mm}.sheet{page-break-after:auto}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:800px){.sheet{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:480px){.sheet{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header><h1>HMD — 100 Color Label Printing Demo</h1><p>Real small HMD priority logo artwork, each in a different color. Demo only — no production records or barcodes.</p>
<div class="controls"><label for="count">Print colors</label><select id="count"><option value="100">All 100</option><option value="10">First 10</option><option value="20">First 20</option><option value="50">First 50</option></select><button id="print" type="button">Print Color Labels</button><button class="secondary" id="reset" type="button">Show All</button><span id="status" class="status"></span></div></header>
<main><div id="sheet" class="sheet" aria-label="Small HMD logo labels"></div></main>
<script type="module">
import {priorityHmdLogoDataUrl} from '/src/lib/priorityHmdLogo.ts';
const colors=["#DC143C","#4169E1","#50C878","#FFD700","#673AB7","#FF7F50","#40E0D0","#FF69B4","#001F54","#32CD32","#CC5500","#B57EDC","#008080","#E0115F","#87CEEB","#D4A017","#98FF98","#FF00FF","#7B3F00","#00FFFF","#228B22","#FA8072","#4B0082","#FFCBA4","#808000","#7DF9FF","#800020","#7FFFD4","#FFBF00","#708090","#8F00FF","#E2725B","#2E8B57","#FF66CC","#191970","#FBCEB1","#01796F","#CCCCFF","#CB4154","#D6F0FF","#B87333","#7FFF00","#8E4585","#4682B4","#C2B280","#39FF14","#E30B5D","#007BA7","#FFFFF0","#008B8B","#FC8EAC","#0F52BA","#8A9A5B","#F28500","#C8A2C8","#800000","#B0E0E6","#00A86B","#C74375","#36454F","#FFC512","#006994","#93C572","#DCAE96","#614051","#E34234","#ACE1AF","#1560BD","#F7E7CE","#9932CC","#0047AB","#AF6E4D","#00FF7F","#FC6C85","#C3B091","#003153","#FF5F1F","#9966CC","#8DB600","#DE5D83","#CD7F32","#AFEEEE","#C54B8C","#4B5320","#FFF44F","#B7410E","#89CFF0","#DA70D6","#00CED1","#6F4E37","#FF2400","#CCFF00","#6495ED","#E0B0FF","#355E3B","#FF10F0","#D2B48C","#007FFF","#6F2DA8","#BFC1C2"];
const sheet=document.getElementById('sheet'),count=document.getElementById('count'),status=document.getElementById('status');
const images=colors.map(color=>priorityHmdLogoDataUrl(color));
function render(){const max=Number(count.value);sheet.replaceChildren();const frag=document.createDocumentFragment();colors.slice(0,max).forEach((hex,i)=>{const el=document.createElement('div');el.className='label';const img=document.createElement('img');img.src=images[i];img.alt='HMD logo in '+hex;const detail=document.createElement('div');detail.className='details';const swatch=document.createElement('span');swatch.className='swatch';swatch.style.backgroundColor=hex;const text=document.createElement('span');text.textContent=String(i+1).padStart(3,'0')+'  '+hex;detail.append(swatch,text);el.append(img,detail);frag.append(el)});sheet.append(frag);status.textContent=max+' small labels shown (5 per row on A4 print)';}
count.addEventListener('change',render);document.getElementById('reset').addEventListener('click',()=>{count.value='100';render()});document.getElementById('print').addEventListener('click',()=>window.print());render();
</script></body></html>
