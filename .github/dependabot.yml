version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lubumbashi
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    rebase-strategy: auto
    ignore:
      # Keep Node type definitions on the same major as the canonical Node 24 runtime.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # supertest 7.3.x crashes the backend suite (null server address); see renovate.json.
      - dependency-name: "supertest"
        versions:
          - ">=7.3.0"
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Africa/Lubumbashi
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    rebase-strategy: auto
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
