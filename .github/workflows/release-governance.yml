name: Release Governance

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-governance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance:
    name: Protect main and release path
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"

      - name: Verify live main governance
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const repo = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const eventName = process.env.EVENT_NAME;
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "etshadierp-release-governance",
          };

          async function github(path) {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, { headers });
            if (!response.ok) {
              const body = await response.text();
              throw new Error(`GitHub API ${response.status} for ${path}: ${body}`);
            }
            return response.json();
          }

          const main = await github("/branches/main");
          const rules = await github("/rules/branches/main?per_page=100");
          if (!Array.isArray(rules)) {
            throw new Error("GitHub did not return the active rules that apply to main.");
          }

          if (main.protected !== true) {
            throw new Error(
              "main is not protected. Create an active ruleset targeting main before this repository can be release-governed.",
            );
          }

          const ruleTypes = new Set(rules.map((rule) => rule.type));
          const mandatoryRuleTypes = ["pull_request", "non_fast_forward", "deletion"];
          const missingRuleTypes = mandatoryRuleTypes.filter((type) => !ruleTypes.has(type));
          if (missingRuleTypes.length > 0) {
            throw new Error(`main ruleset is missing required rule(s): ${missingRuleTypes.join(", ")}`);
          }

          const statusRules = rules.filter((rule) => rule.type === "required_status_checks");
          if (statusRules.length > 0) {
            const configuredContexts = statusRules.flatMap((rule) =>
              Array.isArray(rule.parameters?.required_status_checks)
                ? rule.parameters.required_status_checks.map((check) => check.context)
                : [],
            );
            console.log(
              `Main currently has ${configuredContexts.length} required status context(s); status checks are no longer part of the release-governance contract because automatic validation runs after merge on main.`,
            );
          }

          if (eventName === "push") {
            if (event.forced === true) {
              throw new Error("Force pushes to main are forbidden by the release-governance contract.");
            }

            const pushedSha = event.after || process.env.HEAD_SHA;
            if (!pushedSha || /^0+$/.test(pushedSha)) {
              throw new Error("main deletion or an empty main push is forbidden.");
            }

            const pulls = await github(`/commits/${pushedSha}/pulls`);
            const associatedMergedMainPr = pulls.some((pr) => pr.merged_at && pr.base?.ref === "main");
            if (!associatedMergedMainPr) {
              throw new Error(
                "The new main SHA is not associated with a merged pull request targeting main. Direct pushes are forbidden.",
              );
            }
          }

          console.log(
            `Release governance passed for ${eventName}; main=${main.commit.sha}; protectedRules=${mandatoryRuleTypes.join(",")}`,
          );
          NODE
