name: Temporary FX CI Formatter
on:
  push:
    branches:
      - fix/fx-reversal-final-ci-20261020
    paths:
      - .github/workflows/tmp-fx-ci-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: fix/fx-reversal-final-ci-20261020
          persist-credentials: true
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          file=tests/factory-fx-agent-wallet-routes.test.ts
          node node_modules/prettier/bin/prettier.cjs --write "$file"
          node node_modules/prettier/bin/prettier.cjs --check "$file"
          git add -- "$file"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(fx): format reversal test"
            git push origin HEAD:fix/fx-reversal-final-ci-20261020
          fi
