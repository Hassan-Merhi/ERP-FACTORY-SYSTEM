name: Phase 33G Focused Verification

on:
  push:
    branches:
      - test/phase33g-high-line-misc-20260917

permissions:
  contents: read

jobs:
  phase33g:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Run Phase 33G behavioral coverage
        run: node node_modules/vitest/vitest.mjs run tests/phase33g-high-line-misc.test.ts
