name: Maintenance - Production Canary

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-canary
  cancel-in-progress: true

jobs:
  canary:
    name: Verify production health
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      PRODUCTION_HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
    steps:
      - name: Keep canary inert until endpoint is configured
        if: env.PRODUCTION_HEALTH_URL == ''
        run: echo "PRODUCTION_HEALTH_URL is not configured; canary remains inert until the secret is added."

      - name: Check production health endpoint
        if: env.PRODUCTION_HEALTH_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/health-response.txt"
          code=$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            --output "$response" --write-out '%{http_code}' \
            "$PRODUCTION_HEALTH_URL")
          if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Production health check returned HTTP $code"
            sed -n '1,40p' "$response" || true
            exit 1
          fi
          echo "Production health endpoint returned HTTP $code"
