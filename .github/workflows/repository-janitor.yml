name: Maintenance - Repository Janitor

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  janitor:
    name: Safe repository cleanup
    runs-on: ubuntu-26.04
    steps:
      - name: Delete branches only when merged head still matches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.merged_at != null) | select(.head.repo.full_name == .base.repo.full_name) | [.head.ref,.head.sha] | @tsv' \
            | sort -u \
            | while IFS=$'\t' read -r branch merged_head_sha; do
                [ -z "$branch" ] && continue
                [ "$branch" = "$DEFAULT_BRANCH" ] && continue
                if gh api "repos/$REPO/branches/$branch" >/dev/null 2>&1; then
                  open_count=$(gh api "repos/$REPO/pulls?state=open&head=$REPO_OWNER:$branch&per_page=1" --jq 'length')
                  [ "$open_count" != "0" ] && continue
                  current_sha=$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')
                  if [ "$current_sha" = "$merged_head_sha" ]; then
                    echo "Deleting merged branch whose head is unchanged: $branch ($current_sha)"
                    gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
                  else
                    echo "Keeping reused/advanced branch: $branch (current $current_sha, merged head $merged_head_sha)"
                  fi
                fi
              done

      - name: Report stale unmerged branches without deleting them
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '60 days ago' +%s)
          stale_file="$RUNNER_TEMP/stale-branches.txt"
          : > "$stale_file"
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [ "$branch" = "$DEFAULT_BRANCH" ] && continue
            open_count=$(gh api "repos/$REPO/pulls?state=open&head=$REPO_OWNER:$branch&per_page=1" --jq 'length')
            [ "$open_count" != "0" ] && continue
            commit_date=$(gh api "repos/$REPO/commits/$branch" --jq '.commit.committer.date')
            commit_epoch=$(date -u -d "$commit_date" +%s)
            if [ "$commit_epoch" -lt "$cutoff" ]; then
              printf '%s | last commit %s\n' "$branch" "$commit_date" >> "$stale_file"
            fi
          done
          if [ -s "$stale_file" ]; then
            echo "Stale unmerged branches (manual review only):"
            cat "$stale_file"
          else
            echo "No stale unmerged branches found."
          fi
