name: Phase 2 Format Once

on:
  push:
    branches:
      - test/backend-coverage-phase2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/backend-coverage-phase2
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Format Phase 2 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            tests/backend-coverage-phase2-erp-deep-reads.test.ts \
            tests/backend-coverage-phase2-import-validation-sweep.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/backend-coverage-phase2-erp-deep-reads.test.ts tests/backend-coverage-phase2-import-validation-sweep.test.ts
          git commit -m "style: format Phase 2 coverage tests"
          git push origin HEAD:test/backend-coverage-phase2
