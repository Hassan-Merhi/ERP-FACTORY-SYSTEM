name: Temporary PR 1890 formatter
# trigger formatter

on:
  push:
    branches:
      - tmp/format-pr1890

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/format-pr1890
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format PR files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/routes/fiscal-transfers/create.ts \
            server/storage/stock-ops/transfers-create.ts \
            tests/legacy-stock-transfer-missing-source.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/fiscal-transfers/create.ts server/storage/stock-ops/transfers-create.ts tests/legacy-stock-transfer-missing-source.test.ts
          git commit -m "Apply Prettier to PR 1890 files"
          git push origin HEAD:tmp/format-pr1890
