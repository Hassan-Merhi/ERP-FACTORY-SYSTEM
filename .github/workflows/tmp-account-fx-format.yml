name: Temporary Account FX Formatting
on:
  push:
    branches:
      - feat/account-fx-modal-and-safe-reversal-20261020
    paths:
      - .github/workflows/tmp-account-fx-format.yml
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: feat/account-fx-modal-and-safe-reversal-20261020
          fetch-depth: 0
          persist-credentials: true
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format changed sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            client/src/pages/accountslegacy/EditAccountDialog.tsx
            client/src/pages/factory/FactoryNetPosition.tsx
            client/src/pages/factory/FactoryNetPositionDetails.tsx
            client/src/pages/factory/factorynetposition/components/FactoryFxAgentWalletCard.tsx
            server/services/factory/fxAgentWalletState.ts
            server/routes/factory/fxAgentWalletReversalRoutes.ts
            server/routes/factory/fxAgentWalletRoutes.ts
            server/middleware/factoryBackendAccessBoundary.ts
            shared/schema/runtime/fxAgentWallets.ts
            tests/factory-fx-agent-wallet-state.test.ts
            tests/factory-fx-agent-wallet-routes.test.ts
            tests/factory-backend-access-boundary.test.ts
            tests/write-route-guard-sweep.test.ts
            client/src/i18n/phase3RemainingTranslations.part29.ts
          )
          node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
          node node_modules/prettier/bin/prettier.cjs --check "${files[@]}"
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(fx): Prettier-format FX account popup and reversal"
            git push origin HEAD:feat/account-fx-modal-and-safe-reversal-20261020
          fi
