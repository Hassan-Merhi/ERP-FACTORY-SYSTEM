name: Wave 5 one-shot formatter

on:
  push:
    branches:
      - agent/wave5-permission-migration-certification

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Format Wave 5 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/settings/PageVisibilityTree.tsx \
            server/lib/factoryAccessControl.ts \
            server/routes/factory/docs-users/usersAccessRoutes.ts \
            shared/factoryPermissionCatalog.ts \
            tests/ui/factory-permission-wave5-certification.test.ts
          for file in \
            client/src/pages/settings/PageVisibilityTree.tsx \
            server/lib/factoryAccessControl.ts \
            server/routes/factory/docs-users/usersAccessRoutes.ts \
            shared/factoryPermissionCatalog.ts \
            tests/ui/factory-permission-wave5-certification.test.ts
          do
            echo "=====WAVE5_FILE_START:${file}====="
            cat "$file"
            echo "=====WAVE5_FILE_END:${file}====="
          done
