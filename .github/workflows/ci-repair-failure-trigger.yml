name: CI Repair Failure Trigger

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-repair-bot.yml
      - .github/workflows/ci-repair-failure-trigger.yml
      - .github/workflows/ci-repair-sweep.yml
      - .github/agents/bug-repair.agent.md
  status:
  schedule:
    # The status and pull_request hooks are the primary wake-ups. Keep only a
    # low-frequency fallback so a stuck/red PR cannot create twelve new runs
    # per hour while the hosted-runner queue is already busy.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # Coalesce fallback/status events instead of assigning every scheduled run a
  # unique group. Pull requests still keep one independent watcher per PR.
  group: ci-repair-pr-watch-${{ github.event.pull_request.number || github.event.sha || github.event_name }}
  cancel-in-progress: true

jobs:
  watch-pr:
    name: Watch trusted PR checks for repair
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
      IS_DRAFT: ${{ github.event.pull_request.draft }}
    steps:
      - name: Watch exact trusted PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$IS_DRAFT" == false && "$BASE_REF" == main ]] || exit 0
          [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]] || exit 0
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) exit 0 ;;
          esac

          blocked="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '[.labels[].name] | any(. == "ci-repair-blocked")')"
          [[ "$blocked" == false ]] || exit 0

          # Give all normal PR workflows and external status providers time to
          # register before deciding that the head is already settled.
          sleep 20

          for iteration in $(seq 1 210); do
            current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
            [[ "$current_head" == "$EXPECTED_HEAD_SHA" ]] || exit 0

            checks_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD_SHA/check-runs?per_page=100")"
            statuses_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD_SHA/status")"

            failed_checks="$(jq '[.check_runs[] | select(
              .name != "Watch trusted PR checks for repair" and
              .status == "completed" and
              (.conclusion == "failure" or
               .conclusion == "timed_out" or
               .conclusion == "cancelled" or
               .conclusion == "action_required" or
               .conclusion == "startup_failure")
            )] | length' <<<"$checks_json")"
            failed_statuses="$(jq '[.statuses[] | select(.state == "failure" or .state == "error")] | length' <<<"$statuses_json")"

            if (( failed_checks > 0 || failed_statuses > 0 )); then
              # Never queue a second repair run behind one that is already working.
              active_runs="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-repair-bot.yml/runs?per_page=50" \
                  --jq '[.workflow_runs[] | select(
                          .status == "queued" or
                          .status == "in_progress" or
                          .status == "waiting" or
                          .status == "requested" or
                          .status == "pending")] | length'
              )"
              if (( active_runs == 0 )); then
                gh api --method POST \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/ci-repair-bot.yml/dispatches" \
                  -f ref=main
              fi
              exit 0
            fi

            active_checks="$(jq '[.check_runs[] | select(
              .name != "Watch trusted PR checks for repair" and
              (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")
            )] | length' <<<"$checks_json")"
            pending_statuses="$(jq '[.statuses[] | select(.state == "pending")] | length' <<<"$statuses_json")"
            observed_checks="$(jq '[.check_runs[] | select(.name != "Watch trusted PR checks for repair")] | length' <<<"$checks_json")"
            observed_statuses="$(jq '.statuses | length' <<<"$statuses_json")"

            # After a short registration window, a head with observed checks and
            # no remaining work is settled and needs no repair wake-up.
            if (( iteration >= 3 && observed_checks + observed_statuses > 0 && active_checks == 0 && pending_statuses == 0 )); then
              exit 0
            fi

            sleep 20
          done

  external-status-wake:
    name: Wake on failed external commit status
    if: >-
      github.event_name == 'status' &&
      (github.event.state == 'failure' || github.event.state == 'error')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      STATUS_SHA: ${{ github.event.sha }}
    steps:
      - name: Validate failed status belongs to a trusted open PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          encoded_pr="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
              --jq ".[] | select(.head.sha == \"$STATUS_SHA\") | @base64" \
              | head -n1
          )"
          [[ -n "$encoded_pr" ]] || exit 0

          pr_json="$(printf '%s' "$encoded_pr" | base64 --decode)"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          author_login="$(jq -r '.user.login' <<<"$pr_json")"
          author_association="$(jq -r '.author_association // ""' <<<"$pr_json")"
          blocked="$(jq -r '[.labels[].name] | any(. == "ci-repair-blocked")' <<<"$pr_json")"

          [[ "$draft" == false && "$head_repo" == "$GITHUB_REPOSITORY" && "$blocked" == false ]] || exit 0
          [[ "$author_login" != 'dependabot[bot]' && "$author_login" != 'renovate[bot]' ]] || exit 0
          case "$author_association" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) exit 0 ;;
          esac

          # Never queue a second repair run behind one that is already working.
          active_runs="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-repair-bot.yml/runs?per_page=50" \
              --jq '[.workflow_runs[] | select(
                      .status == "queued" or
                      .status == "in_progress" or
                      .status == "waiting" or
                      .status == "requested" or
                      .status == "pending")] | length'
          )"
          (( active_runs == 0 )) || exit 0

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci-repair-bot.yml/dispatches" \
            -f ref=main

  deployment-sweep:
    name: Sweep red PRs after CI repair automation lands
    # GitHub cron is best-effort and has never been a dependable wake-up for
    # PRs that were already red before a bot change reached main, so a change
    # to the CI repair automation itself sweeps for eligible red PRs at once.
    if: github.event_name == 'push'
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    uses: ./.github/workflows/ci-repair-sweep.yml
    with:
      reason: ci-repair automation deployed to main

  watchdog-wake:
    name: Hourly fallback scan for red PRs
    if: github.event_name == 'schedule'
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    uses: ./.github/workflows/ci-repair-sweep.yml
    with:
      reason: scheduled watchdog

  manual-wake:
    name: Manually wake guarded CI repair bot
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    uses: ./.github/workflows/ci-repair-sweep.yml
    with:
      reason: manual workflow_dispatch
