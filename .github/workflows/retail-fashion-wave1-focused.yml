name: Retail Fashion Wave 1 Focused

on:
  pull_request:
    branches: [main]
    paths:
      - "shared/schema/retail.ts"
      - "migrations/**"
      - "server/routes/retailRoutes.ts"
      - "server/routes/retailCatalogRoutes.ts"
      - "server/routes/pos/retailPosRoutes.ts"
      - "server/services/retail/**"
      - "client/src/pages/retail/**"
      - "client/src/pages/pos/RetailPOS.tsx"
      - "tests/retail-fashion-variants-wave1.test.ts"
      - ".github/workflows/retail-fashion-wave1-focused.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - run: node node_modules/vitest/vitest.mjs run tests/retail-fashion-variants-wave1.test.ts
      - run: npm run check
