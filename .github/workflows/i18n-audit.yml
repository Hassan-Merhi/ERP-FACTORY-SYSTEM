name: I18n Audit

on:
  push:
    branches: [main]

concurrency:
  group: i18n-audit-${{ github.ref }}
  # Main is the automatic verification branch.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    name: Classified untranslated-text audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up canonical Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"

      - name: Verify audit classifier contract
        run: node scripts/verify-i18n-audit-classifier.mjs

      - name: Enforce reviewed untranslated-text ratchet
        run: |
          node scripts/audit-i18n-phase14.mjs \
            --json-out artifacts/i18n-audit/report.json \
            --markdown-out artifacts/i18n-audit/report.md
          cat artifacts/i18n-audit/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload classified audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: classified-i18n-audit
          path: artifacts/i18n-audit
          if-no-files-found: warn
          retention-days: 7
