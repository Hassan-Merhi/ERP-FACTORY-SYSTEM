name: Temporary Finalized Returns Prettier
on:
  push:
    branches:
      - feature/factory-finalized-loading-sale-returns
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Clone branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch "${GITHUB_REF_NAME}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Format modified files
        working-directory: repo
        run: |
          npm ci --no-audit --bin-links=true
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/components/FactorySidebar.tsx \
            client/src/pages/factory/FactoryFinalizedSaleReturns.tsx \
            client/src/pages/factory/FactoryOthers.tsx \
            server/routes/factory/customer-orders/bale-scanning/finalized-returns.ts \
            client/src/i18n/factoryFinalizedSaleReturnTranslations.ts
      - name: Commit formatting
        working-directory: repo
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/components/FactorySidebar.tsx \
            client/src/pages/factory/FactoryFinalizedSaleReturns.tsx \
            client/src/pages/factory/FactoryOthers.tsx \
            server/routes/factory/customer-orders/bale-scanning/finalized-returns.ts \
            client/src/i18n/factoryFinalizedSaleReturnTranslations.ts
          git commit -m "style(factory): format finalized loading return corrections"
          git push origin "HEAD:${GITHUB_REF_NAME}"
