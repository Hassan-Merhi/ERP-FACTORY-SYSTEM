name: Desktop Shell

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "tests/e2e/desktop-shell/**"
      - "tests/desktop-shell-behavior.test.ts"
      - ".github/workflows/desktop-shell.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "tests/e2e/desktop-shell/**"
      - "tests/desktop-shell-behavior.test.ts"
      - ".github/workflows/desktop-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-shell:
    name: Launch the real Electron shell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund

      # --ignore-scripts skips Electron's own download step, so run only that one.
      - name: Download the Electron binary
        working-directory: desktop
        run: node node_modules/electron/install.js

      - name: Install a virtual display
        run: |
          set -euo pipefail
          if ! command -v xvfb-run > /dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends xvfb
          fi

      # The harness resolves the production host to a local HTTPS server and
      # every other host to "not found", so no request leaves the runner.
      - name: Launch the shell online and offline
        run: xvfb-run --auto-servernum node tests/e2e/desktop-shell/run.mjs
