name: Offline Phase 8 apply + receipt contracts

on:
  push:
    branches:
      - feat/offline-mode-integration
    paths:
      - 'server/edge/phase8*.mjs'
      - 'server/edge/phase8*.d.mts'
      - 'server/edge/phase8*.ts'
      - 'server/edge/phase8VoucherPolicy.mjs'
      - 'server/edge/phase8VoucherPolicy.d.mts'
      - 'server/edge/edgeBoundary.ts'
      - 'server/edge/edgeSyncReceiver.ts'
      - 'server/edge/edgeVoucherOutbox.ts'
      - 'server/routes/vouchers/centralGenericVoucherCreateRoute.ts'
      - 'scripts/edge/fetch-applied-receipts.mjs'
      - 'tests/offline-phase8*.mjs'

      - 'server/edge/phase9*.mjs'
      - 'server/edge/phase9*.d.mts'
      - 'client/src/components/OfflineWriteStatusPanel.tsx'
      - 'client/src/components/OfflinePrepPanel.tsx'
      - 'client/src/lib/offline/phase9Status.ts'
      - 'client/src/lib/offline/operationContract.ts'
      - 'client/src/lib/offline/durableOutbox.ts'
      - 'server/edge/phase8CapturePolicy.mjs'
      - 'tests/ui/offline-operation-contract.test.ts'
      - 'tests/ui/offline-durable-outbox.test.ts'
      - 'client/src/lib/offline/voucherCapture.ts'
      - 'server/edge/edgeVoucherOutbox.ts'
      - 'tests/factory-edge-policy.test.ts'
      - 'scripts/edge/audit-phase9-write-coverage.mjs'
      - 'tests/offline-phase9*.mjs'
      - 'tests/offline-phase9*.ts'
      - 'tests/ui/offline-phase9*.ts'
      - 'tests/ui/offline-phase9*.tsx'
      - 'client/src/components/OfflineBanner.tsx'
      - 'client/src/contexts/ConnectivityContext.tsx'
      - 'client/src/lib/offlineQueue.ts'
      - 'client/src/lib/db.ts'
      - 'client/src/lib/syncEngine.ts'
      - 'client/src/components/PendingSyncIndicator.tsx'
      - '.github/workflows/offline-phase8-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase8-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: phase8-test-admin-pass
          POSTGRES_DB: postgres
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify Phase 8 pure rejection and receipt contracts
        run: node --test tests/offline-phase8-contract.test.mjs
      - name: Refuse unsafe initial voucher source shapes
        run: node --test tests/offline-phase8-posting-shape.test.mjs
      - name: Verify Phase 9 scoped status + full write inventory safety
        run: node --test tests/offline-phase9-status.node.test.mjs tests/offline-phase9-write-coverage.node.test.mjs
      - name: Audit all registered business writes (unapproved paths remain blocked)
        run: node scripts/edge/audit-phase9-write-coverage.mjs
      - name: Verify Phase 9 client receipt/status separation
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts tests/ui/offline-phase9-status.test.ts
      - name: Exercise exactly-once posting on disposable PostgreSQL 17
        env:
          PHASE8_TEST_DATABASE_URL: postgresql://postgres:phase8-test-admin-pass@127.0.0.1:55433/postgres
        run: node --test tests/offline-phase8-postgres.test.mjs
      - name: Do not stamp cloud sync time on LAN-only acceptance
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts tests/ui/offline-phase9-sync-event.test.ts
      - name: Refuse new unverified legacy browser queue entries
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts tests/ui/offline-phase9-legacy-queue.test.ts
      - name: Test legacy banner cannot replay unverified writes
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts tests/ui/offline-phase9-legacy-banner.test.tsx
      - name: Verify narrow device capture and legacy queue quarantine
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts tests/ui/offline-operation-contract.test.ts tests/ui/offline-durable-outbox.test.ts
      - name: Prove immutable LAN capture cannot substitute operation identity
        run: node node_modules/vitest/vitest.mjs run tests/offline-phase9-outbox-identity.test.ts
      - name: Test Phase 9 status live-session and membership gating
        run: node node_modules/vitest/vitest.mjs run tests/offline-phase9-status-http.test.ts
      - name: Validate TypeScript on unified branch
        run: npm run check
