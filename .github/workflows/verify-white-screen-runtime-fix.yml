name: Verify White Screen Runtime Fix

on:
  push:
    branches:
      - fix/white-screen-runtime-translation

permissions:
  contents: write

jobs:
  fix-and-smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/white-screen-runtime-translation
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Remove runtime-only expressions from translation registry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('client/src/i18n/posItemReplacement.applicationTranslations.ts')
          text = path.read_text()
          before = text

          patterns = [
              r'\n  \{\n    en: `Updated \$\{committed\.updatedVoucherIds\.length\} POS sale.*?\n  \},',
              r'\n  \{\n    en: `\$\{displayQty\(result\.replacedQuantity\)\} qty replaced across .*?\n  \},',
          ]
          for pattern in patterns:
              text, count = re.subn(pattern, '', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected exactly one unsafe translation block for pattern: {pattern!r}; got {count}')

          for token in ('committed.updatedVoucherIds', 'displayQty(result.replacedQuantity)', 'result.updatedVoucherIds'):
              if token in text:
                  raise SystemExit(f'Unsafe runtime expression still present in translation registry: {token}')

          if text == before:
              raise SystemExit('Translation registry was not changed')
          path.write_text(text)
          PY

          cat > tests/pos-item-replacement-translation-runtime.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";

          describe("POS item replacement translation runtime safety", () => {
            it("imports without evaluating page/server-only runtime variables", async () => {
              const translations = await import(
                "../client/src/i18n/posItemReplacement.applicationTranslations"
              );

              expect(translations.translatePosItemReplacementLiteral("Updated 1 POS sale", "fr")).toBe(
                "1 vente POS mise à jour"
              );
              expect(translations.translatePosItemReplacementLiteral("Updated 2 POS sales", "fr")).toBe(
                "2 ventes POS mises à jour"
              );
              expect(translations.translatePosItemReplacement("correctedTitle", "en")).toBe(
                "POS items corrected"
              );
            });
          });
          EOF
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Run translation regression test
        run: npx vitest run tests/pos-item-replacement-translation-runtime.test.ts
      - name: Verify exact Render production build
        run: node build.mjs
      - name: Verify built client assets
        run: |
          set -euo pipefail
          test -s dist/public/index.html
          test -n "$(find dist/public/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/public/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          grep -q '<script' dist/public/index.html
      - name: Browser smoke test built frontend
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/vite-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true' EXIT
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer';
          const browser = await puppeteer.launch({ headless: true, args: ['--no-sandbox'] });
          const page = await browser.newPage();
          const pageErrors = [];
          page.on('pageerror', (error) => pageErrors.push(String(error)));
          const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle2', timeout: 30000 });
          await new Promise((resolve) => setTimeout(resolve, 1500));
          const state = await page.evaluate(() => ({
            rootHtmlLength: document.getElementById('root')?.innerHTML.length ?? 0,
            bodyHtmlLength: document.body.innerHTML.length,
            bodyText: document.body.innerText.slice(0, 500),
          }));
          console.log(JSON.stringify({ status: response?.status(), state, pageErrors }, null, 2));
          await browser.close();
          if (!response || response.status() >= 400) process.exit(1);
          if (state.rootHtmlLength < 20 || state.bodyHtmlLength < 50) process.exit(1);
          if (pageErrors.length) process.exit(1);
          NODE
      - name: Commit verified runtime fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/i18n/posItemReplacement.applicationTranslations.ts tests/pos-item-replacement-translation-runtime.test.ts
          if git diff --cached --quiet; then
            echo 'No runtime fix changes to commit.'
            exit 0
          fi
          git commit -m 'fix: prevent POS translation registry startup crash'
          git push origin HEAD:fix/white-screen-runtime-translation
