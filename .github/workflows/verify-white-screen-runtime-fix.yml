name: Verify White Screen Runtime Fix

on:
  pull_request:
    paths:
      - 'client/src/i18n/posItemReplacement.applicationTranslations.ts'
      - 'client/src/i18n/posItemReplacement.applicationTranslations.test.ts'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - run: npx vitest run --config vitest.config.frontend.ts client/src/i18n/posItemReplacement.applicationTranslations.test.ts
      - run: node build.mjs
