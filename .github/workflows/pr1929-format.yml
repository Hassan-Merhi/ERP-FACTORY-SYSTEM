name: PR 1929 one-shot formatter

on:
  push:
    branches:
      - codex/move-recurring-journals-settings

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/move-recurring-journals-settings
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format changed recurring journal files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/settings/RecurringJournalsTab.tsx \
            server/routes/vouchers/recurringJournalRoutes.ts
          node node_modules/prettier/bin/prettier.cjs --check \
            client/src/pages/settings/RecurringJournalsTab.tsx \
            server/routes/vouchers/recurringJournalRoutes.ts

      - name: Commit formatted source and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr1929-format.yml
          git add client/src/pages/settings/RecurringJournalsTab.tsx server/routes/vouchers/recurringJournalRoutes.ts
          git commit -m "Format recurring journal access fixes"
          git push origin HEAD:codex/move-recurring-journals-settings
