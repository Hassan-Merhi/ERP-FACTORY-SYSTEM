name: Phase 3 Closeout Autofix

on:
  push:
    branches:
      - phase3/reconciliation-accounting-audit

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase3/reconciliation-accounting-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Phase 3 closeout fixes
        run: node scripts/phase3-closeout-autofix.mjs

      - name: Fix lint and formatting
        run: |
          node node_modules/eslint/bin/eslint.js \
            server/routes/payroll/_payrollAccountingHelper.ts \
            server/routes/payroll/core/mark-paid.ts \
            server/services/accounting/databasePhase3AccountingAudit.ts \
            server/services/accounting/phase3AccountingAudit.ts \
            server/services/accounting/phase3HistoricalRepair.ts \
            server/services/accounting/phase3InventoryValuation.ts \
            server/services/accounting/phase3PayrollDaybookRepair.ts \
            server/services/accounting/voucherLedgerExpectation.ts \
            server/startup/ensureRuntimeSchema.ts \
            tests/voucher-ledger-expectation.test.ts \
            --fix
          node node_modules/prettier/bin/prettier.cjs --write \
            server/routes/payroll/_payrollAccountingHelper.ts \
            server/routes/payroll/core/mark-paid.ts \
            server/services/accounting/databasePhase3AccountingAudit.ts \
            server/services/accounting/phase3AccountingAudit.ts \
            server/services/accounting/phase3HistoricalRepair.ts \
            server/services/accounting/phase3InventoryValuation.ts \
            server/services/accounting/phase3PayrollDaybookRepair.ts \
            server/services/accounting/voucherLedgerExpectation.ts \
            server/startup/ensureRuntimeSchema.ts \
            tests/voucher-ledger-expectation.test.ts

      - name: Verify write-evidence ratchet
        run: node scripts/audit-write-evidence.mjs

      - name: Run focused Phase 3 tests
        run: >-
          node node_modules/vitest/vitest.mjs run
          tests/phase3-accounting-audit.test.ts
          tests/phase3-inventory-valuation.test.ts
          tests/voucher-ledger-expectation.test.ts

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/routes/payroll/_payrollAccountingHelper.ts \
            server/routes/payroll/core/mark-paid.ts \
            server/services/accounting/databasePhase3AccountingAudit.ts \
            server/services/accounting/phase3AccountingAudit.ts \
            server/services/accounting/phase3HistoricalRepair.ts \
            server/services/accounting/phase3InventoryValuation.ts \
            server/services/accounting/phase3PayrollDaybookRepair.ts \
            server/services/accounting/voucherLedgerExpectation.ts \
            server/startup/ensureRuntimeSchema.ts \
            tests/voucher-ledger-expectation.test.ts
          if git diff --cached --quiet; then
            echo "No autofix changes required"
          else
            git commit -m "Fix Phase 3 accounting closeout gates"
            git push origin HEAD:phase3/reconciliation-accounting-audit
          fi
