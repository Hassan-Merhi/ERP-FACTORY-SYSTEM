name: Temporary Intercompany Branch Formatter
on:
  push:
    branches:
      - feature/intercompany-container-trading
    paths:
      - .github/workflows/intercompany-branch-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[phase2-format-once]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intercompany-container-trading
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install format dependencies
        run: npm ci --ignore-scripts --no-audit --bin-links=true
      - name: Format only Phase 1 and Phase 2 changed files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/GITContainers.tsx \
            client/src/pages/Suppliers.tsx \
            client/src/pages/containers/ContainerToolbar.tsx \
            client/src/pages/Containers.tsx \
            client/src/pages/EditSupplier.tsx \
            client/src/pages/SupplierProformas.tsx \
            client/src/pages/AccountingCreate.tsx \
            client/src/pages/containerdetail/useContainerDetailModel.tsx \
            client/src/pages/containerdetail/components/ContainerDetailErpView.tsx \
            client/src/pages/containers/ActiveContainersTable.tsx \
            client/src/pages/git-containers/ContainerTable.tsx \
            client/src/pages/git-containers/gitTrackingPatchUrl.ts \
            client/src/pages/properties/PropertiesContainerTrading.tsx \
            client/src/pages/suppliers/useSuppliersFilters.ts \
            client/src/pages/git-containers/ContainerTable.tsx \
            client/src/pages/tracking/TrackingContainersTab.tsx \
            client/src/pages/properties/PropertiesContainerTrading.tsx \
            client/src/properties/config/propertiesNavigation.ts \
            client/src/components/PropertiesSidebar.tsx \
            client/src/app/PropertiesRoutes.tsx \
            client/src/i18n/intercompanyTradingSetupTranslations.ts \
            server/routes/import/intercompany-container-trading.ts \
            server/services/intercompany/containerTradingImport.ts \
            server/services/intercompany/tradingAccountProvisioning.ts \
            server/services/intercompany/tradingProvisioningPlan.ts \
            server/services/intercompany/tradingProvisioningMessages.ts \
            tests/intercompany-auto-provisioning.test.ts \
            tests/properties-intercompany-phase1-navigation.test.ts
      - name: Commit formatting only to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src server/routes/import/intercompany-container-trading.ts server/services/intercompany tests/intercompany-auto-provisioning.test.ts tests/properties-intercompany-phase1-navigation.test.ts
          if git diff --cached --quiet; then
            echo "All targeted files already formatted"
          else
            git commit -m "style(intercompany): format Phase 1 and Phase 2 source"
            git push origin HEAD:feature/intercompany-container-trading
          fi
