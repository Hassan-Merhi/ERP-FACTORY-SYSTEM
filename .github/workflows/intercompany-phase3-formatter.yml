name: Temporary Phase 3 PO Import Formatter
on:
  push:
    branches:
      - feature/intercompany-container-trading
    paths:
      - .github/workflows/intercompany-phase3-formatter.yml
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[phase3-format-once]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intercompany-container-trading
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install formatting dependencies
        run: npm ci --ignore-scripts --no-audit --bin-links=true
      - name: Format Phase 3 changes
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/i18n/propertiesPoImportTranslations.ts \
            client/src/pages/poimport/PropertiesIntercompanyPOImport.tsx \
            client/src/pages/poimport/propertiesDestinationSelections.ts \
            client/src/pages/POImport.tsx \
            client/src/app/PropertiesRoutes.tsx \
            client/src/components/PropertiesSidebar.tsx \
            client/src/pages/containers/ContainerToolbar.tsx \
            client/src/properties/config/propertiesNavigation.ts \
            tests/properties-po-import-intercompany-phase3.test.ts
      - name: Commit formatting on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/i18n/propertiesPoImportTranslations.ts client/src/pages/poimport client/src/pages/POImport.tsx client/src/app/PropertiesRoutes.tsx client/src/components/PropertiesSidebar.tsx client/src/pages/containers/ContainerToolbar.tsx client/src/properties/config/propertiesNavigation.ts tests/properties-po-import-intercompany-phase3.test.ts
          if git diff --cached --quiet; then
            echo "Phase 3 files already formatted"
          else
            git commit -m "style(properties): format Phase 3 import workflow"
            git push origin HEAD:feature/intercompany-container-trading
          fi
