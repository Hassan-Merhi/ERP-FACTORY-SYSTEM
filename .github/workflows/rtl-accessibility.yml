name: RTL and Accessibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtl-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up canonical Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Check RTL/accessibility formatting
        run: |
          node node_modules/prettier/bin/prettier.cjs --check \
            client/src/app/ErpShell.tsx \
            client/src/app/FactoryShell.tsx \
            client/src/app/PosShell.tsx \
            client/src/app/PropertiesShell.tsx \
            client/src/components/AppTopBar.tsx \
            client/src/components/ApplicationInterfaceTranslator.tsx \
            client/src/components/ui/dialog.tsx \
            client/src/components/ui/responsive-accessibility.tsx \
            client/src/components/ui/sheet.tsx \
            client/src/contexts/ApplicationLanguageContext.tsx \
            client/src/i18n/applicationDirection.test.ts \
            client/src/i18n/applicationDirection.ts \
            client/src/i18n/applicationTranslations.ts \
            client/src/styles/rtl-hardening.css \
            docs/archive/translation/phase-8-rtl-responsive-accessibility.md \
            scripts/audit-i18n-phase14.mjs \
            scripts/verify-program7d-accessibility-responsive.mjs \
            tests/phase14-i18n-release-gate.test.ts \
            tests/phase8-rtl-responsive-accessibility.test.ts \
            vitest.config.i18n-contracts.ts

      - name: TypeScript
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Accessibility and RTL verifier
        run: node scripts/verify-program7d-accessibility-responsive.mjs

      - name: Trilingual release contracts
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.i18n-contracts.ts

      - name: Frontend regression tests
        run: npm run test:frontend

      - name: Classified i18n audit
        run: node scripts/audit-i18n-phase14.mjs
