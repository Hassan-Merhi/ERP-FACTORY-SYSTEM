name: Phase 5 Final Mutation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Prepare reviewed install-script policy
        run: |
          npm ci --ignore-scripts --no-audit
          npm approve-scripts bufferutil fsevents
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify strict install-script policy
        run: |
          npm ci --no-audit
          if npm approve-scripts --allow-scripts-pending 2>&1 | grep -q 'not yet covered'; then
            echo 'Unreviewed install scripts remain.'
            npm approve-scripts --allow-scripts-pending
            exit 1
          fi
      - name: Make remaining native Vite imports explicit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const replacements = new Map([
            ['build/vitePhase1PaginationGuardPlugin.ts', [
              ['./vitePhase1PaginationPlugin"', './vitePhase1PaginationPlugin.ts"'],
            ]],
            ['build/viteHeavyListPaginationPlugin.ts', [
              ['./viteHeavyListPaginationPluginLegacy"', './viteHeavyListPaginationPluginLegacy.ts"'],
            ]],
          ]);
          for (const [file, pairs] of replacements) {
            let content = fs.readFileSync(file, 'utf8');
            for (const [from, to] of pairs) content = content.replaceAll(from, to);
            fs.writeFileSync(file, content);
          }
          NODE
      - name: Verify native Vite config loader
        run: node --max-old-space-size=4096 node_modules/vite/bin/vite.js build --configLoader native
      - name: Commit final mutations
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json build/vitePhase1PaginationGuardPlugin.ts build/viteHeavyListPaginationPlugin.ts
          git commit -m 'chore(toolchain): finalize reviewed scripts and Vite imports'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
