name: Phase 5 Final Mutation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Finalize package policy and native Vite imports
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.allowScripts ??= {};
          pkg.allowScripts['bufferutil@4.1.0'] = true;
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const replacements = new Map([
            ['vite.config.ts', [
              ['./build/viteHeavyListPaginationPlugin"', './build/viteHeavyListPaginationPlugin.ts"'],
              ['./build/viteSalesReportBandwidthPlugin"', './build/viteSalesReportBandwidthPlugin.ts"'],
              ['./build/viteSalesReportInvalidationPlugin"', './build/viteSalesReportInvalidationPlugin.ts"'],
              ['./build/vitePhase1PaginationGuardPlugin"', './build/vitePhase1PaginationGuardPlugin.ts"'],
              ['./build/viteLazyHeavyImportsPlugin"', './build/viteLazyHeavyImportsPlugin.ts"'],
              ['./build/viteLabelAssetExtractionPlugin"', './build/viteLabelAssetExtractionPlugin.ts"'],
            ]],
            ['build/vitePhase1PaginationGuardPlugin.ts', [
              ['./vitePhase1PaginationPlugin"', './vitePhase1PaginationPlugin.ts"'],
            ]],
            ['build/viteHeavyListPaginationPlugin.ts', [
              ['./viteHeavyListPaginationPluginLegacy"', './viteHeavyListPaginationPluginLegacy.ts"'],
            ]],
          ]);
          for (const [file, pairs] of replacements) {
            let content = fs.readFileSync(file, 'utf8');
            for (const [from, to] of pairs) content = content.replaceAll(from, to);
            fs.writeFileSync(file, content);
          }
          NODE
      - name: Refresh and verify npm metadata
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit
          test -z "$(npm approve-scripts --allow-scripts-pending 2>&1 | grep 'not yet covered' || true)"
      - name: Verify native Vite config loader
        run: node --max-old-space-size=4096 node_modules/vite/bin/vite.js build --configLoader native
      - name: Commit final mutations
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json vite.config.ts build/vitePhase1PaginationGuardPlugin.ts build/viteHeavyListPaginationPlugin.ts
          git commit -m 'chore(toolchain): finalize reviewed scripts and Vite imports'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
