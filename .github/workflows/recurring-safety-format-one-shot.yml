name: Recurring safety one-shot format repair

on:
  push:
    branches:
      - fix/recurring-journal-posting-safety

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/recurring-journal-posting-safety
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format recurring safety files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/accounting/recurringJournalService.ts \
            tests/recurring-journal-scheduling.test.ts

      - name: Verify focused files
        run: |
          node node_modules/prettier/bin/prettier.cjs --check \
            server/services/accounting/recurringJournalService.ts \
            tests/recurring-journal-scheduling.test.ts

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/recurring-safety-format-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/recurring-safety-format-one-shot.yml \
            server/services/accounting/recurringJournalService.ts \
            tests/recurring-journal-scheduling.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style: format recurring journal safety fixes"
          git push origin HEAD:fix/recurring-journal-posting-safety
