name: Temporary Properties PR 2839 Merge-Formatter
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.number == 2839 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --no-audit
      - name: Reformat updated Properties rental backend
        run: node node_modules/prettier/bin/prettier.cjs --write server/routes/rental/rentalPaymentsAccrualRoutes.ts
      - name: Push formatting-only commit if needed
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add server/routes/rental/rentalPaymentsAccrualRoutes.ts
          if git diff --cached --quiet; then
            echo "Properties rental backend is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(properties): format rental backend after main sync"
          git push origin "HEAD:$BRANCH"
