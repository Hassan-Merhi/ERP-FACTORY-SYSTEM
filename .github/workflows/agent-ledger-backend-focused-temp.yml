name: Temporary Agent Ledger Backend Regression
on:
  push:
    branches:
      - fix/factory-agent-ledger-company-scope-20261009
permissions:
  contents: read
jobs:
  targeted-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: ci-session-secret
      ENABLE_SCHEDULERS: "false"
      CSRF_ENFORCE: "0"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
      - run: npm ci --no-audit --bin-links=true
      - run: node node_modules/drizzle-kit/bin.cjs push --force
      - name: Run previously failing suites
        run: |
          npm run test:backend -- tests/account-statement-routes-behavior.test.ts tests/route-manifest.test.ts tests/source-text-assertions.test.ts tests/factory-agent-ledger-company-scope.test.ts --maxWorkers=2
