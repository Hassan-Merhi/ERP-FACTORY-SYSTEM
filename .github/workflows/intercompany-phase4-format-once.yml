name: Temporary Phase 4 Intercompany Stock Formatter
on:
  push:
    branches:
      - feature/intercompany-container-trading
    paths:
      - .github/workflows/intercompany-phase4-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[phase4-format-once]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intercompany-container-trading
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install formatting dependencies
        run: npm ci --ignore-scripts --no-audit --bin-links=true
      - name: Format only Phase 4 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/intercompany/destinationStockMapping.ts \
            server/services/intercompany/stockMatchingMessages.ts \
            server/services/intercompany/destinationStockPreview.ts \
            server/services/intercompany/containerTradingImport.ts \
            server/routes/import/intercompany-container-trading.ts \
            client/src/pages/poimport/PropertiesIntercompanyPOImport.tsx \
            client/src/i18n/propertiesPoImportTranslations.ts \
            tests/intercompany-phase4-auto-stock.test.ts
      - name: Commit formatting to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/intercompany/destinationStockMapping.ts server/services/intercompany/stockMatchingMessages.ts server/services/intercompany/destinationStockPreview.ts server/services/intercompany/containerTradingImport.ts server/routes/import/intercompany-container-trading.ts client/src/pages/poimport/PropertiesIntercompanyPOImport.tsx client/src/i18n/propertiesPoImportTranslations.ts tests/intercompany-phase4-auto-stock.test.ts
          if git diff --cached --quiet; then
            echo "Phase 4 files already formatted"
          else
            git commit -m "style(intercompany): format Phase 4 stock verification and provisioning"
            git push origin HEAD:feature/intercompany-container-trading
          fi
