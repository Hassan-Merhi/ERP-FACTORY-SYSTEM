# Exact-head Phase 33 certification trigger.
name: Phase 33 parallel backend coverage

on:
  push:
    branches:
      - test/phase33-final-80-80-80-70-closure

permissions:
  contents: read

concurrency:
  group: phase33-parallel-coverage
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
  PGSSLMODE: disable
  NODE_ENV: test
  SESSION_SECRET: ci-session-secret
  CSRF_ENFORCE: "0"
  ENABLE_SCHEDULERS: "false"
  NODE_OPTIONS: --max-old-space-size=4096
  PORT: "5000"
  BACKEND_TEST_SHARDS: "8"
  BACKEND_TEST_COVERAGE_SHARD_BUDGET_SECONDS: "900"

jobs:
  coverage-shard:
    name: Coverage shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Prepare schema
        run: node node_modules/drizzle-kit/bin.cjs push --force

      - name: Run application startup migrations
        run: |
          npm run build
          node dist/index.js > "$RUNNER_TEMP/startup.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for _attempt in $(seq 1 180); do
            if curl --fail --silent "http://127.0.0.1:${PORT}/api/health/db" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/startup.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/startup.log"
          exit 1

      - name: Run coverage shard
        env:
          BACKEND_TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -o pipefail
          node scripts/run-backend-verification.mjs --coverage 2>&1 | tee "phase33-shard-${{ matrix.shard }}.log"

      - name: Upload shard output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase33-shard-${{ matrix.shard }}
          path: |
            coverage/backend-shards/shard-${{ matrix.shard }}/coverage-final.json
            .artifacts/backend-verification/shard-${{ matrix.shard }}.json
            phase33-shard-${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 7

  merge:
    name: Merge exact backend coverage
    needs: coverage-shard
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Download shard artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: phase33-shard-*
          path: downloaded-shards

      - name: Assemble merged coverage inputs
        shell: bash
        run: |
          set -euo pipefail
          for shard in 0 1 2 3 4 5 6 7; do
            artifact_dir="downloaded-shards/phase33-shard-${shard}"
            src="${artifact_dir}/coverage-final.json"
            report="${artifact_dir}/.artifacts/backend-verification/shard-${shard}.json"
            dest="coverage/backend-shards/shard-${shard}/coverage-final.json"
            mkdir -p "$(dirname "$dest")"

            if [ -f "$src" ]; then
              cp "$src" "$dest"
              continue
            fi

            if [ -f "$report" ]; then
              node - "$report" "$dest" <<'NODE'
          const fs = require('fs');
          const [reportPath, destPath] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          if (!report.coverageMap || typeof report.coverageMap !== 'object') {
            throw new Error(`Missing coverageMap in ${reportPath}`);
          }
          fs.writeFileSync(destPath, JSON.stringify(report.coverageMap));
          NODE
              continue
            fi

            echo "::error::Missing both coverage output and JSON reporter coverage for shard ${shard}"
            find "$artifact_dir" -maxdepth 5 -type f -print || true
            exit 1
          done

      - name: Merge and enforce repository floors
        run: node scripts/run-backend-verification.mjs --merge-only

      - name: Print exact Phase 33 coverage
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('coverage/backend/coverage-summary.json','utf8')).total;
          for (const k of ['lines','statements','functions','branches']) console.log(`${k}: ${s[k].pct}% (${s[k].covered}/${s[k].total})`);
          NODE

      - name: Enforce Phase 33 target
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const total = JSON.parse(fs.readFileSync('coverage/backend/coverage-summary.json', 'utf8')).total;
          const target = { lines: 80, statements: 80, functions: 80, branches: 70 };
          const failures = [];
          for (const [metric, floor] of Object.entries(target)) {
            const pct = total[metric].pct;
            if (pct < floor) failures.push(`${metric}: ${pct}% < ${floor}%`);
          }
          if (failures.length) {
            console.error('Phase 33 coverage target not met:\n' + failures.map((x) => ` - ${x}`).join('\n'));
            process.exit(1);
          }
          console.log('Phase 33 coverage target met: 80% lines / 80% statements / 80% functions / 70% branches.');
          NODE

      - name: Upload exact coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase33-exact-backend-coverage
          path: coverage/backend/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve shard test failures
        if: ${{ needs.coverage-shard.result != 'success' }}
        run: |
          echo "::error::One or more coverage shards failed tests; exact coverage was still merged above for diagnosis."
          exit 1
