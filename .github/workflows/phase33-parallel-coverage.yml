name: Phase 33 parallel backend coverage

on:
  push:
    branches:
      - test/phase33-final-80-80-80-70-closure
    paths:
      - .github/workflows/phase33-parallel-coverage.yml

permissions:
  contents: read

concurrency:
  group: phase33-parallel-coverage
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
  PGSSLMODE: disable
  NODE_ENV: test
  SESSION_SECRET: ci-session-secret
  CSRF_ENFORCE: "0"
  ENABLE_SCHEDULERS: "false"
  NODE_OPTIONS: --max-old-space-size=4096
  PORT: "5000"
  BACKEND_TEST_SHARDS: "8"
  BACKEND_TEST_COVERAGE_SHARD_BUDGET_SECONDS: "900"

jobs:
  coverage-shard:
    name: Coverage shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: test/phase33-final-80-80-80-70-closure

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Prepare schema
        run: node node_modules/drizzle-kit/bin.cjs push --force

      - name: Run application startup migrations
        run: |
          npm run build
          node dist/index.js > "$RUNNER_TEMP/startup.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for _attempt in $(seq 1 180); do
            if curl --fail --silent "http://127.0.0.1:${PORT}/api/health/db" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/startup.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/startup.log"
          exit 1

      - name: Run coverage shard
        env:
          BACKEND_TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -o pipefail
          node scripts/run-backend-verification.mjs --coverage 2>&1 | tee "phase33-shard-${{ matrix.shard }}.log"

      - name: Upload shard output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase33-shard-${{ matrix.shard }}
          path: |
            coverage/backend-shards/shard-${{ matrix.shard }}/coverage-final.json
            phase33-shard-${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 7

  merge:
    name: Merge exact backend coverage
    needs: coverage-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: test/phase33-final-80-80-80-70-closure

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Download shard artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: phase33-shard-*
          path: downloaded-shards

      - name: Assemble merged coverage inputs
        shell: bash
        run: |
          set -euo pipefail
          for shard in 0 1 2 3 4 5 6 7; do
            src="downloaded-shards/phase33-shard-${shard}/coverage-final.json"
            if [ ! -f "$src" ]; then
              echo "::error::Missing coverage output for shard ${shard}"
              find downloaded-shards -maxdepth 3 -type f -print || true
              exit 1
            fi
            mkdir -p "coverage/backend-shards/shard-${shard}"
            cp "$src" "coverage/backend-shards/shard-${shard}/coverage-final.json"
          done

      - name: Merge and enforce current floors
        run: node scripts/run-backend-verification.mjs --merge-only

      - name: Print exact Phase 33 coverage
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('coverage/backend/coverage-summary.json','utf8')).total;
          for (const k of ['lines','statements','functions','branches']) console.log(`${k}: ${s[k].pct}% (${s[k].covered}/${s[k].total})`);
          NODE

      - name: Upload exact coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase33-exact-backend-coverage
          path: coverage/backend/coverage-summary.json
          if-no-files-found: error
          retention-days: 7
