name: Temporary Retail Formatter

on:
  push:
    branches:
      - fix/retail-erp-integration-product-form

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format retail inventory and clean temporary files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write client/src/pages/retail/RetailInventory.tsx
          rm -f tests/retail-format-canonical-output.test.ts
          rm -f .github/workflows/temp-retail-format.yml
          node node_modules/prettier/bin/prettier.cjs --check client/src/pages/retail/RetailInventory.tsx

      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/retail/RetailInventory.tsx tests/retail-format-canonical-output.test.ts .github/workflows/temp-retail-format.yml
          if git diff --cached --quiet; then
            echo "No formatter changes to commit."
            exit 0
          fi
          git commit -m "Format retail inventory implementation"
          git push origin HEAD:fix/retail-erp-integration-product-form
