name: Phase 33G Temporary Formatter

on:
  push:
    branches:
      - test/phase33g-high-line-misc-20260917

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format Phase 33G test
        run: node node_modules/prettier/bin/prettier.cjs --write tests/phase33g-high-line-misc.test.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- tests/phase33g-high-line-misc.test.ts; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/phase33g-high-line-misc.test.ts
          git commit -m "style: format Phase 33G behavioral coverage"
          git push
