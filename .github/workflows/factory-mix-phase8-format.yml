name: Factory Mix Phase 8 Format
on:
  push:
    branches:
      - fix/factory-mix-cost-integrity-20261109
permissions:
  contents: write
jobs:
  format:
    if: "!startsWith(github.event.head_commit.message, 'style(factory): autoformat Phase 8 changed files')"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only files modified by this branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git diff --name-only -z --diff-filter=ACMR origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.json' '*.css' '*.md' '*.yml' '*.yaml' |
            xargs -0 -r ./node_modules/.bin/prettier --write
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "style(factory): autoformat Phase 8 changed files"
            git push origin HEAD:fix/factory-mix-cost-integrity-20261109
          fi
