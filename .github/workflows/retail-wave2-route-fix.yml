name: Retail Wave 2 Route Fix

on:
  push:
    branches:
      - feat/retail-pos-stock-movement-wave2

permissions:
  contents: write

jobs:
  route-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/retail-pos-stock-movement-wave2
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Fix retail POS navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"target not found in {path}: {old[:180]!r}")
              p.write_text(s.replace(old, new, 1))

          app_routes = "client/src/routes/AppRoutes.tsx"
          replace_once(
              app_routes,
              'const RetailInventory = lazy(() => import("@/pages/retail/RetailInventory"));\n',
              'const RetailInventory = lazy(() => import("@/pages/retail/RetailInventory"));\nconst RetailPOS = lazy(() => import("@/pages/pos/RetailPOS"));\n',
          )
          replace_once(
              app_routes,
              '''  if (location === "/retail" || location.startsWith("/retail/")) {\n    return <RetailInventory />;\n  }''',
              '''  if (location === "/retail/pos") {\n    return <RetailPOS />;\n  }\n\n  if (location === "/retail" || location.startsWith("/retail/")) {\n    return <RetailInventory />;\n  }''',
          )

          pos_routes = "client/src/routes/PosRoutes.tsx"
          replace_once(
              pos_routes,
              'import type { AuthMe } from "@shared/apiTypes";\n',
              'import type { AuthMe } from "@shared/apiTypes";\nimport { useCompany } from "@/contexts/CompanyContext";\nimport RetailPOS from "@/pages/pos/RetailPOS";\n',
          )
          replace_once(
              pos_routes,
              '''export function PosRoutes({ user, posImportEnabled }: PosRoutesProps) {\n  return (''',
              '''export function PosRoutes({ user, posImportEnabled }: PosRoutesProps) {\n  const { selectedCompany } = useCompany();\n\n  if (selectedCompany?.companyType === "retail") {\n    return (\n      <Switch>\n        <Route path="/">{() => <RetailPOS />}</Route>\n        <Route path="/pos">{() => <RetailPOS />}</Route>\n        <Route path="/retail/pos">{() => <RetailPOS />}</Route>\n        <Route path="/my-settings" component={MySettings} />\n        <Route>{() => <Redirect to="/" />}</Route>\n      </Switch>\n    );\n  }\n\n  return (''',
          )

          inventory = "client/src/pages/retail/RetailInventory.tsx"
          replace_once(
              inventory,
              'import { ArrowLeft, Boxes, ImageIcon, Pencil, Plus, Upload, X } from "lucide-react";',
              'import { ArrowLeft, Boxes, ImageIcon, Pencil, Plus, ShoppingCart, Upload, X } from "lucide-react";',
          )
          replace_once(
              inventory,
              '''        <div className="flex gap-2">\n          <Button variant="outline" onClick={() => setImportOpen(true)}>''',
              '''        <div className="flex gap-2">\n          <Button variant="secondary" onClick={() => navigate("/retail/pos")}>\n            <ShoppingCart className="h-4 w-4 mr-2" />\n            Open POS\n          </Button>\n          <Button variant="outline" onClick={() => setImportOpen(true)}>''',
          )

          translations = "client/src/i18n/retailWave2Translations.ts"
          replace_once(
              translations,
              '  { en: "Retail POS", ar: "نقطة بيع التجزئة", fr: "PDV de détail" },\n',
              '  { en: "Retail POS", ar: "نقطة بيع التجزئة", fr: "PDV de détail" },\n  { en: "Open POS", ar: "فتح نقطة البيع", fr: "Ouvrir le PDV" },\n',
          )

          tests = "tests/retail-wave2-pos-transactions.test.ts"
          replace_once(
              tests,
              '''  it("supports exact barcode lookup and keyboard wedge scanners", () => {''',
              '''  it("makes the retail POS reachable for managers and POS-role cashiers", () => {\n    const appRoutes = read("client/src/routes/AppRoutes.tsx");\n    const posRoutes = read("client/src/routes/PosRoutes.tsx");\n    const inventory = read("client/src/pages/retail/RetailInventory.tsx");\n\n    expect(appRoutes).toContain('location === "/retail/pos"');\n    expect(appRoutes).toContain("return <RetailPOS />");\n    expect(posRoutes).toContain('selectedCompany?.companyType === "retail"');\n    expect(posRoutes).toContain('<Route path="/">{() => <RetailPOS />}</Route>');\n    expect(posRoutes).toContain('<Route path="/pos">{() => <RetailPOS />}</Route>');\n    expect(inventory).toContain('navigate("/retail/pos")');\n    expect(inventory).toContain("Open POS");\n  });\n\n  it("supports exact barcode lookup and keyboard wedge scanners", () => {''',
          )
          PY

      - name: Format changed files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/routes/AppRoutes.tsx \
            client/src/routes/PosRoutes.tsx \
            client/src/pages/retail/RetailInventory.tsx \
            client/src/i18n/retailWave2Translations.ts \
            tests/retail-wave2-pos-transactions.test.ts

      - name: Typecheck
        run: npm run check

      - name: Retail Wave 2 contracts
        run: node node_modules/vitest/vitest.mjs run tests/retail-wave2-pos-transactions.test.ts tests/retail-wave1-contract.test.ts

      - name: Classified i18n audit
        run: node scripts/audit-i18n-phase14.mjs

      - name: Commit route fix
        run: |
          git checkout -- package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/routes/AppRoutes.tsx client/src/routes/PosRoutes.tsx client/src/pages/retail/RetailInventory.tsx client/src/i18n/retailWave2Translations.ts tests/retail-wave2-pos-transactions.test.ts
          if git diff --cached --quiet; then
            echo "No retail route changes needed"
          else
            git commit -m "Make Retail Wave 2 POS directly accessible"
            git push origin HEAD:feat/retail-pos-stock-movement-wave2
          fi
