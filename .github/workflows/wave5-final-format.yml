# Branch-only one-shot formatter; deleted before merge.
name: Wave 5 final format cleanup

on:
  push:
    branches:
      - wave-5-final-ci-cleanup

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave-5-final-ci-cleanup
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format cleanup source
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/i18n/factoryProductionPlannerTranslations.ts \
            client/src/pages/factory/factorystockallocationv5/components/ContainerPlannerSavedPlans.tsx \
            server/routes/performance/readMicrocache.ts \
            tests/ui/pos-item-picker-selection.test.ts

      - name: Verify formatting
        run: |
          node node_modules/prettier/bin/prettier.cjs --check \
            client/src/i18n/factoryProductionPlannerTranslations.ts \
            client/src/pages/factory/factorystockallocationv5/components/ContainerPlannerSavedPlans.tsx \
            server/routes/performance/readMicrocache.ts \
            tests/ui/pos-item-picker-selection.test.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/i18n/factoryProductionPlannerTranslations.ts \
            client/src/pages/factory/factorystockallocationv5/components/ContainerPlannerSavedPlans.tsx \
            server/routes/performance/readMicrocache.ts \
            tests/ui/pos-item-picker-selection.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style: format final Wave 5 cleanup"
          git push origin HEAD:wave-5-final-ci-cleanup
