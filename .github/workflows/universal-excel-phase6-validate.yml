name: Temporary Universal Excel Phase 6 Validation

on:
  push:
    branches:
      - feature/universal-excel-export-system

permissions:
  contents: write

concurrency:
  group: universal-excel-phase6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.head_commit.message != 'format-phase6'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Checkout current feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/universal-excel-export-system
          persist-credentials: true
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format only the changed feature-branch source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git merge-base origin/main HEAD)"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- client/src server shared tests scripts build | grep -E '\.(ts|tsx|css|mjs)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m format-phase6
          git push origin HEAD:feature/universal-excel-export-system
      - name: TypeScript compilation
        run: npm run check
      - name: Focused Factory / universal Excel regression
        run: npx vitest run tests/universal-excel-factory-operational.test.ts tests/universal-excel-engine.test.ts tests/universal-excel-design.test.ts tests/universal-excel-dynamic-columns.test.ts
      - name: Factory and ERP frontend Excel tests
        run: npx vitest run --config vitest.config.frontend.ts tests/ui/universal-excel-operational.test.ts tests/ui/factory-pressing-universal-excel.test.ts
      - name: Formatting validation
        run: npm run format:check:changed
      - name: Source lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Documentation index
        run: npm run audit:doc-index
