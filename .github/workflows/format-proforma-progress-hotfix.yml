name: Format Proforma Progress Hotfix

on:
  push:
    branches:
      - fix/proforma-progress-ordering
    paths:
      - .github/workflows/format-proforma-progress-hotfix.yml

permissions:
  contents: write

jobs:
  format-and-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/proforma-progress-ordering
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Apply repository Prettier formatting
        run: node node_modules/prettier/bin/prettier.cjs --write client/src/pages/factory/factorycontainerloadingscan/ProformaProgressPanel.tsx

      - name: Commit formatted file and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/format-proforma-progress-hotfix.yml
          git add client/src/pages/factory/factorycontainerloadingscan/ProformaProgressPanel.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply Prettier to proforma progress panel"
          git push origin HEAD:fix/proforma-progress-ordering
