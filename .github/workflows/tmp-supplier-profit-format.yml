name: Temporary formatting for supplier profit fix
on:
  push:
    branches:
      - fix/supplier-profit-reconciliation-20261026
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/SalesReportLegacy.tsx \
            server/routes/stats/salesReportBandwidthRoutes.ts \
            server/routes/stats/statsDataRoutes.ts \
            server/routes/stats/statsReportsRoutes.ts \
            tests/supplier-cost-reconciliation.test.ts
      - name: Commit only formatter changes
        shell: bash
        run: |
          git config user.name "ERP format bot"
          git config user.email "format-bot@users.noreply.github.com"
          git add -- \
            client/src/pages/SalesReportLegacy.tsx \
            server/routes/stats/salesReportBandwidthRoutes.ts \
            server/routes/stats/statsDataRoutes.ts \
            server/routes/stats/statsReportsRoutes.ts \
            tests/supplier-cost-reconciliation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format supplier profit reporting fix"
            git push origin HEAD:fix/supplier-profit-reconciliation-20261026
          fi
