name: Mutation Testing

# Stryker breaks the money, stock-costing and posting-rule modules listed in
# config/mutation-testing.json in small ways and checks the tests notice. Each
# file's score may not fall below its floor. Runs nightly, on demand, and on
# pull requests that touch those modules, their tests or the configuration.
on:
  pull_request:
    branches: [main]
    paths:
      - "server/lib/money.ts"
      - "server/lib/inventoryMath.ts"
      - "server/lib/closedPeriodError.ts"
      - "server/services/accounting/currencyAmounts.ts"
      - "server/services/accounting/currencyAmountsCore.ts"
      - "shared/posCfaMoney.ts"
      - "shared/posZmwMoney.ts"
      - "client/src/lib/accountingRequestIdentity.ts"
      - "config/mutation-testing.json"
      - "stryker.config.mjs"
      - "vitest.config.mutation.ts"
      - "scripts/check-mutation-floors.mjs"
      - "tests/**"
      - "server/lib/*.test.ts"
      - ".github/workflows/mutation-testing.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-testing:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run Stryker
        run: npm run test:mutation
      - name: Check the per-file mutation score floors
        run: npm run test:mutation:floors
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report
          path: artifacts/mutation
          if-no-files-found: warn
          retention-days: 14
