name: Wave 5 one-shot format repair

on:
  push:
    branches:
      - wave-5-cache-realtime-architecture

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Wave 5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave-5-cache-realtime-architecture
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format Wave 5 source
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/lib/bandwidthPhase1HotspotGuard.ts \
            client/src/lib/factoryCatalogCacheVariant.ts \
            client/src/lib/requestStormGuard.ts \
            server/routes/performance/readMicrocache.test.ts \
            server/routes/performance/readMicrocache.ts \
            server/routes/performance/readMicrocacheCoordinator.ts \
            server/routes/performance/readMicrocacheCoordinator.test.ts \
            tests/ui/bandwidth-phase-1-invalidation-policy.test.ts \
            tests/ui/bandwidth-phase-4-heavy-pages.test.ts

      - name: Verify formatting
        run: |
          node node_modules/prettier/bin/prettier.cjs --check \
            server/routes/performance/readMicrocache.test.ts \
            server/routes/performance/readMicrocache.ts \
            server/routes/performance/readMicrocacheCoordinator.ts

      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/lib/bandwidthPhase1HotspotGuard.ts \
            client/src/lib/factoryCatalogCacheVariant.ts \
            client/src/lib/requestStormGuard.ts \
            server/routes/performance/readMicrocache.test.ts \
            server/routes/performance/readMicrocache.ts \
            server/routes/performance/readMicrocacheCoordinator.ts \
            server/routes/performance/readMicrocacheCoordinator.test.ts \
            tests/ui/bandwidth-phase-1-invalidation-policy.test.ts \
            tests/ui/bandwidth-phase-4-heavy-pages.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style: format Wave 5 cache changes"
          git push origin HEAD:wave-5-cache-realtime-architecture
