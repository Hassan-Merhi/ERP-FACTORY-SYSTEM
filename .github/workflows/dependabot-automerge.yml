name: Maintenance - Dependabot Auto Merge

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Detect Dependabot-authored head
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          author="$(gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.author.login // ""')"
          if [[ "$author" == 'dependabot[bot]' ]]; then
            echo 'is_dependabot=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_dependabot=false' >> "$GITHUB_OUTPUT"
            echo "Head ${HEAD_SHA} is maintainer-authored; leaving auto-merge disabled."
          fi

      - name: Fetch Dependabot metadata
        if: steps.head.outputs.is_dependabot == 'true'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.head.outputs.is_dependabot == 'true' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
