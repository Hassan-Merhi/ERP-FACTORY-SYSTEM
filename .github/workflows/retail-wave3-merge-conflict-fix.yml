name: Retail Wave 3 Merge Conflict Fix

on:
  push:
    branches:
      - feat/retail-reporting-audit-wave3

permissions:
  contents: write

jobs:
  fix-retail-inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wave 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/retail-reporting-audit-wave3
          persist-credentials: true

      - name: Preserve current-main POS entry in Wave 3 inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("client/src/pages/retail/RetailInventory.tsx")
          source = path.read_text()

          old_import = 'import { ArrowLeft, Boxes, ImageIcon, Pencil, Plus, Upload, X } from "lucide-react";'
          new_import = 'import { ArrowLeft, Boxes, ImageIcon, Pencil, Plus, ShoppingCart, Upload, X } from "lucide-react";'
          if new_import not in source:
              if old_import not in source:
                  raise SystemExit("RetailInventory icon import target not found")
              source = source.replace(old_import, new_import, 1)

          old_actions = '''        <div className="flex gap-2">\n          <Button variant="outline" onClick={() => setImportOpen(true)}>'''
          new_actions = '''        <div className="flex gap-2">\n          <Button variant="secondary" onClick={() => navigate("/retail/pos")}>\n            <ShoppingCart className="h-4 w-4 mr-2" />\n            Open POS\n          </Button>\n          <Button variant="outline" onClick={() => setImportOpen(true)>'''
          # Fix the intentionally simple replacement without changing any Wave 3 pagination code.
          if 'Open POS' not in source:
              if old_actions not in source:
                  raise SystemExit("RetailInventory action target not found")
              new_actions = new_actions.replace('onClick={() => setImportOpen(true)>', 'onClick={() => setImportOpen(true)}>')
              source = source.replace(old_actions, new_actions, 1)

          path.write_text(source)
          PY

      - name: Commit merge-conflict resolution
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/src/pages/retail/RetailInventory.tsx
            git commit -m "fix(retail): preserve Open POS entry in Wave 3 inventory"
            git push origin HEAD:feat/retail-reporting-audit-wave3
          fi
