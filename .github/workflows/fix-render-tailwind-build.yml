name: Fix Render Tailwind Build

on:
  push:
    branches:
      - fix/render-tailwind-postcss-build

permissions:
  contents: write

jobs:
  repair-lock-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/render-tailwind-postcss-build
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Restore Tailwind 3 PostCSS compatibility and refresh lockfile
        run: |
          set -euo pipefail
          npm pkg set 'dependencies.tailwindcss=^3.4.17'
          npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install locked dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Verify production build
        run: npm run build
      - name: Commit verified dependency repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'fix: restore Tailwind PostCSS build compatibility'
          git push origin HEAD:fix/render-tailwind-postcss-build
