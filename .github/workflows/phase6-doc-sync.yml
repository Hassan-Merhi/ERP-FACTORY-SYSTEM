name: Phase 6 quality-doc sync

on:
  push:
    branches:
      - perf/full-list-wave1-audit-architecture
    paths:
      - .github/workflows/phase6-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/full-list-wave1-audit-architecture
          fetch-depth: 0
      - name: Sync exact type-escape figure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/system-quality-program.md')
          text = path.read_text()
          old = '| Type escapes (AST) | 1,059 total | `npm run audit:type-escapes` |'
          new = '| Type escapes (AST) | 1,058 total | `npm run audit:type-escapes` |'
          if old not in text:
              raise SystemExit('expected quality-program type-escape figure not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase6-doc-sync.yml
          git add docs/system-quality-program.md
          git commit -m "docs: sync type-escape quality figure"
          git push origin HEAD:perf/full-list-wave1-audit-architecture
