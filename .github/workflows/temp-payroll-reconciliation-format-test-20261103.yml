name: Temporary October payroll reconciliation validation

on:
  push:
    branches:
      - fix/payroll-overlap-backend-reconciliation-20261103

permissions:
  contents: write

jobs:
  verify-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/payroll-overlap-backend-reconciliation-20261103
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format changed source files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/payroll/periodPayrollReconciliation.ts \
            server/services/payroll/payrollPeriodOverlapPolicy.ts \
            server/services/payroll/factoryPayrollGenerationService.ts \
            server/routes/payroll/core/generate.ts \
            server/routes/payroll/centralFactoryPayrollGenerationRoute.ts \
            server/routes/factory/employee-pos/employeeAttendanceRoutes.ts \
            tests/payroll-period-reconciliation.test.ts

      - name: Run focused regression tests
        run: node node_modules/vitest/vitest.mjs run tests/payroll-period-reconciliation.test.ts

      - name: Commit formatting only if tests pass
        run: |
          set -euo pipefail
          git add server/services/payroll/periodPayrollReconciliation.ts \
            server/services/payroll/payrollPeriodOverlapPolicy.ts \
            server/services/payroll/factoryPayrollGenerationService.ts \
            server/routes/payroll/core/generate.ts \
            server/routes/payroll/centralFactoryPayrollGenerationRoute.ts \
            server/routes/factory/employee-pos/employeeAttendanceRoutes.ts \
            tests/payroll-period-reconciliation.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(payroll): format backend reconciliation and tests"
          git push origin HEAD:refs/heads/fix/payroll-overlap-backend-reconciliation-20261103
