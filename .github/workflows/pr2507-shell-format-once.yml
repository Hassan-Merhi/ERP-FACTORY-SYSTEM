name: Format ERP shell for PR 2507 (one time)
on:
  push:
    branches: [feature/supplier-profit-reconciliation]
    paths: [.github/workflows/pr2507-shell-format-once.yml]
permissions:
  contents: write
jobs:
  apply-format:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/supplier-profit-reconciliation
          persist-credentials: true
      - name: Set up canonical Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Format existing ERP shell and self-delete
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit
          node node_modules/prettier/bin/prettier.cjs --write client/src/app/ErpShell.tsx
          git rm .github/workflows/pr2507-shell-format-once.yml
          git add client/src/app/ErpShell.tsx
          git config user.name 'ERP CI Formatter'
          git config user.email 'ci-formatter@users.noreply.github.com'
          git commit -m 'style: align ERP shell formatting with RTL CI'
          git push origin HEAD:feature/supplier-profit-reconciliation
