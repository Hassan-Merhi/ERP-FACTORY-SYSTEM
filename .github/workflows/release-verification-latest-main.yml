name: Ensure Latest Main Release Verification

# This watchdog never checks out or runs repository code. It only reads run
# metadata and redispatches Release Verification for the current main SHA it
# resolves itself, so the triggering run cannot influence what executes.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Release Verification"]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ensure-latest-main-release-verification
  cancel-in-progress: true

jobs:
  ensure:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure current main has a Release Verification run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMPLETED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}"
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          current_sha="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${api}/branches/main" | jq -r '.commit.sha')"
          if [ -z "$current_sha" ] || [ "$current_sha" = "null" ]; then
            echo "::error title=Release verification watchdog::Could not resolve current main SHA"
            exit 1
          fi

          echo "Current main: ${current_sha}"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "Completed Release Verification head: ${COMPLETED_SHA}"
            if [ "$COMPLETED_SHA" = "$current_sha" ]; then
              echo "Current main has just completed Release Verification; no redispatch needed."
              exit 0
            fi
          fi

          runs="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${api}/actions/workflows/release-verification.yml/runs?branch=main&per_page=50")"
          existing_count="$(jq --arg sha "$current_sha" '[.workflow_runs[] | select(.head_sha == $sha)] | length' <<<"$runs")"
          if [ "$existing_count" -gt 0 ]; then
            echo "Current main already has ${existing_count} Release Verification run(s); no duplicate dispatch."
            exit 0
          fi

          echo "No Release Verification run exists for current main; dispatching one now."
          curl --fail-with-body --silent --show-error \
            --request POST \
            "${auth[@]}" \
            "${api}/actions/workflows/release-verification.yml/dispatches" \
            --data '{"ref":"main"}'
