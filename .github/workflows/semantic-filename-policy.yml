name: Semantic filename policy and entrypoint compatibility
on:
  push:
    branches:
      - refactor/phase-wave-semantic-names
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: semantic-filename-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.2'
      - name: Run positive and negative filename compatibility regression tests
        run: node --test tests/semantic-filename-policy.node.test.mjs
      - name: Verify semantic filename policy and entrypoint references
        run: |
          node scripts/verify-semantic-filename-policy.mjs --json > semantic-filename-policy.json || status=$?
          node -e "const r=require('./semantic-filename-policy.json');console.log('Scanned',r.scannedEntrypoints,'entrypoint manifests,',r.referencesChecked,'references; failures:',r.problems.length);for(const p of r.problems)console.error(p.code,(p.owner||'')+' -> '+p.path)"
          exit ${status:-0}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: semantic-filename-policy
          path: semantic-filename-policy.json
          retention-days: 30
