name: Temporary Phase 1 regression formatter

on:
  push:
    branches:
      - phase-1-mobile-shell-navigation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-1-mobile-shell-navigation
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format Phase 1 regression files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/components/MobileWorkspaceControls.tsx \
            scripts/verify-mobile-responsive-phase1-browser.mjs

      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/MobileWorkspaceControls.tsx scripts/verify-mobile-responsive-phase1-browser.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format Phase 1 mobile regression coverage"
          git push origin HEAD:phase-1-mobile-shell-navigation
