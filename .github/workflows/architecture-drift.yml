name: Maintenance - Architecture Drift

on:
  schedule:
    - cron: '29 2 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Detect dependency and repository drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Verify repository dependency policy
        run: |
          npm run verify:lockfile
          npm run verify:dependency-audit
          npm run audit:toolchain

      - name: Detect outdated dependencies
        shell: bash
        run: |
          set +e
          npm outdated
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          echo "npm outdated exit status $status is informational for scheduled drift reporting."

      - name: Verify migration registry
        run: npm run verify:migrations
