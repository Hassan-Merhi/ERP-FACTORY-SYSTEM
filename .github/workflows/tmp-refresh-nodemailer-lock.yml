name: Temporary Nodemailer Lock Refresh

on:
  push:
    branches:
      - perf/realtime-wave1-targeted-refresh

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Wave 1
        uses: actions/checkout@v6
        with:
          ref: perf/realtime-wave1-targeted-refresh
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Regenerate Nodemailer resolution
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --no-save nodemailer@9.1.1

      - name: Verify safe Nodemailer lock
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const entry = lock.packages?.['node_modules/nodemailer'];
          if (entry?.version !== '9.1.1') {
            throw new Error(`Expected nodemailer 9.1.1 in lockfile, got ${entry?.version ?? 'missing'}`);
          }
          if (lock.packages?.['']?.dependencies?.nodemailer !== '^9.0.6') {
            throw new Error('Root dependency range changed unexpectedly');
          }
          NODE

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: resolve nodemailer 9.1.1 in lockfile'
          git push origin HEAD:perf/realtime-wave1-targeted-refresh
