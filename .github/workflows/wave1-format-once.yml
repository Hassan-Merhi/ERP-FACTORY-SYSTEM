name: Wave 1 one-shot formatter

on:
  push:
    branches:
      - perf/wave1-request-churn-20260921

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Wave 1 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/wave1-request-churn-20260921
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format Wave 1 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/factory/factorycontainerloadingscan/useFactoryContainerLoadingScanModel.ts \
            client/src/pages/settings/WatchUserDialog.tsx \
            tests/ui/performance-wave1-request-churn.test.ts

      - name: Commit formatting and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/pages/factory/factorycontainerloadingscan/useFactoryContainerLoadingScanModel.ts \
            client/src/pages/settings/WatchUserDialog.tsx \
            tests/ui/performance-wave1-request-churn.test.ts
          git rm .github/workflows/wave1-format-once.yml
          git commit -m "chore: format Wave 1 request-churn changes"
          git push origin HEAD:perf/wave1-request-churn-20260921
