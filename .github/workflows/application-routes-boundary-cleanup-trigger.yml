name: Application Routes Boundary Cleanup Trigger

on:
  workflow_run:
    workflows: ["Application Routes Boundary Verification"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/application-routes-god-file-boundary-20260910
      - run: |
          git rm -f \
            .github/workflows/application-routes-boundary-verification.yml \
            .github/workflows/application-routes-boundary-cleanup.yml \
            .github/workflows/application-routes-boundary-cleanup-trigger.yml \
            server/routes/applicationAiLazyRoutes.test-marker.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove temporary boundary verification harness"
          git push origin HEAD:fix/application-routes-god-file-boundary-20260910
