name: Temporary HMD repair workpaper formatter
on:
  push:
    branches:
      - fix/offloaded-po-valuation-integrity-20261026
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - run: node node_modules/prettier/bin/prettier.cjs --write scripts/audit-erp-supplier-inventory-cost.ts tests/supplier-inventory-cost-workpaper.test.ts
      - name: Commit formatted workpaper
        shell: bash
        run: |
          git config user.name "ERP format bot"
          git config user.email "format-bot@users.noreply.github.com"
          git add -- scripts/audit-erp-supplier-inventory-cost.ts tests/supplier-inventory-cost-workpaper.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format HMD repair workpaper and tests"
            git push origin HEAD:fix/offloaded-po-valuation-integrity-20261026
          fi
