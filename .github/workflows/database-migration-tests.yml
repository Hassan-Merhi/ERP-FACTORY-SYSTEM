name: Database Migrations

# The schema is owned by numbered migrations in migrations/. This workflow
# proves, on a disposable PostgreSQL 18 service container only:
#   - no runtime code executes DDL (static audit);
#   - the registry is valid (names, numbering, checksums, history rules);
#   - an EMPTY database reaches the complete schema from migrations alone and
#     matches the committed manifest exactly;
#   - existing-database adoption, partial failure, concurrency and the startup
#     gate behave as specified;
#   - the built server boots and serves without executing any DDL, and refuses
#     to start on an incomplete schema.
# It never uses production credentials: every DATABASE_URL below is the local
# service container, and a guard step fails the job otherwise.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migrations (fresh install, adoption, no-DDL boot)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGSSLMODE: disable
      ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      MIGRATION_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      SESSION_SECRET: ci-session-secret-for-boot-check-0123456789abcdef
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          cache: npm

      - name: Install locked dependencies
        env:
          SKIP_GIT_HOOKS: "1"
        run: npm ci --no-audit --bin-links=true

      - name: Guard - only the local disposable database is reachable
        run: |
          set -euo pipefail
          case "$ADMIN_URL" in
            postgresql://postgres:postgres@127.0.0.1:5432/*) ;;
            *) echo "::error::Migration CI must only target the local service container"; exit 1 ;;
          esac

      - name: Runtime DDL audit (server/ and shared/ must not change the schema)
        run: npm run audit:runtime-ddl

      - name: Migration plan (no database access)
        run: npm run db:migrate:plan

      - name: Registry, fresh install, adoption, concurrency and startup gate tests
        run: npm run test:db:migrations

      - name: Fresh install from migrations alone + manifest is current
        run: |
          set -euo pipefail
          node scripts/db/ci-sql.mjs "$ADMIN_URL" "CREATE DATABASE erp_fresh" "CREATE DATABASE erp_manifest"
          export DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/erp_fresh
          MIGRATION_CONFIRMATION=APPLY_SCHEMA_MIGRATIONS npm run db:migrate
          npm run db:migrate:status
          npm run db:verify
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/erp_manifest npm run db:manifest:check

      - name: Build server
        run: npm run build

      - name: Server boots and serves without executing any DDL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_fresh
          NODE_ENV: production
        run: npm run verify:boot-no-ddl

      - name: Server refuses to start on an incomplete schema
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          node scripts/db/ci-sql.mjs "$ADMIN_URL" "CREATE DATABASE erp_incomplete TEMPLATE erp_fresh"
          node scripts/db/ci-sql.mjs postgresql://postgres:postgres@127.0.0.1:5432/erp_incomplete \
            "ALTER TABLE vouchers DROP COLUMN currency CASCADE"
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/erp_incomplete \
            node scripts/db/verify-boot-no-ddl.mjs --expect-refusal

      - name: Production release preflight stays fail-closed without evidence
        run: |
          set -euo pipefail
          if node scripts/verify-database-release.mjs --commit="$GITHUB_SHA" > "$RUNNER_TEMP/release-preflight.json"; then
            echo "::error::Missing production evidence must block the release."
            exit 1
          fi
          grep -q '"ok": false' "$RUNNER_TEMP/release-preflight.json"
