name: Format PR 1357

on:
  push:
    branches:
      - feat/tracking-supplier-location-agent-defaults

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format failing files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/factory/FactoryProductionTargets.tsx \
            client/src/pages/settings/SupplierTrackingDefaultsTab.tsx \
            server/helpers/generateGroupNetPositionExcel.ts \
            server/helpers/groupNetPosition.ts \
            server/services/supplierTrackingDefaults.ts \
            server/storage/company-deletion.ts \
            tests/supplier-tracking-defaults.test.ts

      - name: Commit formatted files
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            client/src/pages/factory/FactoryProductionTargets.tsx \
            client/src/pages/settings/SupplierTrackingDefaultsTab.tsx \
            server/helpers/generateGroupNetPositionExcel.ts \
            server/helpers/groupNetPosition.ts \
            server/services/supplierTrackingDefaults.ts \
            server/storage/company-deletion.ts \
            tests/supplier-tracking-defaults.test.ts; then
            echo "Files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/pages/factory/FactoryProductionTargets.tsx \
            client/src/pages/settings/SupplierTrackingDefaultsTab.tsx \
            server/helpers/generateGroupNetPositionExcel.ts \
            server/helpers/groupNetPosition.ts \
            server/services/supplierTrackingDefaults.ts \
            server/storage/company-deletion.ts \
            tests/supplier-tracking-defaults.test.ts
          git commit -m "style: apply prettier formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
