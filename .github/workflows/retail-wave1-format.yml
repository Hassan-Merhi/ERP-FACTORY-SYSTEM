name: Retail Wave 1 Format

on:
  push:
    branches:
      - feat/retail-variant-inventory-wave1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/retail-variant-inventory-wave1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format Wave 1 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/components/ApplicationInterfaceTranslator.tsx \
            client/src/contracts/sessionContracts.ts \
            client/src/i18n/retailWave1Translations.ts \
            client/src/pages/retail/RetailInventory.tsx \
            server/routes/retailRoutes.ts \
            server/services/security/globalCompanyScopeService.ts \
            shared/schema/retail.ts \
            tests/retail-wave1-contract.test.ts \
            tests/ui/session-contracts.test.ts \
            scripts/audit-i18n-phase14.mjs

      - name: Commit formatting
        run: |
          git checkout -- package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/components/ApplicationInterfaceTranslator.tsx \
            client/src/contracts/sessionContracts.ts \
            client/src/i18n/retailWave1Translations.ts \
            client/src/pages/retail/RetailInventory.tsx \
            server/routes/retailRoutes.ts \
            server/services/security/globalCompanyScopeService.ts \
            shared/schema/retail.ts \
            tests/retail-wave1-contract.test.ts \
            tests/ui/session-contracts.test.ts \
            scripts/audit-i18n-phase14.mjs
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "Format Retail Wave 1 changes"
            git push origin HEAD:feat/retail-variant-inventory-wave1
          fi
