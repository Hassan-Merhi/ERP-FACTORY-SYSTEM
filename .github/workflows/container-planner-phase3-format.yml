name: Container Planner Phase 3 one-shot format

on:
  push:
    branches:
      - feature/container-planner-phase-3-reconciliation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout phase 3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/container-planner-phase-3-reconciliation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format Phase 3 source
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/i18n/factoryProductionPlannerTranslations.ts \
            client/src/pages/factory/factorystockallocationv5/components/ContainerPlannerReconciliation.tsx \
            client/src/pages/factory/factorystockallocationv5/components/ContainerPlannerSavedPlans.tsx \
            server/routes/factory/stock-allocation-v5/container-planner-reconciliation.ts \
            server/routes/factory/stock-allocation-v5/container-planner.ts \
            shared/containerPlanner.ts \
            tests/container-planner-phase3-api.test.ts \
            tests/container-planner-phase3.test.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/i18n/factoryProductionPlannerTranslations.ts \
            client/src/pages/factory/factorystockallocationv5/components/ContainerPlannerReconciliation.tsx \
            client/src/pages/factory/factorystockallocationv5/components/ContainerPlannerSavedPlans.tsx \
            server/routes/factory/stock-allocation-v5/container-planner-reconciliation.ts \
            server/routes/factory/stock-allocation-v5/container-planner.ts \
            shared/containerPlanner.ts \
            tests/container-planner-phase3-api.test.ts \
            tests/container-planner-phase3.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style(factory): format container planner phase 3"
          git push origin HEAD:feature/container-planner-phase-3-reconciliation
