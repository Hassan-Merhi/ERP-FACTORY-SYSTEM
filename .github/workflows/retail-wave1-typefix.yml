name: Retail Wave 1 Type Fix

on:
  push:
    branches:
      - feat/retail-variant-inventory-wave1

permissions:
  contents: write

jobs:
  typefix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/retail-variant-inventory-wave1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Apply explicit import row types
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/routes/retailRoutes.ts')
          s = p.read_text()
          replacements = {
              'rows.map((row) => row.barcode)': 'rows.map((row: { barcode: string }) => row.barcode)',
              'const existingByBarcode = new Map(existingBarcodeRows.map((row) => [normalize(row.barcode), row]));': '''const existingByBarcode = new Map(\n          existingBarcodeRows.map(\n            (row: { id: number; barcode: string; productId: number; size: string }) => [normalize(row.barcode), row]\n          )\n        );''',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'target not found: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          node node_modules/prettier/bin/prettier.cjs --write server/routes/retailRoutes.ts
          npm run check

      - name: Commit type fix
        run: |
          git checkout -- package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/retailRoutes.ts
          if git diff --cached --quiet; then
            echo "No type fix needed"
          else
            git commit -m "Fix Retail Wave 1 import row typing"
            git push origin HEAD:feat/retail-variant-inventory-wave1
          fi
