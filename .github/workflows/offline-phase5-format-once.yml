name: One-time Phase 5 source formatter
on:
  push:
    branches: [feat/offline-phase5-secure-snapshots-20261030]
    paths: [.github/workflows/offline-phase5-format-once.yml]
permissions:
  contents: write
jobs:
  format-phase5-only:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Format only Phase 5 source and tests
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          client/src/lib/offline/secureSnapshotVault.ts
          client/src/lib/offline/offlineReadCache.ts
          client/src/lib/offline/scopedOfflinePrep.ts
          client/src/lib/db.ts
          client/src/components/OfflinePrepPanel.tsx
          tests/ui/offline-phase5-snapshot-vault.test.ts
          tests/ui/offline-phase5-encrypted-cache.test.ts
      - name: Verify tests after formatting
        run: >-
          node node_modules/vitest/vitest.mjs run
          --config vitest.config.frontend.ts
          tests/ui/offline-read-cache.test.ts
          tests/ui/offline-scoped-preparation.test.ts
          tests/ui/offline-phase5-snapshot-vault.test.ts
          tests/ui/offline-phase5-encrypted-cache.test.ts
      - name: Commit formatting to the isolated Phase 5 branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- client/src/lib/offline/secureSnapshotVault.ts client/src/lib/offline/offlineReadCache.ts client/src/lib/offline/scopedOfflinePrep.ts client/src/lib/db.ts client/src/components/OfflinePrepPanel.tsx tests/ui/offline-phase5-snapshot-vault.test.ts tests/ui/offline-phase5-encrypted-cache.test.ts
          if ! git diff --cached --quiet; then
            git -c user.name="ERP Offline Validator" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(offline phase5): format validated encrypted-snapshot changes"
            git push origin "HEAD:feat/offline-phase5-secure-snapshots-20261030"
          fi

# One final formatting pass after revocation-race regression hardening.
