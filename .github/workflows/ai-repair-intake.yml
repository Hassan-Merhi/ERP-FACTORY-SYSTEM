name: AI Repair Intake

# This intake never checks out or executes code from the triggering run; it only reads run metadata and files an issue.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI, CodeQL, Semgrep, Security]
    types: [completed]
  workflow_dispatch:
    inputs:
      summary:
        description: Short description of the reproducible defect
        required: true
        type: string
      evidence_url:
        description: URL to logs, production error evidence, or a failing run
        required: true
        type: string
      base_branch:
        description: Branch the repair agent should start from
        required: true
        default: main
        type: string

# Issue writes are granted per job rather than to the whole workflow.
permissions: {}

concurrency:
  group: ai-repair-intake-${{ github.event_name }}-${{ github.event.workflow_run.name || github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile-main-workflow:
    name: Reconcile repair issue for main workflow
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      # This job does not check the repository out, so gh has no git remote to
      # infer the repository from.
      GH_REPO: ${{ github.repository }}
      REPAIR_WORKFLOW: ${{ github.event.workflow_run.name }}
      REPAIR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      REPAIR_SHA: ${{ github.event.workflow_run.head_sha }}
      REPAIR_URL: ${{ github.event.workflow_run.html_url }}
      REPAIR_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
      - name: Ensure repair labels exist
        if: github.event.workflow_run.conclusion == 'failure'
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/labels" \
            -f name='ai-repair' -f color='5319e7' \
            -f description='Evidence-backed defect suitable for guarded AI repair' >/dev/null 2>&1 || true
          gh api --method POST "repos/$GITHUB_REPOSITORY/labels" \
            -f name='needs-triage' -f color='fbca04' \
            -f description='Requires human triage before an agent is assigned' >/dev/null 2>&1 || true

      - name: Reconcile evidence-backed repair issue
        shell: bash
        run: |
          set -euo pipefail

          canonical_title="[AI Repair] ${REPAIR_WORKFLOW} failing on main"
          legacy_prefix="[AI Repair] ${REPAIR_WORKFLOW} failed on main at "

          matching_output="$(
            gh issue list --state open --label ai-repair --limit 500 \
              --json number,title \
              --jq ".[] | select(.title == \"${canonical_title}\" or (.title | startswith(\"${legacy_prefix}\"))) | .number"
          )"
          matching_numbers=()
          if [[ -n "$matching_output" ]]; then
            mapfile -t matching_numbers <<< "$matching_output"
          fi

          if [[ "$REPAIR_CONCLUSION" == "success" ]]; then
            if [[ "${#matching_numbers[@]}" -eq 0 ]]; then
              echo "No open AI repair issue exists for ${REPAIR_WORKFLOW}; nothing to close."
              exit 0
            fi

            for issue_number in "${matching_numbers[@]}"; do
              gh issue comment "$issue_number" --body \
                "Automatically resolved because **${REPAIR_WORKFLOW}** succeeded on \`main\` at \`${REPAIR_SHA}\`: ${REPAIR_URL}"
              gh issue close "$issue_number" --reason completed
            done
            exit 0
          fi

          cat > /tmp/ai-repair-body.md <<EOF
          ## Evidence

          - Workflow: **${REPAIR_WORKFLOW}**
          - Branch: **main**
          - Commit: \`${REPAIR_SHA}\`
          - Failed run: ${REPAIR_URL}
          - Run ID: \`${REPAIR_RUN_ID}\`

          ## Repair contract

          This issue tracks the current failure state for this workflow on \`main\`. New failed commits update this same issue instead of creating one issue per SHA.

          Before changing code, inspect the linked run and reproduce/localize the failure.

          When assigning an AI coding agent, use the repository's **bug-repair** custom agent. The agent must add focused regression proof where practical, preserve all existing CI/security ratchets, and deliver changes only through a reviewable pull request. It must not merge or push directly to \`main\`.

          Human triage is intentionally required before agent assignment. Confirm this is a real defect rather than an infrastructure/transient failure, then remove **needs-triage** and assign the **bug-repair** agent.
          EOF

          if [[ "${#matching_numbers[@]}" -eq 0 ]]; then
            gh issue create \
              --title "$canonical_title" \
              --body-file /tmp/ai-repair-body.md \
              --label ai-repair \
              --label needs-triage
            exit 0
          fi

          primary_number="${matching_numbers[0]}"
          gh issue edit "$primary_number" \
            --title "$canonical_title" \
            --add-label ai-repair
          gh issue comment "$primary_number" --body-file /tmp/ai-repair-body.md

          if [[ "${#matching_numbers[@]}" -gt 1 ]]; then
            for duplicate_number in "${matching_numbers[@]:1}"; do
              gh issue comment "$duplicate_number" --body \
                "Automatically consolidated into #${primary_number}. Future failures for **${REPAIR_WORKFLOW}** update one stable issue."
              gh issue close "$duplicate_number" --reason "not planned"
            done
          fi

  manual-evidence-intake:
    name: Create repair issue from supplied evidence
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REPAIR_SUMMARY: ${{ inputs.summary }}
      REPAIR_EVIDENCE_URL: ${{ inputs.evidence_url }}
      REPAIR_BASE_BRANCH: ${{ inputs.base_branch }}

    steps:
      - name: Validate manual intake
        shell: bash
        run: |
          if [[ "$REPAIR_BASE_BRANCH" != "main" ]]; then
            echo "Manual AI repair intake currently permits only main as the repair base."
            exit 2
          fi
          case "$REPAIR_EVIDENCE_URL" in
            https://*) ;;
            *) echo "Evidence URL must use HTTPS."; exit 2 ;;
          esac

      - name: Ensure repair labels exist
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/labels" \
            -f name='ai-repair' -f color='5319e7' \
            -f description='Evidence-backed defect suitable for guarded AI repair' >/dev/null 2>&1 || true
          gh api --method POST "repos/$GITHUB_REPOSITORY/labels" \
            -f name='needs-triage' -f color='fbca04' \
            -f description='Requires human triage before an agent is assigned' >/dev/null 2>&1 || true

      - name: Create manual repair issue
        shell: bash
        run: |
          title="[AI Repair] ${REPAIR_SUMMARY}"
          cat > /tmp/ai-repair-body.md <<EOF
          ## Evidence

          - Summary: ${REPAIR_SUMMARY}
          - Evidence: ${REPAIR_EVIDENCE_URL}
          - Repair base: **main**

          ## Repair contract

          Inspect and validate the linked evidence before changing code. When assigning an AI coding agent, use the repository's **bug-repair** custom agent.

          The agent must reproduce/localize the defect, add focused regression proof where practical, preserve all existing CI/security ratchets, and deliver changes only through a reviewable pull request. It must not merge or push directly to \`main\`.

          Human triage is intentionally required before assignment. Remove **needs-triage** only after confirming the evidence represents an actionable software defect.
          EOF

          gh issue create \
            --title "$title" \
            --body-file /tmp/ai-repair-body.md \
            --label ai-repair \
            --label needs-triage
