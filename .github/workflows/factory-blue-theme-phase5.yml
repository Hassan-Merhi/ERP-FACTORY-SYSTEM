name: Factory Blue Theme Phase 5

on:
  push:
    branches: [main]
    paths:
      - "client/src/styles/factory-unified-theme.css"
      - "client/src/styles/factory-unified-theme*.test.ts"
      - "client/src/pages/factory/**"
      - "client/src/app/FactoryShell.tsx"
      - "client/src/components/FactorySidebar.tsx"
      - "tests/e2e/factory-theme-responsive-phase4.mjs"
      - ".github/workflows/factory-blue-theme-phase5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-blue-theme-phase5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  factory-theme:
    name: Theme contracts and 36-case responsive matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Factory unified theme regression contracts
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts client/src/styles/factory-unified-theme.test.ts client/src/styles/factory-unified-theme-phase4.test.ts

      - name: Compile production frontend
        run: node --max-old-space-size=2048 node_modules/vite/bin/vite.js build

      - name: Install headless Chromium
        run: |
          set -euo pipefail
          node_modules/.bin/puppeteer browsers install chrome-headless-shell
          chrome_path="$(find "$HOME/.cache/puppeteer/chrome-headless-shell" -type f -name chrome-headless-shell | head -1)"
          test -n "$chrome_path"
          echo "FACTORY_QA_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Start local preview
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4174 --strictPort > /tmp/factory-phase5-preview.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4174/factory/location-inventory > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/factory-phase5-preview.log
          exit 1

      - name: Factory six-route light-dark responsive matrix
        env:
          FACTORY_QA_BASE_URL: http://127.0.0.1:4174
          FACTORY_QA_SCREENSHOT_DIR: /tmp/factory-phase5-screenshots
        run: node tests/e2e/factory-theme-responsive-phase4.mjs

      - name: Upload synthetic fixture screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-blue-phase5-fixture-screenshots
          path: /tmp/factory-phase5-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
