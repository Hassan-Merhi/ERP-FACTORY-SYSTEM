name: One-time supplier-directory formatter
on:
  push:
    branches: [fix/factory-supplier-directory-match-statement-20261014]
    paths: [.github/workflows/supplier-directory-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Format touched supplier source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/prettier/bin/prettier.cjs --write "server/routes/factory/suppliers/balance/with-balances.ts" "client/src/pages/factory/factory-suppliers/FactorySuppliersDirectory.tsx" "client/src/pages/factory/factory-suppliers/factorySupplierTypes.ts" "client/src/pages/factory/factory-suppliers/useFactorySuppliersModel.tsx"
          git add -- "server/routes/factory/suppliers/balance/with-balances.ts" "client/src/pages/factory/factory-suppliers/FactorySuppliersDirectory.tsx" "client/src/pages/factory/factory-suppliers/factorySupplierTypes.ts" "client/src/pages/factory/factory-suppliers/useFactorySuppliersModel.tsx"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(factory): format directory broker balance fix'
            git push origin HEAD:fix/factory-supplier-directory-match-statement-20261014
          fi
