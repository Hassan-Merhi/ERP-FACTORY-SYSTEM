name: Intercompany Phase 1 Formatting Preview (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/intercompany-phase1-format-preview.yml
      - shared/schema/intercompanyTrading.ts
      - tests/intercompany-phase1-foundation.test.ts

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Download review branch source without writing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$TARGET_SHA" \
            | tar --extract --gzip --strip-components=1
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Produce formatted files as read-only logs
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/prettier/bin/prettier.cjs --write shared/schema/intercompanyTrading.ts tests/intercompany-phase1-foundation.test.ts
          node - <<'NODE'
          const fs = require("node:fs");
          for (const file of ["shared/schema/intercompanyTrading.ts", "tests/intercompany-phase1-foundation.test.ts"]) {
            console.log("BEGIN_FORMATTED_FILE:" + file);
            console.log(fs.readFileSync(file).toString("base64"));
            console.log("END_FORMATTED_FILE:" + file);
          }
          NODE
