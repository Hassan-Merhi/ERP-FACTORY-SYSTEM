name: Phase 3 Sync Main

on:
  push:
    branches:
      - fix/proforma-capacity-phase3-finalize-20260910
    paths:
      - .github/workflows/phase3-sync-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/proforma-capacity-phase3-finalize-20260910
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main and trigger final Phase 3 verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm -f .github/workflows/phase3-sync-main.yml
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = ".github/workflows/phase3-completion-verification.yml";
          let source = readFileSync(path, "utf8");
          source = source.replace(
            "# Phase-specific certification; current main has an unrelated lint warning.",
            "# Phase-specific certification after syncing current main."
          );
          writeFileSync(path, source);
          NODE
          git add .github/workflows/phase3-completion-verification.yml
          git commit -m "chore: sync Phase 3 with current main"
          git push origin HEAD:fix/proforma-capacity-phase3-finalize-20260910
