name: Wave 2 format changed files

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'perf/wave-2-frontend-speed' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Wave 2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/wave-2-frontend-speed
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format changed source
        shell: bash
        run: |
          mapfile -t changed_files < <(
            git diff --name-only origin/main...HEAD --               'client/src/**/*.ts'               'client/src/**/*.tsx'               'build/**/*.ts'               'tests/**/*.ts'               'tests/**/*.tsx'
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed source files."
            exit 0
          fi
          node node_modules/prettier/bin/prettier.cjs --write "${changed_files[@]}"

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src tests
          git add -f build/viteInitialChunkAuditPlugin.ts
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style: format Wave 2 frontend speed changes"
          git push origin HEAD:perf/wave-2-frontend-speed
