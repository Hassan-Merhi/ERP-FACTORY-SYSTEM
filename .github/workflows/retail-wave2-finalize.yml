name: Retail Wave 2 Finalize

on:
  push:
    branches:
      - feat/retail-pos-stock-movement-wave2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/retail-pos-stock-movement-wave2
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Complete Wave 2 transaction wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"target not found in {path}: {old[:140]!r}")
              p.write_text(s.replace(old, new, 1))

          route = "server/routes/pos/retailPosRoutes.ts"
          replace_once(
              route,
              'import { getErrorMessage } from "../../lib/httpHandlers";\n',
              'import { getErrorMessage } from "../../lib/httpHandlers";\nimport {\n  aggregateRetailCartItems,\n  nextRetailReturnQuantity,\n  nextRetailSaleQuantity,\n  nextRetailTransferQuantities,\n  validateRetailReturnQuantity,\n} from "../../services/retail/retailStockMath";\n',
          )
          replace_once(
              route,
              '''function currentUserId(req: Request): number {\n  return Number(req.user?.id ?? req.session.userId ?? 0);\n}''',
              '''function currentUserId(req: Request): string {\n  const userId = req.user?.id ?? req.session.userId;\n  if (!userId) throw new Error("Authenticated user is required");\n  return String(userId);\n}''',
          )
          replace_once(route, '    createdBy: number;\n    metadata?: Record<string, unknown>;', '    createdBy: string;\n    metadata?: Record<string, unknown>;')
          replace_once(
              route,
              '''function aggregateSaleItems(items: z.infer<typeof saleSchema>["items"]) {\n  const aggregate = new Map<number, number>();\n  for (const item of items) aggregate.set(item.variantId, (aggregate.get(item.variantId) ?? 0) + item.quantity);\n  return [...aggregate.entries()].map(([variantId, quantity]) => ({ variantId, quantity }));\n}\n\n''',
              '',
          )
          replace_once(route, 'const items = aggregateSaleItems(body.items);', 'const items = aggregateRetailCartItems(body.items);')
          replace_once(
              route,
              '''          const after = stock.quantity - item.quantity;\n          if (!canSellNegativeStock && after < 0) {\n            throw new Error(`Insufficient stock for ${variant.productName} / ${variant.size}. Available: ${stock.quantity}`);\n          }''',
              '''          let after: number;\n          try {\n            after = nextRetailSaleQuantity(stock.quantity, item.quantity, canSellNegativeStock);\n          } catch {\n            throw new Error(\n              `Insufficient stock for ${variant.productName} / ${variant.size}. Available: ${stock.quantity}`\n            );\n          }''',
          )
          replace_once(
              route,
              '''          const sold = toNumber(saleItem.quantity);\n          const alreadyReturned = toNumber(saleItem.returnedQuantity);\n          if (quantity > sold - alreadyReturned + 0.000001) throw new Error("Return quantity exceeds the remaining sold quantity");\n\n          const stock = await lockInventoryRow(tx, companyId, saleItem.variantId, sale.locationId);\n          const after = stock.quantity + quantity;''',
              '''          const sold = toNumber(saleItem.quantity);\n          const alreadyReturned = toNumber(saleItem.returnedQuantity);\n          const nextReturnedQuantity = validateRetailReturnQuantity(sold, alreadyReturned, quantity);\n\n          const stock = await lockInventoryRow(tx, companyId, saleItem.variantId, sale.locationId);\n          const after = nextRetailReturnQuantity(stock.quantity, quantity);''',
          )
          replace_once(route, '.set({ returnedQuantity: String(alreadyReturned + quantity) })', '.set({ returnedQuantity: String(nextReturnedQuantity) })')
          replace_once(
              route,
              '''        const sourceAfter = source.quantity - body.quantity;\n        if (!canSellNegativeStock && sourceAfter < 0) throw new Error(`Insufficient stock for transfer. Available: ${source.quantity}`);\n        const destinationAfter = destination.quantity + body.quantity;''',
              '''        let sourceAfter: number;\n        let destinationAfter: number;\n        try {\n          ({ sourceAfter, destinationAfter } = nextRetailTransferQuantities(\n            source.quantity,\n            destination.quantity,\n            body.quantity,\n            canSellNegativeStock\n          ));\n        } catch {\n          throw new Error(`Insufficient stock for transfer. Available: ${source.quantity}`);\n        }''',
          )

          replace_once(
              route,
              '''const returnSchema = z.object({\n  idempotencyKey: idempotencyKeySchema,''',
              '''const returnSchema = z.object({\n  locationId: z.coerce.number().int().positive(),\n  idempotencyKey: idempotencyKeySchema,''',
          )
          replace_once(
              route,
              '''const cancelSchema = z.object({\n  idempotencyKey: idempotencyKeySchema,''',
              '''const cancelSchema = z.object({\n  locationId: z.coerce.number().int().positive(),\n  idempotencyKey: idempotencyKeySchema,''',
          )
          replace_once(
              route,
              '''      const body = returnSchema.parse(req.body);\n      const userId = currentUserId(req);''',
              '''      const body = returnSchema.parse(req.body);\n      await ensureCompanyLocation(companyId, body.locationId);\n      const userId = currentUserId(req);''',
          )
          replace_once(
              route,
              '''        if (!sale) throw new Error("Retail sale not found");\n        if (sale.status !== "completed") throw new Error("Canceled sales cannot receive additional returns");''',
              '''        if (!sale) throw new Error("Retail sale not found");\n        if (sale.locationId !== body.locationId) throw new Error("Return location must match the original sale location");\n        if (sale.status !== "completed") throw new Error("Canceled sales cannot receive additional returns");''',
          )
          replace_once(
              route,
              '''      const body = transferSchema.parse(req.body);\n      if (body.fromLocationId === body.toLocationId)''',
              '''      const body = transferSchema.parse(req.body);\n      if (req.user?.role === "POS") return res.status(403).json({ message: "POS users cannot transfer retail stock" });\n      if (body.fromLocationId === body.toLocationId)''',
          )
          replace_once(
              route,
              '''      const body = cancelSchema.parse(req.body);\n      const userId = currentUserId(req);''',
              '''      const body = cancelSchema.parse(req.body);\n      await ensureCompanyLocation(companyId, body.locationId);\n      const userId = currentUserId(req);''',
          )
          replace_once(
              route,
              '''        if (!sale) throw new Error("Retail sale not found");\n        if (sale.status === "canceled") return { replayed: true };''',
              '''        if (!sale) throw new Error("Retail sale not found");\n        if (sale.locationId !== body.locationId) throw new Error("Cancellation location must match the original sale location");\n        if (sale.status === "canceled") return { replayed: true };''',
          )

          retail = "server/routes/retailRoutes.ts"
          replace_once(
              retail,
              'import { requireAuth, requireNonPOS } from "../auth";\n',
              'import { retailStockMovements } from "@shared/schema/retailPos";\nimport { requireAuth, requireNonPOS } from "../auth";\n',
          )
          replace_once(
              retail,
              '''      const rawRows = Array.isArray(req.body?.rows) ? req.body.rows : [];\n      if (!rawRows.length) return res.status(400).json({ message: "No import rows supplied" });''',
              '''      const rawRows = Array.isArray(req.body?.rows) ? req.body.rows : [];\n      const importBatchKey = String(\n        req.body?.idempotencyKey || `retail-import-${Date.now()}-${req.user?.id ?? req.session.userId ?? "unknown"}`\n      ).slice(0, 191);\n      if (!rawRows.length) return res.status(400).json({ message: "No import rows supplied" });''',
          )
          replace_once(
              retail,
              '''          await tx\n            .insert(retailVariantInventory)''',
              '''          const [previousInventory] = await tx\n            .select({ quantity: retailVariantInventory.quantity })\n            .from(retailVariantInventory)\n            .where(\n              and(\n                eq(retailVariantInventory.companyId, companyId),\n                eq(retailVariantInventory.variantId, variant.id),\n                eq(retailVariantInventory.locationId, locationId)\n              )\n            )\n            .limit(1);\n          const quantityBefore = asNumber(previousInventory?.quantity);\n\n          await tx\n            .insert(retailVariantInventory)''',
          )
          replace_once(
              retail,
              '''          await tx\n            .update(retailProductVariants)\n            .set({ cost: String(row.cost), sellingPrice: String(row.price), updatedAt: new Date() })''',
              '''          const importMovement: typeof retailStockMovements.$inferInsert = {\n            companyId,\n            variantId: variant.id,\n            locationId,\n            movementType: "import",\n            quantityDelta: String(row.qty - quantityBefore),\n            quantityBefore: String(quantityBefore),\n            quantityAfter: String(row.qty),\n            eventKey: `import:${importBatchKey}:${variant.id}:${locationId}`.slice(0, 255),\n            referenceType: "retail_import",\n            referenceId: importBatchKey,\n            createdBy: req.user!.id,\n            metadata: { productCode: row.code, size: row.size, barcode: row.barcode },\n          };\n          await tx\n            .insert(retailStockMovements)\n            .values(importMovement)\n            .onConflictDoNothing({ target: [retailStockMovements.companyId, retailStockMovements.eventKey] });\n\n          await tx\n            .update(retailProductVariants)\n            .set({ cost: String(row.cost), sellingPrice: String(row.price), updatedAt: new Date() })''',
          )

          inventory = "client/src/pages/retail/RetailInventory.tsx"
          replace_once(
              inventory,
              'const response = await apiRequest("POST", "/api/retail/import", { rows });',
              '''const response = await apiRequest("POST", "/api/retail/import", {\n        rows,\n        idempotencyKey: `retail-import-${\n          typeof crypto !== "undefined" && "randomUUID" in crypto ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`\n        }`,\n      });''',
          )

          ui = "client/src/pages/pos/RetailPOS.tsx"
          replace_once(ui, '  city?: string | null;\n  state?: string | null;\n  country?: string | null;', '  city: string | null;\n  state: string | null;\n  country: string | null;')
          replace_once(
              ui,
              '  const [transferQuantity, setTransferQuantity] = useState(1);',
              '''  const [transferQuantity, setTransferQuantity] = useState(1);\n  const saleAttemptRef = useRef<{ fingerprint: string; key: string } | null>(null);\n  const transferAttemptRef = useRef<{ fingerprint: string; key: string } | null>(null);''',
          )
          replace_once(
              ui,
              '''      const response = await apiRequest("POST", "/api/pos/retail/sales", {\n        locationId: selectedLocation.id,\n        idempotencyKey: makeKey("retail-sale"),\n        items: cart.map((line) => ({ variantId: line.variantId, quantity: line.cartQuantity })),\n      });''',
              '''      const items = cart.map((line) => ({ variantId: line.variantId, quantity: line.cartQuantity }));\n      const fingerprint = `${selectedLocation.id}|${items\n        .map((item) => `${item.variantId}:${item.quantity}`)\n        .sort()\n        .join("|")}`;\n      if (!saleAttemptRef.current || saleAttemptRef.current.fingerprint !== fingerprint) {\n        saleAttemptRef.current = { fingerprint, key: makeKey("retail-sale") };\n      }\n      const response = await apiRequest("POST", "/api/pos/retail/sales", {\n        locationId: selectedLocation.id,\n        idempotencyKey: saleAttemptRef.current.key,\n        items,\n      });''',
          )
          replace_once(ui, '    onSuccess: async () => {\n      setCart([]);', '    onSuccess: async () => {\n      saleAttemptRef.current = null;\n      setCart([]);')
          replace_once(
              ui,
              '''    mutationFn: async ({ saleId, saleItemId }: { saleId: number; saleItemId: number }) => {\n      const response = await apiRequest("POST", `/api/pos/retail/sales/${saleId}/returns`, {\n        idempotencyKey: makeKey("retail-return"),\n        items: [{ saleItemId, quantity: 1 }],\n      });''',
              '''    mutationFn: async ({\n      saleId,\n      saleItemId,\n      returnedQuantity,\n    }: {\n      saleId: number;\n      saleItemId: number;\n      returnedQuantity: number;\n    }) => {\n      if (!selectedLocation?.id) throw new Error("Select a location first");\n      const response = await apiRequest("POST", `/api/pos/retail/sales/${saleId}/returns`, {\n        locationId: selectedLocation.id,\n        idempotencyKey: `retail-return-${saleId}-${saleItemId}-${returnedQuantity}`,\n        items: [{ saleItemId, quantity: 1 }],\n      });''',
          )
          replace_once(
              ui,
              '''      const response = await apiRequest("POST", `/api/pos/retail/sales/${saleId}/cancel`, {\n        idempotencyKey: makeKey("retail-cancel"),\n        reason: "POS sale cancellation",\n      });''',
              '''      if (!selectedLocation?.id) throw new Error("Select a location first");\n      const response = await apiRequest("POST", `/api/pos/retail/sales/${saleId}/cancel`, {\n        locationId: selectedLocation.id,\n        idempotencyKey: `retail-cancel-${saleId}`,\n        reason: "POS sale cancellation",\n      });''',
          )
          replace_once(
              ui,
              '''      const response = await apiRequest("POST", "/api/pos/retail/transfers", {\n        idempotencyKey: makeKey("retail-transfer"),\n        variantId: Number(transferVariantId),\n        fromLocationId: selectedLocation.id,\n        toLocationId: Number(transferToLocationId),\n        quantity: Number(transferQuantity),\n      });''',
              '''      const fingerprint = `${selectedLocation.id}|${transferToLocationId}|${transferVariantId}|${transferQuantity}`;\n      if (!transferAttemptRef.current || transferAttemptRef.current.fingerprint !== fingerprint) {\n        transferAttemptRef.current = { fingerprint, key: makeKey("retail-transfer") };\n      }\n      const response = await apiRequest("POST", "/api/pos/retail/transfers", {\n        idempotencyKey: transferAttemptRef.current.key,\n        variantId: Number(transferVariantId),\n        fromLocationId: selectedLocation.id,\n        toLocationId: Number(transferToLocationId),\n        quantity: Number(transferQuantity),\n      });''',
          )
          replace_once(ui, '    onSuccess: async () => {\n      setTransferVariantId("");', '    onSuccess: async () => {\n      transferAttemptRef.current = null;\n      setTransferVariantId("");')
          replace_once(
              ui,
              'onClick={() => returnMutation.mutate({ saleId: sale.id, saleItemId: item.id })}',
              'onClick={() => returnMutation.mutate({ saleId: sale.id, saleItemId: item.id, returnedQuantity: item.returnedQuantity })}',
          )

          legacy = "server/routes/pos/posSalesRoutes.ts"
          replace_once(
              legacy,
              '''      const isSpCompany = currentCoRow?.companyType === "supplier_partner";\n\n      const result = await createPosSale(''',
              '''      const isSpCompany = currentCoRow?.companyType === "supplier_partner";\n      if (currentCoRow?.companyType === "retail") {\n        return res.status(409).json({\n          message: "Retail companies must use the exact-variant retail POS endpoint",\n          code: "RETAIL_POS_ENDPOINT_REQUIRED",\n        });\n      }\n\n      const result = await createPosSale(''',
          )

          tests = "tests/retail-wave2-pos-transactions.test.ts"
          replace_once(
              tests,
              '''    expect(posIndex).toContain("registerPosSalesRoutes(app)");\n  });''',
              '''    expect(posIndex).toContain("registerPosSalesRoutes(app)");\n    const legacySales = read("server/routes/pos/posSalesRoutes.ts");\n    expect(legacySales).toContain('currentCoRow?.companyType === "retail"');\n    expect(legacySales).toContain("RETAIL_POS_ENDPOINT_REQUIRED");\n  });''',
          )
          PY

      - name: Format Wave 2 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            shared/schema/retailPos.ts \
            shared/schema/index.ts \
            server/routes/pos/retailPosRoutes.ts \
            server/routes/pos/posSalesRoutes.ts \
            server/services/retail/retailStockMath.ts \
            server/routes/retailRoutes.ts \
            client/src/pages/pos/RetailPOS.tsx \
            client/src/pages/pos/POSPage.tsx \
            client/src/pages/retail/RetailInventory.tsx \
            tests/retail-wave2-pos-transactions.test.ts \
            migrations/meta/_journal.json

      - name: Typecheck
        run: npm run check

      - name: Run Retail Wave 2 tests
        run: node node_modules/vitest/vitest.mjs run tests/retail-wave2-pos-transactions.test.ts tests/retail-wave1-contract.test.ts

      - name: Verify migrations
        run: npm run verify:migrations

      - name: Commit finalized Wave 2
        run: |
          git checkout -- package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/schema/retailPos.ts shared/schema/index.ts server/routes/pos/retailPosRoutes.ts server/routes/pos/posSalesRoutes.ts server/services/retail/retailStockMath.ts server/routes/retailRoutes.ts client/src/pages/pos/RetailPOS.tsx client/src/pages/pos/POSPage.tsx client/src/pages/retail/RetailInventory.tsx tests/retail-wave2-pos-transactions.test.ts migrations/meta/_journal.json migrations/0018_retail_pos_stock_movement.sql
          if git diff --cached --quiet; then
            echo "No finalization changes needed"
          else
            git commit -m "Complete Retail Wave 2 transaction wiring"
            git push origin HEAD:feat/retail-pos-stock-movement-wave2
          fi
