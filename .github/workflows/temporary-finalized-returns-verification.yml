name: Temporary Finalized Returns Focused Verification
on:
  push:
    branches:
      - feature/factory-finalized-loading-sale-returns
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch "${GITHUB_REF_NAME}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
      - run: npm ci --no-audit --bin-links=true
        working-directory: repo
      - name: Type-check changed route
        run: npm run check
        working-directory: repo
      - name: Focused finalized loading return tests
        run: node node_modules/vitest/vitest.mjs run tests/factory-finalized-loading-return-routes.test.ts
        working-directory: repo
