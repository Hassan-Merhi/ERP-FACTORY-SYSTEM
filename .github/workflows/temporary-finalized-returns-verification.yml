name: Temporary Finalized Returns Focused Verification
on:
  push:
    branches:
      - feature/factory-finalized-loading-sale-returns
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8b
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
      - run: npm ci --no-audit --bin-links=true
      - name: Type-check changed route
        run: npm run check
      - name: Focused finalized loading return tests
        run: node node_modules/vitest/vitest.mjs run tests/factory-finalized-loading-return-routes.test.ts
