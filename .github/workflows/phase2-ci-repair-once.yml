name: Phase 2 CI Repair Once

on:
  push:
    branches:
      - test/backend-coverage-phase2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/backend-coverage-phase2
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Repair type scope, translation inventory, and doc index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          # supplierProformaRoutes: suppliers.company_id exists at runtime via the
          # committed supplier-company-scope migration, but is intentionally not
          # yet represented in the shared Drizzle table. Use the same raw SQL
          # pattern as other company-scoped supplier compatibility paths.
          p = Path('server/routes/supplierProformaRoutes.ts')
          text = p.read_text()
          text = text.replace('import { db } from "../db";', 'import { db, pool } from "../db";', 1)
          old = '''      const [supplier] = await db\n        .select({ id: suppliers.id })\n        .from(suppliers)\n        .where(and(eq(suppliers.id, supplierId), eq(suppliers.companyId, companyId)))\n        .limit(1);\n      if (!supplier) return res.status(404).json({ message: "Supplier not found" });'''
          new = '''      const supplier = await pool.query<{ id: number }>(\n        "SELECT id FROM suppliers WHERE id = $1 AND company_id = $2 LIMIT 1",\n        [supplierId, companyId]\n      );\n      if (supplier.rowCount === 0) return res.status(404).json({ message: "Supplier not found" });'''
          if old not in text:
              raise SystemExit('supplier scope block not found')
          p.write_text(text.replace(old, new, 1))

          # Register every new user-facing backend message rather than raising
          # the Phase 14 i18n baseline.
          p = Path('client/src/i18n/backendMessagesPhase7Translations.part12.ts')
          text = p.read_text()
          marker = '\n];\n'
          entries = '''\n  {\n    en: "voucherNumber, voucherType and voucherDate are required",\n    ar: "رقم القيد ونوع القيد وتاريخ القيد مطلوبة",\n    fr: "Le numéro, le type et la date du bon sont obligatoires",\n  },\n  {\n    en: "code and label are required",\n    ar: "الرمز والتسمية مطلوبان",\n    fr: "Le code et le libellé sont obligatoires",\n  },\n  {\n    en: "templateId and name are required",\n    ar: "معرّف القالب والاسم مطلوبان",\n    fr: "L’identifiant du modèle et le nom sont obligatoires",\n  },\n  {\n    en: "No values to update",\n    ar: "لا توجد قيم للتحديث",\n    fr: "Aucune valeur à mettre à jour",\n  },\n  {\n    en: "entries must be an array",\n    ar: "يجب أن تكون الإدخالات مصفوفة",\n    fr: "Les entrées doivent être un tableau",\n  },\n  {\n    en: "date, wasteType and a valid kgWaste are required",\n    ar: "التاريخ ونوع الهدر وكمية هدر صالحة بالكيلوغرام مطلوبة",\n    fr: "La date, le type de déchet et une quantité kgWaste valide sont obligatoires",\n  },\n  {\n    en: "Invalid archive id",\n    ar: "معرّف الأرشيف غير صالح",\n    fr: "Identifiant d’archive invalide",\n  },\n  {\n    en: "Archive not found",\n    ar: "لم يتم العثور على الأرشيف",\n    fr: "Archive introuvable",\n  },\n  {\n    en: "No sheets to export",\n    ar: "لا توجد أوراق للتصدير",\n    fr: "Aucune feuille à exporter",\n  },\n'''
          if 'en: "voucherNumber, voucherType and voucherDate are required"' not in text:
              if marker not in text:
                  raise SystemExit('translation array terminator not found')
              text = text.replace(marker, entries + marker, 1)
              p.write_text(text)

          # The P0 traceability report documents finished PR #1422 work. Records
          # live under docs/archive by repository policy.
          src = Path('docs/god-file-refactor-p0-report.md')
          dst = Path('docs/archive/god-file-refactor-p0-report.md')
          if src.exists():
              dst.parent.mkdir(parents=True, exist_ok=True)
              src.replace(dst)

          p = Path('config/doc-index.json')
          data = json.loads(p.read_text())
          classification = data['classification']
          classification.pop('docs/god-file-refactor-p0-report.md', None)
          classification['docs/archive/god-file-refactor-p0-report.md'] = 'record'
          data['classification'] = dict(sorted(classification.items()))
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Format changed source
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/routes/supplierProformaRoutes.ts \
            client/src/i18n/backendMessagesPhase7Translations.part12.ts
      - name: Verify repaired audits
        run: |
          npm run check
          npm run audit:doc-index
          node scripts/audit-i18n-phase14.mjs
          npm run audit:scripts
      - name: Commit repairs and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2-ci-repair-once.yml
          git add server/routes/supplierProformaRoutes.ts \
            client/src/i18n/backendMessagesPhase7Translations.part12.ts \
            config/doc-index.json \
            docs/archive/god-file-refactor-p0-report.md
          git add -u docs/god-file-refactor-p0-report.md
          git commit -m "fix: satisfy Phase 2 type and repository contracts"
          git push origin HEAD:test/backend-coverage-phase2
