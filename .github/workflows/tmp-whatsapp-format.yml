name: Temporary WhatsApp Formatter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-whatsapp-files:
    if: github.head_ref == 'fix/scheduled-whatsapp-delivery-claims'
    runs-on: ubuntu-latest
    steps:
      - name: Clone PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${HEAD_REF}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: repo/package-lock.json
      - name: Install dependencies
        working-directory: repo
        run: npm ci --no-audit --bin-links=true
      - name: Format, remove helper workflow, and commit
        working-directory: repo
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/scheduler/maintenance.ts \
            server/services/scheduler/scheduled-jobs.ts \
            server/services/scheduler/scheduledWhatsAppDelivery.ts \
            server/services/scheduler/stock-report.ts \
            tests/phase33f-maintenance-scheduler.test.ts \
            tests/scheduled-whatsapp-delivery-claims.test.ts \
            tests/stock-report-scheduler-reliability.test.ts
          rm -f .github/workflows/tmp-whatsapp-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/services/scheduler/maintenance.ts \
            server/services/scheduler/scheduled-jobs.ts \
            server/services/scheduler/scheduledWhatsAppDelivery.ts \
            server/services/scheduler/stock-report.ts \
            tests/phase33f-maintenance-scheduler.test.ts \
            tests/scheduled-whatsapp-delivery-claims.test.ts \
            tests/stock-report-scheduler-reliability.test.ts \
            .github/workflows/tmp-whatsapp-format.yml
          git diff --cached --check
          git commit -m "style: format WhatsApp scheduler reliability changes"
          git push origin "HEAD:${HEAD_REF}"
