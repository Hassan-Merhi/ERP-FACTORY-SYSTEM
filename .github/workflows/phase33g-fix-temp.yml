name: Phase 33G Temporary Fix

on:
  push:
    branches:
      - test/phase33g-high-line-misc-20260917

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Correct duplicate-name expectation and format
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/phase33g-high-line-misc.test.ts')
          text = path.read_text()
          old = '["Widget - A", "Widget - B"]'
          new = '["Widget - B", "Widget - C"]'
          if old not in text:
              raise SystemExit('expected assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          node node_modules/prettier/bin/prettier.cjs --write tests/phase33g-high-line-misc.test.ts

      - name: Run Phase 33G focused test
        run: node node_modules/vitest/vitest.mjs run tests/phase33g-high-line-misc.test.ts

      - name: Remove temporary verification workflows and commit
        run: |
          rm -f .github/workflows/phase33g-focused-test-temp.yml
          rm -f .github/workflows/phase33g-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/phase33g-high-line-misc.test.ts .github/workflows/phase33g-focused-test-temp.yml .github/workflows/phase33g-fix-temp.yml
          git commit -m "test: fix Phase 33G duplicate-name expectation"
          git push origin HEAD:test/phase33g-high-line-misc-20260917
