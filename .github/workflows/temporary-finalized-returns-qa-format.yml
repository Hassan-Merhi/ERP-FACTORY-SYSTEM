name: Temporary Finalized Return QA Formatter
on:
  push:
    branches:
      - feature/factory-finalized-loading-sale-returns
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
      - name: Clone branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch "${GITHUB_REF_NAME}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Format
        working-directory: repo
        run: |
          npm ci --no-audit --bin-links=true
          node node_modules/prettier/bin/prettier.cjs --write \
            tests/factory-finalized-loading-return-routes.test.ts \
            server/routes/factory/customer-orders/bale-scanning/finalized-returns.ts
      - name: Commit
        working-directory: repo
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/factory-finalized-loading-return-routes.test.ts \
            server/routes/factory/customer-orders/bale-scanning/finalized-returns.ts
          git commit -m "style(factory): format finalized return QA test and safety guard"
          git push origin "HEAD:${GITHUB_REF_NAME}"
