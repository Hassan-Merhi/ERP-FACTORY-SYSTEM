name: Intercompany Phase 5 Isolated Validation

on:
  push:
    branches:
      - feature/intercompany-container-trading
  pull_request:
    branches:
      - main

concurrency:
  group: intercompany-phase5-isolated-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phase5-isolated:
    if: github.event_name == 'push' || github.head_ref == 'feature/intercompany-container-trading'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ic_phase5_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ic_phase5_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ic_phase5_test
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: local-phase5-validation-only
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Read exact branch commit through the scoped read-only GitHub token
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            | tar --extract --gzip --strip-components=1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm

      - name: Install pinned dependencies
        id: install
        run: npm ci --no-audit --bin-links=true

      - name: Compile TypeScript
        if: always() && steps.install.outcome == 'success'
        run: npm run check

      - name: Check formatting of Phase 5 changed TypeScript files
        if: always() && steps.install.outcome == 'success'
        run: |
          node node_modules/prettier/bin/prettier.cjs --check \
            server/services/intercompany/phase5Receipt.ts \
            server/services/intercompany/phase5Cancel.ts \
            server/services/intercompany/phase5LinkedLineGuard.ts \
            server/services/intercompany/tradeSync.ts \
            server/services/intercompany/sharedChargeSync.ts \
            server/routes/import/intercompany-phase5.ts \
            server/routes/import/index.ts \
            shared/schema/intercompanyTrading.ts \
            client/src/pages/intercompany/IntercompanyLifecycle.tsx \
            client/src/routes/ErpRoutes.tsx \
            client/src/app/PropertiesRoutes.tsx \
            client/src/components/PropertiesSidebar.tsx \
            client/src/pages/containers/ContainerToolbar.tsx \
            tests/intercompany-phase5-database-guards.test.ts \
            tests/intercompany-phase5-lifecycle-math.test.ts \
            tests/intercompany-phase5-mirrored-lines.test.ts

      - name: Initialize the disposable PostgreSQL reference application schema
        id: schema
        if: always() && steps.install.outcome == 'success'
        run: node node_modules/drizzle-kit/bin.cjs push --force

      - name: Execute Phase 1-5 regressions against disposable PostgreSQL
        if: always() && steps.schema.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/vitest/vitest.mjs run --maxWorkers=2 \
            tests/intercompany-phase1-foundation.test.ts \
            tests/intercompany-phase2-container-pricing.test.ts \
            tests/intercompany-phase2-database-guards.test.ts \
            tests/intercompany-phase2-destination-supplier.test.ts \
            tests/intercompany-phase3-database-guards.test.ts \
            tests/intercompany-phase3-pricing.test.ts \
            tests/intercompany-phase4-database-guards.test.ts \
            tests/intercompany-phase4-payment-money.test.ts \
            tests/intercompany-phase5-database-guards.test.ts \
            tests/intercompany-phase5-lifecycle-math.test.ts \
            tests/intercompany-phase5-mirrored-lines.test.ts
