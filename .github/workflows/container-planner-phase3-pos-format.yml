name: Container Planner Phase 3 POS format

on:
  push:
    branches:
      - feature/container-planner-phase-3-reconciliation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/container-planner-phase-3-reconciliation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format affected file
        run: node node_modules/prettier/bin/prettier.cjs --write server/services/pos/goldenCoastPosAccounting.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/pos/goldenCoastPosAccounting.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style(pos): prettier Golden Coast settlement service"
          git push origin HEAD:feature/container-planner-phase-3-reconciliation
