name: Application Routes Boundary Verification

on:
  push:
    branches:
      - fix/application-routes-god-file-boundary-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - run: node node_modules/prettier/bin/prettier.cjs --check server/routes/applicationRoutes.ts server/routes/applicationAiLazyRoutes.ts
      - run: npm run audit:god-files
      - run: npm run check
      - run: node --max-old-space-size=4096 node_modules/eslint/bin/eslint.js server/routes/applicationRoutes.ts server/routes/applicationAiLazyRoutes.ts --max-warnings 0
