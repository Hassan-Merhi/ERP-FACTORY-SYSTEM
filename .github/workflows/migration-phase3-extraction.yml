name: Migration-only Phase 3 extraction audit

on:
  pull_request:
    paths:
      - 'server/startup-schema/**'
      - 'scripts/extract-startup-schema-migrations.ts'
      - 'tests/startup-schema-extraction.test.ts'
      - '.github/workflows/migration-phase3-extraction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-and-audit:
    name: Extract 43 migration batches without DB access
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ''
      MIGRATION_CONFIRMATION: ''
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund
      - name: Run extraction contract test
        run: npx vitest run tests/startup-schema-extraction.test.ts
      - name: Extract review-only SQL
        run: npx tsx scripts/extract-startup-schema-migrations.ts --out "$RUNNER_TEMP/startup-sql-review"
      - name: Check output counts and review gates
        run: |
          node --input-type=module - "$RUNNER_TEMP/startup-sql-review/manifest.json" <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(manifest.modules.length, 43);
          assert.equal(manifest.status, 'REVIEW_ONLY_NOT_REGISTERED');
          assert.ok(manifest.totalStatements >= 1300);
          assert.ok(manifest.requiresManualDmlReview.length > 0);
          assert.ok(manifest.originalStartupArraySha256?.length === 64);
          console.log('Verified extraction source order, statement inventory and DML-review gate');
          NODE
      - name: Upload review-only SQL and checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: startup-schema-review-only-sql
          path: ${{ runner.temp }}/startup-sql-review/
          if-no-files-found: error
          retention-days: 7
