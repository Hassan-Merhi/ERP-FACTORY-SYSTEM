name: Temporary backend-only cost guard formatter
on:
  push:
    branches: [fix/offload-downstream-cost-repricing-20261026]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - run: node node_modules/prettier/bin/prettier.cjs --write server/services/containers/offload-lifecycle/execute.ts server/services/containers/offload-lifecycle/offloadCostBasisGuard.ts tests/offload-downstream-cost-immutability.test.ts tests/wave15-stock-paths.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "ERP format bot"
          git config user.email "format-bot@users.noreply.github.com"
          git add -- server/services/containers/offload-lifecycle/execute.ts server/services/containers/offload-lifecycle/offloadCostBasisGuard.ts tests/offload-downstream-cost-immutability.test.ts tests/wave15-stock-paths.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format backend offload cost integrity guard"
            git push origin HEAD:fix/offload-downstream-cost-repricing-20261026
          fi
