name: Temporary format attendance payroll fix

on:
  push:
    branches:
      - fix/attendance-report-payroll-reconciliation-20261103

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/attendance-report-payroll-reconciliation-20261103
          persist-credentials: true

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format changed source files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/factory/FactoryWorkerAttendanceReport.tsx \
            server/services/payroll/attendanceReportSalary.ts \
            tests/attendance-report-payroll-reconciliation.test.ts

      - name: Commit automatic formatting only
        run: |
          set -euo pipefail
          git add client/src/pages/factory/FactoryWorkerAttendanceReport.tsx server/services/payroll/attendanceReportSalary.ts tests/attendance-report-payroll-reconciliation.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(payroll): format attendance reconciliation files"
          git push origin HEAD:refs/heads/fix/attendance-report-payroll-reconciliation-20261103
