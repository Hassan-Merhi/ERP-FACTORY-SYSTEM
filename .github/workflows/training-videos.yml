name: Record Real ERP Training Videos (Disposable Data)

on:
  # Exercise one real disposable browser tour on recorder changes BEFORE merge.
  # No production connection or publication credentials are present in this job.
  pull_request:
    paths:
      - "scripts/record-training-guides.mjs"
      - "scripts/training-narration.mjs"
      - "scripts/training-narration-tts.py"
      - "scripts/nightly-system-regression.test.mjs"
      - ".github/workflows/training-videos.yml"
  workflow_call:
    inputs:
      topic:
        description: "Comma-separated tour IDs selected by the nightly audit"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      topic:
        description: "Approved UI tour to record"
        required: true
        default: factory-overview
        type: choice
        options:
          - factory-overview
          - factory-stock-entry
          - factory-raw-materials
          - factory-bale-explorer
          - factory-containers
          - factory-stock-allocation
          - factory-invoicing
          - factory-payroll
          - factory-accounts
          - factory-analytics
          - erp-tracking
          - erp-inventory
          - erp-pos
          - erp-vouchers
          - erp-daybook
          - erp-reports
          - all

permissions:
  contents: read

jobs:
  record-training:
    runs-on: ubuntu-26.04
    # Sixteen narrated tours take roughly 4-5 minutes each to capture and voice.
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      ERP_E2E_DISPOSABLE_DB: "1"
      TRAINING_SANDBOX_VERIFIED: "1"
      TRAINING_BASE_URL: http://127.0.0.1:5000
      TRAINING_TOPIC: ${{ inputs.topic || 'factory-overview,erp-tracking' }}
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      PORT: "5000"
      API_RATE_LIMIT_MAX: "100000"
      API_RATE_LIMIT_ANON_MAX: "100000"
      ERP_E2E_USERNAME: training_ci_${{ github.run_id }}
      ERP_E2E_POS_USERNAME: training_pos_${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
      - name: Generate disposable user and session secrets
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const lines = ["SESSION_SECRET", "ERP_E2E_PASSWORD", "ERP_E2E_POS_PASSWORD"].map((key) => key + "=" + crypto.randomBytes(48).toString("hex"));
          fs.appendFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n");
          NODE
      - run: npm ci --ignore-scripts
      - name: Install browser and encoder
        timeout-minutes: 17
        run: |
          # A stalled apt mirror once held this step for 40 minutes; bound each
          # attempt and retry instead of letting the job time out.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq &&
               timeout 300 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg; then
              break
            fi
            if [ "$attempt" = 3 ]; then echo "::error::ffmpeg could not be installed"; exit 1; fi
            echo "ffmpeg install attempt $attempt failed; retrying"
            sleep 20
          done
          node node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome
      - name: Install the offline narration voice (Piper, verified checksums)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet piper-tts==1.8.0
          voice="$RUNNER_TEMP/training-voice"
          mkdir -p "$voice"
          # The en_US-lessac-medium voice is published by the Piper project. The
          # sherpa-onnx release mirror and the original Hugging Face repository
          # carry byte-identical model files; either source must match the pins.
          if curl -fsSL --retry 3 -o "$voice/voice.tar.bz2" \
               https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-lessac-medium.tar.bz2; then
            tar -xjf "$voice/voice.tar.bz2" -C "$voice" --strip-components=1 \
              vits-piper-en_US-lessac-medium/en_US-lessac-medium.onnx \
              vits-piper-en_US-lessac-medium/en_US-lessac-medium.onnx.json
          else
            echo "Release mirror unavailable, using the Piper voice repository"
            curl -fsSL --retry 3 -o "$voice/en_US-lessac-medium.onnx" \
              https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium/en_US-lessac-medium.onnx
            curl -fsSL --retry 3 -o "$voice/en_US-lessac-medium.onnx.json" \
              https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
          fi
          printf '%s\n' \
            "4ba07d8549906668ee855fd9abf9faf66c5db74742712ff026a159f7277fca9f  $voice/en_US-lessac-medium.onnx" \
            "efe19c417bed055f2d69908248c6ba650fa135bc868b0e6abb3da181dab690a0  $voice/en_US-lessac-medium.onnx.json" \
            | sha256sum -c -
          echo "TRAINING_TTS_MODEL=$voice/en_US-lessac-medium.onnx" >> "$GITHUB_ENV"
          # Prove the voice synthesizes before spending an hour on browser capture.
          printf '[{"id":"check","text":"Narration voice ready."}]' > "$voice/check.json"
          python3 scripts/training-narration-tts.py --model "$voice/en_US-lessac-medium.onnx" \
            --input "$voice/check.json" --output-dir "$voice/check-out" > /dev/null
      - name: Build actual ERP / Factory application
        run: |
          npm run prebuild
          node --max-old-space-size=4096 node_modules/vite/bin/vite.js build
          node scripts/build-server.mjs
          node scripts/verify-server-bundle.mjs
          node scripts/verify-runtime-dependencies.mjs
      - name: Prepare isolated sample companies
        run: |
          node node_modules/drizzle-kit/bin.cjs push --force
          node scripts/prepare-phase7-browser-e2e-fixture.mjs
      - name: Capture actual working screens with read-only browser automation
        run: |
          mkdir -p artifacts/training-videos
          npm start > artifacts/training-videos/server.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:5000/api/health/db >/dev/null 2>&1; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then cat artifacts/training-videos/server.log; exit 1; fi
            if [ "$attempt" = 180 ]; then cat artifacts/training-videos/server.log; exit 1; fi
            sleep 1
          done
          node scripts/record-training-guides.mjs
      - name: Upload review-only video and guide artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: real-erp-training-${{ github.run_id }}
          path: artifacts/training-videos
          if-no-files-found: warn
          retention-days: 30
