name: Temporary Phase 6 Prettier Fix
on:
  pull_request:
    paths:
      - ".github/workflows/offline-phase6-autofmt-once.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/offline-phase6-certification-20261030'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/offline-phase6-certification-20261030
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: node node_modules/prettier/bin/prettier.cjs --write tests/offline-phase6-certification.node.test.mjs
      - name: Commit formatting on Phase 6 branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -- tests/offline-phase6-certification.node.test.mjs
          if ! git diff --cached --quiet; then
            git -c user.name="Phase 6 Formatter" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(offline): format Phase 6 test"
            git push origin HEAD:feat/offline-phase6-certification-20261030
          fi
