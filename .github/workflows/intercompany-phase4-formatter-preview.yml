name: Phase 4 Formatting Preview (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/intercompany-phase4-formatter-preview.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-26.04
    timeout-minutes: 16
    steps:
      - name: Extract feature commit read-only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$TARGET_SHA" \
            | tar --extract --gzip --strip-components=1
      - name: Install lockfile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Show UTF-8 files after pinned prettier
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/prettier/bin/prettier.cjs --write server/services/intercompany/paymentMoney.ts
          node node_modules/prettier/bin/prettier.cjs --write server/services/intercompany/paymentAllocationCore.ts
          node node_modules/prettier/bin/prettier.cjs --write server/services/intercompany/paymentSync.ts
          node node_modules/prettier/bin/prettier.cjs --write server/services/intercompany/paymentQueries.ts
          node node_modules/prettier/bin/prettier.cjs --write server/routes/import/intercompany-phase4.ts
          node node_modules/prettier/bin/prettier.cjs --write server/routes/import/index.ts
          node node_modules/prettier/bin/prettier.cjs --write client/src/pages/intercompany/IntercompanyPayments.tsx
          node node_modules/prettier/bin/prettier.cjs --write client/src/routes/ErpRoutes.tsx
          node node_modules/prettier/bin/prettier.cjs --write client/src/app/PropertiesRoutes.tsx
          node node_modules/prettier/bin/prettier.cjs --write client/src/components/PropertiesSidebar.tsx
          node node_modules/prettier/bin/prettier.cjs --write client/src/pages/containers/ContainerToolbar.tsx
          node node_modules/prettier/bin/prettier.cjs --write shared/schema/intercompanyTrading.ts
          node node_modules/prettier/bin/prettier.cjs --write tests/intercompany-phase4-payment-money.test.ts
          node node_modules/prettier/bin/prettier.cjs --write tests/intercompany-phase4-database-guards.test.ts
          node node_modules/prettier/bin/prettier.cjs --write config/ci-ratchet-allowances.json
          node node_modules/prettier/bin/prettier.cjs --write docs/intercompany-container-trading-phase1.md
          node - <<'NODE'
          const fs = require("node:fs");
          const paths = ["server/services/intercompany/paymentMoney.ts","server/services/intercompany/paymentAllocationCore.ts","server/services/intercompany/paymentSync.ts","server/services/intercompany/paymentQueries.ts","server/routes/import/intercompany-phase4.ts","server/routes/import/index.ts","client/src/pages/intercompany/IntercompanyPayments.tsx","client/src/routes/ErpRoutes.tsx","client/src/app/PropertiesRoutes.tsx","client/src/components/PropertiesSidebar.tsx","client/src/pages/containers/ContainerToolbar.tsx","shared/schema/intercompanyTrading.ts","tests/intercompany-phase4-payment-money.test.ts","tests/intercompany-phase4-database-guards.test.ts","config/ci-ratchet-allowances.json","docs/intercompany-container-trading-phase1.md"];
          for(const path of paths) {
            console.log("BEGIN_FORMATTED_FILE:" + path);
            console.log(fs.readFileSync(path).toString("base64"));
            console.log("END_FORMATTED_FILE:" + path);
          }
          NODE
