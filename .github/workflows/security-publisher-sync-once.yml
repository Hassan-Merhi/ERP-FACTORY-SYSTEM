name: Security publisher narrated-training premerge sync

on:
  push:
    branches: [fix/security-quality-36-20261104]
    paths: [.github/workflows/security-publisher-sync-once.yml]

permissions: {}

jobs:
  verify-and-sync:
    if: github.repository == 'Hassan-Merhi/ERP-FACTORY-SYSTEM' && github.ref == 'refs/heads/fix/security-quality-36-20261104'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout only shared security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/security-quality-36-20261104
          fetch-depth: 0
          persist-credentials: false

      - name: Merge main and reconcile only already-ported narrated publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "security-merge-validation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          if ! git merge --no-ff --no-commit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "${#conflicts[@]}" != "1" || "${conflicts[0]}" != ".github/workflows/publish-training-video.yml" ]]; then
              printf 'Unexpected merge conflict(s): %s\n' "${conflicts[*]}"
              exit 1
            fi
            # Security PR already integrated main's AAC + 1-20 minute validation.
            # Keep its separated read-only review and protected publisher jobs.
            git checkout --ours -- .github/workflows/publish-training-video.yml
            git add .github/workflows/publish-training-video.yml
          fi
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "::error::Unresolved conflicts"
            exit 1
          fi
          pub=.github/workflows/publish-training-video.yml
          grep -Fq 'needs: verify-recording' "$pub"
          grep -Fq 'environment: training-publication' "$pub"
          grep -Fq 'audio?.codec_name !== "aac"' "$pub"
          grep -Fq 'duration < 60 || duration > 1200' "$pub"
          grep -Fq 'Verify H.264 video with AAC narration' "$pub"
          ! grep -Fq 'duration < 35 || duration > 60' "$pub"
          grep -Fq 'min-height: 48px;' client/src/pages/vouchers/voucher-premium.css
          grep -Fq 'source_run_id:' "$pub"
          test -f scripts/training-narration.mjs
          test -f scripts/training-narration.test.mjs
          test -f server/services/rental/rentalCashboxPolicy.ts
          test -f vendor/secure-deepmerge/index.cjs
          git diff --check

      - name: Install verified Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'

      - name: Validate security and latest training publication contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/audit-doc-index.mjs
          node scripts/audit-script-inventory.mjs
          node --test scripts/nightly-system-regression.test.mjs scripts/training-narration.test.mjs
          node node_modules/vitest/vitest.mjs run \
            tests/security-workflow-token-boundaries.test.ts \
            tests/security-supply-chain-pins.test.ts \
            tests/security-dependency-lockfiles.test.ts \
            tests/security-deepmerge-override.test.ts \
            tests/properties-rent-cashbox-policy.test.ts

      - name: Commit latest main integration, remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/security-publisher-sync-once.yml
          git add --all
          git diff --cached --check
          git commit -m "chore(security): preserve narrated training and sync latest main before PR merge"
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/security-quality-36-20261104
