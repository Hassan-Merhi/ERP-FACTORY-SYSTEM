name: Phase 5b - Sync main and format security tests once

on:
  push:
    branches: [fix/security-quality-36-20261104]
    paths: [.github/workflows/phase5b-sync-verify-once.yml]

permissions: {}

jobs:
  synchronize:
    name: Safely incorporate latest main without bypassing checks
    if: github.repository == 'Hassan-Merhi/ERP-FACTORY-SYSTEM' && github.ref == 'refs/heads/fix/security-quality-36-20261104'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout the shared security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/security-quality-36-20261104
          fetch-depth: 0
          persist-credentials: false

      - name: Sync current main without discarding independent UI changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "security-closeout[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          if ! git merge --no-ff --no-commit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "${#conflicts[@]}" != "1" || "${conflicts[0]}" != "client/src/pages/factory/FactoryInvoicing.tsx" ]]; then
              printf 'Unexpected conflict(s): %s\n' "${conflicts[*]}"
              exit 1
            fi
            # The branch's invoicing file is a Prettier-only version of
            # latest main; keep it while retaining unrelated main changes.
            git checkout --ours -- client/src/pages/factory/FactoryInvoicing.tsx
            git add client/src/pages/factory/FactoryInvoicing.tsx
          fi
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "::error::Unresolved sync conflicts remain"
            exit 1
          fi
          grep -q 'Invoices & Loading' client/src/components/FactorySidebar.tsx
          if grep -q 'button-invoicing-new-invoice' client/src/pages/factory/FactoryInvoicing.tsx; then
            echo "::error::Main's hidden New Invoice button behavior was lost"
            exit 1
          fi
          git diff origin/main -- client/src/components/FactorySidebar.tsx

      - name: Install repository formatter without lifecycle scripts
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
      - name: Verify and apply exact formatting
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund --no-audit
          node node_modules/prettier/bin/prettier.cjs --write tests/security-supply-chain-pins.test.ts
          node node_modules/prettier/bin/prettier.cjs --check tests/security-supply-chain-pins.test.ts
          node scripts/audit-doc-index.mjs
          node scripts/audit-script-inventory.mjs
          node node_modules/vitest/vitest.mjs run tests/security-supply-chain-pins.test.ts tests/security-workflow-token-boundaries.test.ts tests/security-dependency-lockfiles.test.ts tests/security-deepmerge-override.test.ts

      - name: Create verified merge commit and delete one-time workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm -- .github/workflows/phase5b-sync-verify-once.yml
          git add config/doc-index.json client/src/components/FactorySidebar.tsx client/src/pages/factory/FactoryInvoicing.tsx tests/security-supply-chain-pins.test.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(security): synchronize latest main and pass Phase 5b repository checks"
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/security-quality-36-20261104
