# Phase 6 one-time formatting and focused UI regression validation.
# The workflow deletes its own file after the formatting commit.
name: Phase 6 One-Time Focused Verification
on:
  push:
    branches:
      - feature/unified-search-phase1-20261120
    paths:
      - .github/workflows/phase6-focused-validation-once.yml

permissions:
  contents: write

concurrency:
  group: phase6-focused-verify
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Hassan-Merhi/ERP-FACTORY-SYSTEM' && github.ref == 'refs/heads/feature/unified-search-phase1-20261120'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/unified-search-phase1-20261120
          fetch-depth: 0
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --bin-links=true
      - name: Format changed sources and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          files=(
            client/src/lib/companySessionSync.ts
            tests/ui/company-cross-tab-sync.test.tsx
            tests/ui/erp-run-payroll-model.test.tsx
            tests/ui/transaction-journal-page-behavior.test.tsx
            tests/ui/wave4-page-interactions.test.tsx
            client/src/pages/factory/factory-suppliers/SupplierPaymentFxDialogs.tsx
          )
          node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
          node node_modules/prettier/bin/prettier.cjs --check "${files[@]}"
          rm .github/workflows/phase6-focused-validation-once.yml
          git add -- "${files[@]}" .github/workflows/phase6-focused-validation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(phase6): fix merge formatting and focused regression fixtures"
          git push origin HEAD:refs/heads/feature/unified-search-phase1-20261120
      - name: Focused frontend regressions
        run: |
          node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts \
            tests/ui/erp-run-payroll-model.test.tsx \
            tests/ui/transaction-journal-page-behavior.test.tsx \
            tests/ui/wave4-page-interactions.test.tsx
