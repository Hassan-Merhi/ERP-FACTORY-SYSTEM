name: Temporary Gradle 9.8.1 Wrapper JAR Repair

on:
  push:
    branches:
      - security/priority4-gradle-wrapper-integrity-20261019
    paths:
      - .github/workflows/temporary-gradle-wrapper-binary-repair.yml

permissions:
  contents: write

jobs:
  repair-wrapper-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Replace mismatched JAR with verified Gradle release binary
        shell: bash
        run: |
          set -euo pipefail
          wrapper=android/gradle/wrapper/gradle-wrapper.jar
          echo "Original wrapper jar SHA256:"
          sha256sum "$wrapper"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 15 --max-time 120 \
            https://services.gradle.org/distributions/gradle-9.8.1-wrapper.jar \
            --output /tmp/gradle-9.8.1-wrapper.jar
          echo '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  /tmp/gradle-9.8.1-wrapper.jar' | sha256sum --check --strict
          cp -- /tmp/gradle-9.8.1-wrapper.jar "$wrapper"
          echo '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict

      - name: Commit verified Gradle JAR to security PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- android/gradle/wrapper/gradle-wrapper.jar
          if ! git diff --cached --quiet; then
            git commit -m 'security(android): replace Gradle wrapper JAR with verified 9.8.1 release'
            git push origin HEAD:refs/heads/security/priority4-gradle-wrapper-integrity-20261019
          fi
