name: Recurring journals one-shot format repair

on:
  push:
    branches:
      - feature/recurring-month-end-journals

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/recurring-month-end-journals
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Repair hook dependencies
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const recurringPath = "client/src/pages/daybook/RecurringJournalPanel.tsx";
          let recurring = fs.readFileSync(recurringPath, "utf8");
          const oldDeps = "}, [recurring?.id, recurring?.timezone, recurring?.endDate, recurring?.descriptionTemplate]);";
          if (!recurring.includes(oldDeps)) throw new Error("Recurring journal hook marker not found");
          recurring = recurring.replace(oldDeps, "}, [recurring]);");
          fs.writeFileSync(recurringPath, recurring);

          const stockPath = "client/src/pages/StockInSalesReportDetail.tsx";
          let stock = fs.readFileSync(stockPath, "utf8");
          const oldAdjustment = "  const adjustmentRows = data?.adjustments?.rows || [];";
          if (!stock.includes(oldAdjustment)) throw new Error("Stock adjustment hook marker not found");
          stock = stock.replace(
            oldAdjustment,
            "  const adjustmentRows = useMemo(() => data?.adjustments?.rows || [], [data?.adjustments?.rows]);"
          );
          fs.writeFileSync(stockPath, stock);
          NODE

      - name: Format touched source
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/i18n/accountingDocumentTranslations.ts \
            client/src/pages/daybook/RecurringJournalPanel.tsx \
            client/src/pages/StockInSalesReportDetail.tsx \
            server/routes/vouchers/recurringJournalRoutes.ts \
            server/services/accounting/recurringJournalService.ts \
            shared/schema/erp/recurring-journals.ts

      - name: Verify lint and formatting
        run: |
          npm run lint
          node node_modules/prettier/bin/prettier.cjs --check \
            client/src/i18n/accountingDocumentTranslations.ts \
            client/src/pages/daybook/RecurringJournalPanel.tsx \
            client/src/pages/StockInSalesReportDetail.tsx \
            server/routes/vouchers/recurringJournalRoutes.ts \
            server/services/accounting/recurringJournalService.ts \
            shared/schema/erp/recurring-journals.ts

      - name: Remove one-shot workflow and commit repairs
        run: |
          rm .github/workflows/format-recurring-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/format-recurring-one-shot.yml \
            client/src/i18n/accountingDocumentTranslations.ts \
            client/src/pages/daybook/RecurringJournalPanel.tsx \
            client/src/pages/StockInSalesReportDetail.tsx \
            server/routes/vouchers/recurringJournalRoutes.ts \
            server/services/accounting/recurringJournalService.ts \
            shared/schema/erp/recurring-journals.ts
          if git diff --cached --quiet; then
            echo "No repairs to commit."
            exit 0
          fi
          git commit -m "fix: clear recurring journal source gates"
          git push origin HEAD:feature/recurring-month-end-journals
