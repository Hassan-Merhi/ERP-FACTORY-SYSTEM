# Temporary, branch-limited formatter. Remove after the formatted commit.
name: Temporary Proforma Prettier
on:
  push:
    branches:
      - fix/proforma-price-isolation-20261105
permissions:
  contents: write
concurrency:
  group: temporary-proforma-prettier
  cancel-in-progress: true
jobs:
  prettier:
    if: github.repository == 'Hassan-Merhi/ERP-FACTORY-SYSTEM'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout the proforma branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/proforma-price-isolation-20261105
          fetch-depth: 0
          persist-credentials: true
      - name: Use pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Install formatting dependencies
        run: npm ci --ignore-scripts
      - name: Format only changed TypeScript and JavaScript sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- client/src server shared tests scripts | grep -E '\\.(ts|tsx|css|mjs)$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
          fi
      - name: Commit formatting to the same feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src server shared tests scripts
          if ! git diff --cached --quiet; then
            git commit -m "style: format proforma destination pricing changes"
            git push origin HEAD:fix/proforma-price-isolation-20261105
          fi
