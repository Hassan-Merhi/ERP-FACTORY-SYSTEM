name: One-time Properties WhatsApp formatting
on:
  push:
    branches:
      - feature/properties-account-statement-whatsapp
    paths:
      - .github/workflows/properties-wa-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/properties-account-statement-whatsapp
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format changed files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/accounts/AccountStatementView.tsx \
            client/src/pages/accounts/PropertiesWhatsAppStatement.tsx \
            server/routes/propertiesAccountStatementWhatsAppRoutes.ts \
            server/services/propertiesAccountStatementWhatsApp.ts
      - name: Commit formatting only
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add client/src/pages/accounts/AccountStatementView.tsx \
              client/src/pages/accounts/PropertiesWhatsAppStatement.tsx \
              server/routes/propertiesAccountStatementWhatsAppRoutes.ts \
              server/services/propertiesAccountStatementWhatsApp.ts
            git commit -m 'style(properties-wa): apply repository Prettier rules'
            git push origin HEAD:feature/properties-account-statement-whatsapp
          fi
