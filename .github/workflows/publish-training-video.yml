name: Approve & Publish ERP Training Video

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful nightly or manual training recorder run ID"
        required: true
        type: string
      topic:
        description: "ONE reviewed topic ID (not all)"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: training-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Maintainer MUST configure required environment reviewers in GitHub
    # before setting the TRAINING_PUBLICATION_APPROVAL_ENABLED environment variable.
    environment: training-publication
    env:
      GH_TOKEN: ${{ github.token }}
      TRAINING_PUBLICATION_APPROVAL_ENABLED: ${{ vars.TRAINING_PUBLICATION_APPROVAL_ENABLED }}
      SOURCE_RUN: ${{ inputs.source_run_id }}
      TOPIC: ${{ inputs.topic }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
      - name: Fail closed unless protected approval and storage are configured
        shell: bash
        run: |
          set -euo pipefail
          test "$TRAINING_PUBLICATION_APPROVAL_ENABLED" = "true" || {
            echo "::error::Protected training publication approval is not configured"; exit 1;
          }
          [[ "$SOURCE_RUN" =~ ^[0-9]{1,15}$ ]] || exit 1
          [[ "$TOPIC" =~ ^[a-z0-9-]{1,80}$ ]] || exit 1
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || {
            echo "::error::Protected GitHub OIDC identity is unavailable"; exit 1;
          }
      - name: Fetch vetted successful training run
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/source-run.json", "utf8"));
          if (run.status !== "completed" || run.conclusion !== "success" ||
              run.head_branch !== "main" || run.repository?.full_name !== process.env.GITHUB_REPOSITORY ||
              !["schedule", "workflow_dispatch"].includes(run.event)) {
            throw new Error("Not a successful main-branch training run");
          }
          if (!/^[0-9a-f]{40}$/.test(run.head_sha)) throw new Error("Missing recording source commit");
          const allowed = ["nightly-training-audit.yml", "training-videos.yml"];
          if (!allowed.some((value) => String(run.path || "").includes(".github/workflows/" + value))) {
            throw new Error("Not an approved training recording workflow");
          }
          fs.appendFileSync(process.env.GITHUB_ENV, "TRAINING_SOURCE_SHA=" + run.head_sha + "\n");
          NODE
          gh run download "$SOURCE_RUN" -n "real-erp-training-$SOURCE_RUN" -D "$RUNNER_TEMP/review"
      - name: Validate recorded evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const root = path.join(process.env.RUNNER_TEMP, "review");
          const topic = process.env.TOPIC;
          const report = JSON.parse(fs.readFileSync(path.join(root, "report.json"), "utf8"));
          if (!Array.isArray(report)) throw new Error("Missing recording report");
          const entry = report.find((item) => item.topic === topic);
          if (!entry || entry.sourceSha !== process.env.TRAINING_SOURCE_SHA || entry.status !== "captured" || entry.requiresReview !== true) {
            throw new Error("The selected video has no successful reviewed-candidate recording");
          }
          for (const file of ["screen.webm", "captions.vtt", "guide.md", "screenshot.png"]) {
            const full = path.join(root, topic, file);
            if (!fs.statSync(full).isFile() || fs.statSync(full).size < 16) {
              throw new Error("Missing or empty recording: " + file);
            }
          }
          if (!fs.readFileSync(path.join(root, topic, "captions.vtt"), "utf8").startsWith("WEBVTT")) {
            throw new Error("Invalid captions");
          }
          NODE
      - name: Upload reviewed videos, captions and screenshots to PRIVATE Vercel Blob
        shell: bash
        run: |
          set -euo pipefail
          node scripts/upload-reviewed-training-vercel.mjs
      - name: Propose publication for code review and deployment
        env:
          TRAINING_PUBLISH_TOPIC: ${{ inputs.topic }}
          TRAINING_APPROVED_BY: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          export TRAINING_APPROVED_GUIDE_PATH="$RUNNER_TEMP/review/$TOPIC/guide.md"
          node scripts/register-published-training.mjs
          branch="training/publish-$SOURCE_RUN-$TOPIC"
          git config user.name "training-publication[bot]"
          git config user.email "training-publication@users.noreply.github.com"
          git checkout -b "$branch"
          git add shared/publishedTrainingMedia.json
          git commit -m "Publish reviewed $TOPIC video from $TRAINING_SOURCE_SHA"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Publish approved training: $TOPIC" \
            --body "Human-approved private training media from recording run $SOURCE_RUN. Original source commit: $TRAINING_SOURCE_SHA. Files reside in a private Vercel Blob store; the ERP streams them only to authenticated users after this PR is merged and deployed. No live accounting or Factory data was modified."
