name: Approve & Publish ERP Training Video

# Manual re-publication of ONE topic from an earlier recording run, for
# example to roll a topic back to a previous night's video. The nightly audit
# publishes its own recordings automatically; this workflow is the override.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful nightly or manual training recorder run ID"
        required: true
        type: string
      topic:
        description: "ONE topic ID to publish from that run (not all)"
        required: true
        type: string

# A source recorder is read and vetted without any repository write token.
# Protected publication runs only after validation and environment approval.
permissions: {}

concurrency:
  group: training-publisher
  cancel-in-progress: false

jobs:
  verify-recording:
    name: Validate training recording without publication privileges
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run_id }}
      TOPIC: ${{ inputs.topic }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
      - name: Reject malformed source identifiers before calling GitHub API
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]{1,15}$ ]] || exit 1
          [[ "$TOPIC" =~ ^[a-z0-9-]{1,80}$ ]] || exit 1
      - name: Fetch vetted completed recorder job (independent of unrelated audit failures)
        id: source
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = process.env.RUNNER_TEMP;
          const run = JSON.parse(fs.readFileSync(root + "/source-run.json", "utf8"));
          if (run.status !== "completed" || !["success", "failure"].includes(run.conclusion) ||
              run.head_branch !== "main" || run.repository?.full_name !== process.env.GITHUB_REPOSITORY ||
              !["push", "schedule", "workflow_dispatch"].includes(run.event)) {
            throw new Error("Not an eligible completed main-branch recording run");
          }
          if (!/^[0-9a-f]{40}$/.test(run.head_sha)) throw new Error("Missing recording source commit");
          const allowed = ["nightly-training-audit.yml", "training-videos.yml"];
          if (!allowed.some((value) => String(run.path || "").includes(".github/workflows/" + value))) {
            throw new Error("Not an approved training recording workflow");
          }
          // A nightly audit can fail an unrelated payroll/security/backend test.
          // Require the actual recording job to have completed successfully, and
          // separately validate its specific artifact, codec, SHA and duration.
          const data = JSON.parse(fs.readFileSync(root + "/source-jobs.json", "utf8"));
          const recorder = (data.jobs || []).filter((job) =>
            job.name === "record-training" || job.name === "record / record-training");
          if (recorder.length !== 1 || recorder[0].status !== "completed" ||
              recorder[0].conclusion !== "success") {
            throw new Error("The requested run has no successful training recording job");
          }
          fs.appendFileSync(process.env.GITHUB_ENV, "TRAINING_SOURCE_SHA=" + run.head_sha + "\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "source_sha=" + run.head_sha + "\n");
          NODE
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" -n "real-erp-training-$SOURCE_RUN" -D "$RUNNER_TEMP/review"
      - name: Install the decoder used to re-verify the recording
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Verify the H.264 + AAC narrated recording, captions, guide and 1-20 minute duration
        env:
          TRAINING_REVIEW_DIR: ${{ runner.temp }}/review
          TRAINING_TOPICS: ${{ inputs.topic }}
          TRAINING_VALIDATION_OUTPUT: ${{ runner.temp }}/review/validated-recordings.json
        run: node scripts/validate-training-recording.mjs
      - name: Transfer immutable validated candidate to protected publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vetted-training-publication
          path: ${{ runner.temp }}/review/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Protected publication after successful validation
    needs: verify-recording
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # This job alone has both the publication environment and the OIDC identity
    # the storage gateway trusts. It never runs unless verify-recording passed.
    environment: training-publication
    env:
      TRAINING_PUBLICATION_APPROVAL_ENABLED: ${{ vars.TRAINING_PUBLICATION_APPROVAL_ENABLED }}
      SOURCE_RUN: ${{ inputs.source_run_id }}
      TOPIC: ${{ inputs.topic }}
      TRAINING_SOURCE_SHA: ${{ needs.verify-recording.outputs.source_sha }}
      TRAINING_REVIEW_DIR: ${{ runner.temp }}/review
      TRAINING_VALIDATION: ${{ runner.temp }}/review/validated-recordings.json
      TRAINING_PUBLISHED_BY: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
      - name: Fail closed unless protected approval and storage are configured
        shell: bash
        run: |
          set -euo pipefail
          test "$TRAINING_PUBLICATION_APPROVAL_ENABLED" = "true" || {
            echo "::error::Protected training publication approval is not configured"; exit 1;
          }
          [[ "$SOURCE_RUN" =~ ^[0-9]{1,15}$ ]] || exit 1
          [[ "$TOPIC" =~ ^[a-z0-9-]{1,80}$ ]] || exit 1
          [[ "$TRAINING_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || {
            echo "::error::Protected GitHub OIDC identity is unavailable"; exit 1;
          }
      - name: Download exact validated recording (not arbitrary run input)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vetted-training-publication
          path: ${{ runner.temp }}/review/
      - name: Upload the validated video, captions and screenshot to PRIVATE Vercel Blob and update the runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/upload-reviewed-training-vercel.mjs
          echo "Published $TOPIC from $TRAINING_SOURCE_SHA; it is live in Help & Training as soon as the ERP refreshes its manifest (about one minute)."
      - name: Keep the publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: manual-training-publication-${{ inputs.topic }}
          path: ${{ runner.temp }}/review/published-upload-report.json
          if-no-files-found: warn
          retention-days: 30
