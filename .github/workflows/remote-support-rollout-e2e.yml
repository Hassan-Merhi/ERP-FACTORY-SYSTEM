name: Remote Support Rollout E2E

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/remote-support-rollout-e2e.yml"
      - "client/src/hooks/remote-control-surface-coverage.ts"
      - "client/src/hooks/remote-control-surface-coverage.test.ts"
      - "client/src/hooks/screen-feed-capture-engine.ts"
      - "client/src/hooks/screen-feed-capture-engine.test.ts"
      - "client/src/lib/screen-feed-binary-transport.ts"
      - "client/src/pages/settings/RemoteSupportWatchDialog.tsx"
      - "server/routes/screenFeedRoutes.ts"
      - "server/routes/screenFeedTransportHardening.ts"
      - "shared/remoteSupportTransport.ts"
      - "scripts/verify-remote-support-phase17-invariants.mjs"
      - "scripts/verify-remote-support-rollout-metrics.mjs"
      - "tests/e2e/remote-support-watch.spec.mjs"
      - "tests/ui/remote-support-fast-viewer.test.ts"
      - "docs/archive/remote-support-phase-*.md"
      - "docs/remote-support-phase-17-transport-resilience.md"
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Staging/canary ERP base URL (https://...)"
        required: false
        type: string
      target_path:
        description: "Safe target route to watch"
        required: false
        default: "/"
        type: string
      frame_samples:
        description: "Distinct frames required by the browser scenario"
        required: false
        default: "6"
        type: string

permissions:
  contents: read

concurrency:
  group: remote-support-rollout-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol-policy-invariants:
    name: Offline protocol & policy invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"

      - name: Verify Phase 17 transport and policy invariants
        run: node scripts/verify-remote-support-phase17-invariants.mjs

  remote-support-canary:
    name: Live staging canary
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"

      - name: Require staging target
        shell: bash
        env:
          DISPATCH_BASE_URL: ${{ inputs.base_url }}
          STAGING_BASE_URL: ${{ secrets.REMOTE_SUPPORT_STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_BASE_URL:-}" ] && [ -z "${STAGING_BASE_URL:-}" ]; then
            echo "REMOTE_SUPPORT_STAGING_BASE_URL is required for scheduled runs, or provide base_url for workflow_dispatch." >&2
            exit 1
          fi

      - name: Install isolated Playwright harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/remote-support-playwright
          mkdir -p /tmp/remote-support-playwright
          cd /tmp/remote-support-playwright
          npm init -y >/dev/null
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/tests/e2e/remote-support-watch.spec.mjs" ./remote-support-watch.spec.mjs

      - name: Run two-user remote support watch scenario
        working-directory: /tmp/remote-support-playwright
        env:
          REMOTE_SUPPORT_E2E_BASE_URL: ${{ inputs.base_url || secrets.REMOTE_SUPPORT_STAGING_BASE_URL }}
          REMOTE_SUPPORT_E2E_TARGET_PATH: ${{ inputs.target_path || '/' }}
          REMOTE_SUPPORT_E2E_FRAME_SAMPLES: ${{ inputs.frame_samples || '6' }}
          REMOTE_SUPPORT_E2E_CONTROLLER_USERNAME: ${{ secrets.REMOTE_SUPPORT_E2E_CONTROLLER_USERNAME }}
          REMOTE_SUPPORT_E2E_CONTROLLER_PASSWORD: ${{ secrets.REMOTE_SUPPORT_E2E_CONTROLLER_PASSWORD }}
          REMOTE_SUPPORT_E2E_TARGET_USERNAME: ${{ secrets.REMOTE_SUPPORT_E2E_TARGET_USERNAME }}
          REMOTE_SUPPORT_E2E_TARGET_PASSWORD: ${{ secrets.REMOTE_SUPPORT_E2E_TARGET_PASSWORD }}
          REMOTE_SUPPORT_GATE_MAX_FRAME_INTERVAL_P95_MS: "1500"
          REMOTE_SUPPORT_GATE_MAX_CLIENT_TO_VIEWER_P95_MS: "1500"
          REMOTE_SUPPORT_GATE_MIN_CLICK_SUCCESS_RATE: "0.95"
        run: npx playwright test remote-support-watch.spec.mjs --reporter=line --workers=1

      - name: Enforce rollout measurement gate
        env:
          REMOTE_SUPPORT_GATE_BASE_URL: ${{ inputs.base_url || secrets.REMOTE_SUPPORT_STAGING_BASE_URL }}
          REMOTE_SUPPORT_GATE_USERNAME: ${{ secrets.REMOTE_SUPPORT_E2E_CONTROLLER_USERNAME }}
          REMOTE_SUPPORT_GATE_PASSWORD: ${{ secrets.REMOTE_SUPPORT_E2E_CONTROLLER_PASSWORD }}
          REMOTE_SUPPORT_GATE_MIN_FRAME_SAMPLES: "5"
          REMOTE_SUPPORT_GATE_MAX_FRAME_INTERVAL_P95_MS: "1500"
          REMOTE_SUPPORT_GATE_MAX_CLIENT_TO_VIEWER_P95_MS: "1500"
          REMOTE_SUPPORT_GATE_MAX_CAPTURE_P95_MS: "1500"
          REMOTE_SUPPORT_GATE_MIN_CLICK_SAMPLES: "1"
          REMOTE_SUPPORT_GATE_MIN_CLICK_SUCCESS_RATE: "0.95"
          REMOTE_SUPPORT_GATE_MIN_AUDIT_ROWS: "1"
        run: node scripts/verify-remote-support-rollout-metrics.mjs
