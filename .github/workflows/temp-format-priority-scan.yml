name: Temporary Priority Scan Formatter

on:
  push:
    branches:
      - fix/priority-scan-prettier

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/priority-scan-prettier
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format Priority Scan files
        run: |
          npx prettier --write \
            client/src/pages/factory/FactoryPriorityScan.tsx \
            tests/priority-scan-wave1.test.ts

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/factory/FactoryPriorityScan.tsx tests/priority-scan-wave1.test.ts
          git commit -m "Format Priority Scan files with Prettier"
          git push origin HEAD:fix/priority-scan-prettier
