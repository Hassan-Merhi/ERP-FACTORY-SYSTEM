name: Format ERP Tester Any Company Once

on:
  push:
    branches:
      - fix/erp-tester-any-company-20261022

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/erp-tester-any-company-20261022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format changed source and remove this workflow
        run: |
          npx prettier --write \
            server/routes/auth/userAdministrationRoutes.ts \
            client/src/pages/settings/users/InlineRoleEditor.tsx \
            shared/erpTestCompanyAccess.ts \
            server/lib/permissionHelpers.ts \
            server/auth.ts \
            client/src/pages/settings/users/PermissionSummaryCard.tsx \
            tests/erp-test-company-access.test.ts \
            server/routes/admin/userManagementRoutes.ts \
            client/src/i18n/phase3RemainingTranslations.part01.ts
          rm -f .github/workflows/format-erp-tester-any-company-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format ERP Tester role correction' || exit 0
          git push origin HEAD:fix/erp-tester-any-company-20261022
