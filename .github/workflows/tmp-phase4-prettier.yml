name: Temporary Phase 4 Prettier

on:
  push:
    branches:
      - tmp/phase4-prettier-analytics

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/phase4-prettier-analytics
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Format analytics route
        run: node node_modules/prettier/bin/prettier.cjs --write server/routes/factory/docs-users/analyticsRoutes.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/factory/docs-users/analyticsRoutes.ts
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style: apply repository prettier to analytics route"
          git push origin HEAD:tmp/phase4-prettier-analytics
