name: Backend semantic rename verification
on:
  push:
    branches: [refactor/phase-wave-semantic-names]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate modified runtime imports and query contracts
        run: |
          npm run check
          node scripts/verify-phase6-chat-report-domains.mjs
          node node_modules/vitest/vitest.mjs run tests/chat-phase1-classifier.test.ts tests/phase6-chat-report-domains.test.ts tests/inventory-valuation-wave6-repair.test.ts tests/startup-preload-manifest.test.ts
