name: Exact Main Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: exact-main-certification
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      SESSION_SECRET: exact-main-certification-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      DR_REHEARSAL_RTO_SECONDS: "300"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGSSLMODE: disable
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PORT: "5000"
    steps:
      - name: Mark certification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"phase3/exact-main-certification","description":"Exact-main certification is running"}'

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The static step scopes its formatting check to HEAD^..HEAD, so the
          # parent commit has to exist. checkout's default shallow clone has
          # only HEAD, which made `--base HEAD^` abort the whole step.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        id: install
        continue-on-error: true
        env:
          SKIP_GIT_HOOKS: "1"
        run: npm ci --no-audit --bin-links=true

      - name: Static, build, and safety contracts
        id: static
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          npm run verify:lockfile
          npm run verify:production-dependencies
          npm run format:check:changed -- --base HEAD^
          npm run lint
          npm run audit:lint-ratchet
          npm run check
          npm run build
          npm run verify:server-bundle
          npm run verify:final-production-readiness
          npm run verify:observability
          node scripts/verify-phase11-12-observability-disaster-recovery.mjs
          npm run verify:stabilization
          npm run verify:mobile-web-routing
          npm run verify:bandwidth
          node scripts/verify-program7d-accessibility-responsive.mjs

      - name: Prepare and verify disposable PostgreSQL schema
        id: schema
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/verify-migration-registry.mjs --json
          node node_modules/drizzle-kit/bin.cjs push --force
          node scripts/verify-ci-disposable-schema.mjs

          # drizzle-kit push only builds the declared schema. Tables and columns
          # created by the application's own startup migrations — passkey
          # credentials, the WhatsApp group settings columns — are absent until
          # the server boots once, and the API smoke sweep meets them as 5xx.
          # CI runs the same boot for this reason; without it the certification
          # suite measures a half-provisioned database.
          node dist/index.js > "$RUNNER_TEMP/startup-migrations.txt" 2>&1 &
          app_pid=$!
          # shellcheck disable=SC2317
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _attempt in $(seq 1 180); do
            if curl --fail --silent --show-error "http://127.0.0.1:${PORT}/api/health/db"; then
              echo
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application exited before startup migrations became ready."
              cat "$RUNNER_TEMP/startup-migrations.txt"
              exit 1
            fi
            sleep 1
          done

          echo "Timed out waiting for application startup migrations."
          cat "$RUNNER_TEMP/startup-migrations.txt"
          exit 1

      - name: Backend regression and coverage
        id: backend
        if: always() && steps.schema.outcome == 'success'
        continue-on-error: true
        run: |
          npm run test:backend:verify
          npm run test:backend:verify:coverage
          npm run test:smoke-sweep

      - name: Frontend regression and coverage
        id: frontend
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          npm run test:frontend
          npm run test:frontend:coverage

      # The phase-9 i18n baseline stays a release-only check: the script
      # inventory contract requires it to remain manual, and Release
      # Verification already runs it for every main push.
      - name: Security gates
        id: security
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          npm run check:security
          npm audit --omit=dev --audit-level=critical

      - name: Backup and restore rehearsal
        id: resilience
        if: always() && steps.schema.outcome == 'success'
        continue-on-error: true
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE exact_main_rehearsal_sentinel (id integer PRIMARY KEY, marker text NOT NULL);
          INSERT INTO exact_main_rehearsal_sentinel (id, marker) VALUES (1, 'exact-main-certification');
          SQL

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F $'\t' <<'SQL' > "$RUNNER_TEMP/exact-main-source-critical-counts.tsv"
          SELECT 'companies', COUNT(*)::bigint FROM companies
          UNION ALL SELECT 'inventory', COUNT(*)::bigint FROM inventory
          UNION ALL SELECT 'ledger_accounts', COUNT(*)::bigint FROM ledger_accounts
          UNION ALL SELECT 'voucher_entries', COUNT(*)::bigint FROM voucher_entries
          UNION ALL SELECT 'vouchers', COUNT(*)::bigint FROM vouchers
          ORDER BY 1;
          SQL

          BACKUP_FILE="$RUNNER_TEMP/exact-main.dump"
          pg_dump --format=custom --no-owner --no-acl --file="$BACKUP_FILE" "$DATABASE_URL"
          pg_restore --list "$BACKUP_FILE" > "$RUNNER_TEMP/exact-main.toc.txt"
          test -s "$RUNNER_TEMP/exact-main.toc.txt"
          node scripts/verify-database-backup.mjs "$BACKUP_FILE" --max-age-hours=1 --json

          dropdb --if-exists -h localhost -U postgres heliumdb_restore
          createdb -h localhost -U postgres heliumdb_restore
          RESTORE_URL=postgresql://postgres:postgres@localhost:5432/heliumdb_restore
          started_at=$(date +%s)
          pg_restore --exit-on-error --no-owner --no-acl --dbname="$RESTORE_URL" "$BACKUP_FILE"
          restore_seconds=$(( $(date +%s) - started_at ))
          if [ "$restore_seconds" -gt "$DR_REHEARSAL_RTO_SECONDS" ]; then
            echo "Restore took ${restore_seconds}s, exceeding the ${DR_REHEARSAL_RTO_SECONDS}s rehearsal recovery-time budget."
            exit 1
          fi

          test "$(psql "$RESTORE_URL" -Atqc "SELECT marker FROM exact_main_rehearsal_sentinel WHERE id=1")" = "exact-main-certification"
          DATABASE_URL="$RESTORE_URL" node scripts/verify-ci-disposable-schema.mjs
          psql "$RESTORE_URL" -v ON_ERROR_STOP=1 -At -F $'\t' <<'SQL' > "$RUNNER_TEMP/exact-main-restore-critical-counts.tsv"
          SELECT 'companies', COUNT(*)::bigint FROM companies
          UNION ALL SELECT 'inventory', COUNT(*)::bigint FROM inventory
          UNION ALL SELECT 'ledger_accounts', COUNT(*)::bigint FROM ledger_accounts
          UNION ALL SELECT 'voucher_entries', COUNT(*)::bigint FROM voucher_entries
          UNION ALL SELECT 'vouchers', COUNT(*)::bigint FROM vouchers
          ORDER BY 1;
          SQL
          diff -u "$RUNNER_TEMP/exact-main-source-critical-counts.tsv" "$RUNNER_TEMP/exact-main-restore-critical-counts.tsv"
          node node_modules/vitest/vitest.mjs run tests/scheduler-tick-guard.test.ts --maxWorkers=1 --no-file-parallelism

          {
            echo "## Exact-main disaster-recovery rehearsal"
            echo
            echo "- Restore duration: ${restore_seconds}s"
            echo "- Rehearsal recovery-time budget: ${DR_REHEARSAL_RTO_SECONDS}s"
            echo "- Critical-row fingerprint parity: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish authoritative certification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL: ${{ steps.install.outcome }}
          STATIC: ${{ steps.static.outcome }}
          SCHEMA: ${{ steps.schema.outcome }}
          BACKEND: ${{ steps.backend.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          SECURITY: ${{ steps.security.outcome }}
          RESILIENCE: ${{ steps.resilience.outcome }}
        run: |
          set -euo pipefail
          state=success
          for result in "$INSTALL" "$STATIC" "$SCHEMA" "$BACKEND" "$FRONTEND" "$SECURITY" "$RESILIENCE"; do
            if [ "$result" != "success" ]; then state=failure; fi
          done
          description="Exact-main certification passed"
          if [ "$state" != "success" ]; then description="Exact-main certification failed"; fi
          payload=$(printf '{"state":"%s","context":"phase3/exact-main-certification","description":"%s"}' "$state" "$description")
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
          printf 'install=%s\nstatic=%s\nschema=%s\nbackend=%s\nfrontend=%s\nsecurity=%s\nresilience=%s\n' \
            "$INSTALL" "$STATIC" "$SCHEMA" "$BACKEND" "$FRONTEND" "$SECURITY" "$RESILIENCE"
          test "$state" = "success"
