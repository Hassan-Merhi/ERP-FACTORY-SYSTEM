name: Dependency Compatibility Validation

on:
  push:
    branches:
      - fix/main-dependency-compat-20260909

permissions:
  contents: read

concurrency:
  group: dependency-compat-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Check touched file formatting
        run: node node_modules/prettier/bin/prettier.cjs --check client/src/components/ui/calendar.tsx scripts/setup-git-hooks.mjs
      - name: TypeScript
        run: npm run check
