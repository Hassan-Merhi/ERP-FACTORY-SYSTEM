# Temporary PR-only formatting job. Remove after verified.
name: Temporary FX Red Checks Prettier
on:
  push:
    branches:
      - feat/factory-agent-fx-wallets-20261019
    paths:
      - .github/workflows/fx-red-checks-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Checkout FX PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: feat/factory-agent-fx-wallets-20261019
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format reported files and verify
        shell: bash
        run: |
          set -euo pipefail
          files=(
            client/src/pages/barcodelookup/BarcodeAdminDialogs.tsx
            server/routes/factory/bales/balesCrudRoutes.ts
            client/src/pages/accounts/DisplayAccountGroups.tsx
            client/src/i18n/phase3RemainingTranslations.part28.ts
            scripts/verify-mobile-responsive-phase1-browser.mjs
          )
          node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
          node node_modules/prettier/bin/prettier.cjs --check "${files[@]}"
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(factory): fix barcode, bale and FX branch Prettier failures"
            git push origin HEAD:feat/factory-agent-fx-wallets-20261019
          fi
