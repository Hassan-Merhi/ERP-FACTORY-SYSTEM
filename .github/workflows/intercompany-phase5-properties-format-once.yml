name: Temporary Phase 5 Properties Container Formatter
on:
  push:
    branches:
      - feature/intercompany-container-trading
    paths:
      - .github/workflows/intercompany-phase5-properties-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[phase5-properties-format-once]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intercompany-container-trading
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned formatting dependencies
        run: npm ci --ignore-scripts --no-audit --bin-links=true
      - name: Format Phase 5 source only
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/intercompany/phase5ReceivingAccess.ts \
            server/services/intercompany/phase5Receipt.ts \
            server/routes/import/intercompany-phase5.ts \
            server/routes/import/intercompany-phase3.ts \
            client/src/pages/intercompany/IntercompanyLifecycle.tsx \
            client/src/pages/intercompany/LinkedTradesEditor.tsx \
            client/src/pages/containerdetail/components/ContainerDetailErpView.tsx \
            client/src/pages/containerdetail/PropertiesIntercompanyContainerWorkflow.tsx \
            client/src/i18n/propertiesContainerIntercompanyTranslations.ts \
            tests/intercompany-phase5-properties-container-integration.test.ts
      - name: Commit formatting to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/intercompany/phase5ReceivingAccess.ts server/services/intercompany/phase5Receipt.ts server/routes/import/intercompany-phase5.ts server/routes/import/intercompany-phase3.ts client/src/pages/intercompany/IntercompanyLifecycle.tsx client/src/pages/intercompany/LinkedTradesEditor.tsx client/src/pages/containerdetail/components/ContainerDetailErpView.tsx client/src/pages/containerdetail/PropertiesIntercompanyContainerWorkflow.tsx client/src/i18n/propertiesContainerIntercompanyTranslations.ts tests/intercompany-phase5-properties-container-integration.test.ts
          if git diff --cached --quiet; then
            echo "All Phase 5 files already formatted"
          else
            git commit -m "style(intercompany): format Properties container lifecycle"
            git push origin HEAD:feature/intercompany-container-trading
          fi
