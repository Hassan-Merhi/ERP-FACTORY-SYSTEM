name: GitHub Actions Quality

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: actions-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint -version

      - name: Select workflow files
        id: workflow-files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only --diff-filter=ACMR "$PR_BASE_SHA" "$HEAD_SHA" -- \
              '.github/workflows/*.yml' '.github/workflows/*.yaml' > /tmp/actionlint-files.txt
          else
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
              -print | sort > /tmp/actionlint-files.txt
          fi
          if [[ -s /tmp/actionlint-files.txt ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            cat /tmp/actionlint-files.txt
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No changed workflow files to lint."
          fi

      - name: Lint changed workflows
        if: steps.workflow-files.outputs.has_files == 'true'
        shell: bash
        run: xargs -r ./actionlint -color < /tmp/actionlint-files.txt

  zizmor:
    name: zizmor
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit GitHub Actions security
        # v0.6.4 — the pinned action ships the digest list of supported zizmor
        # releases, so it has to move together with `version` below.
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
        with:
          inputs: .github
          version: "1.30.1"
          persona: regular
          min-severity: low
          min-confidence: medium
          online-audits: true


  prettier-diagnostic:
    name: Prettier diagnostic
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Show exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            server/routes/stats/statsNetProfitRoutes.ts
            tests/employee-net-position-helper.test.ts
          )
          for target in "${targets[@]}"; do
            cp "$target" "/tmp/$(basename "$target").before"
          done
          node node_modules/prettier/bin/prettier.cjs --write "${targets[@]}"
          for target in "${targets[@]}"; do
            echo "__PRETTIER_DIFF_START__ $target"
            diff -u "/tmp/$(basename "$target").before" "$target" || true
            echo "__PRETTIER_DIFF_END__ $target"
          done
