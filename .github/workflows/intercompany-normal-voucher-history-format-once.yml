name: Temporary Intercompany Voucher History Formatter
on:
  push:
    branches:
      - feature/intercompany-container-trading
    paths:
      - .github/workflows/intercompany-normal-voucher-history-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[history-format-once]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intercompany-container-trading
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --bin-links=true
      - name: Format history, vouchers and updated tests
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/vouchers/IntercompanyVoucherHistory.tsx \
            client/src/pages/vouchers/useNormalIntercompanyVoucher.tsx \
            tests/intercompany-normal-voucher-auto-mirror.test.ts \
            tests/intercompany-phase6-voucher-payments.test.ts
      - name: Commit formatting only to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/vouchers/IntercompanyVoucherHistory.tsx client/src/pages/vouchers/useNormalIntercompanyVoucher.tsx tests/intercompany-normal-voucher-auto-mirror.test.ts tests/intercompany-phase6-voucher-payments.test.ts
          if git diff --cached --quiet; then echo "Already formatted"; else git commit -m "style(intercompany): format linked voucher history and reversal"; git push origin HEAD:feature/intercompany-container-trading; fi
