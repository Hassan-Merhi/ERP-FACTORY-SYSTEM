name: Retail Format Preview
on:
  push:
    branches:
      - feature/retail-fashion-variants-wave1
permissions:
  contents: read
concurrency:
  group: retail-format-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Format changed Wave 1 files and print diff
        run: |
          node node_modules/prettier/bin/prettier.cjs --write             client/src/pages/retail/RetailInventory.tsx             client/src/pages/retail/RetailProductEditor.tsx             server/routes/retailRoutes.ts             tests/retail-fashion-variants-wave1.test.ts
          git diff --             client/src/pages/retail/RetailInventory.tsx             client/src/pages/retail/RetailProductEditor.tsx             server/routes/retailRoutes.ts             tests/retail-fashion-variants-wave1.test.ts
