name: Phase 33 one-shot autofix

on:
  push:
    branches:
      - test/phase33-final-80-80-80-70-closure
    paths:
      - .github/workflows/phase33-one-shot-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 33 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: test/phase33-final-80-80-80-70-closure
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Apply exact TypeScript and i18n fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("server/routes/admin/accountMigrationSafeRoutes.ts")
          source = path.read_text()

          old = '''  if (item.version === 1) return item as SavedMigrationV1;
          if (!Array.isArray(item.splitVouchers)) return null;
          return item as SavedMigrationV2;'''
          new = '''  if (item.version === 1) return item as SavedMigrationV1;
          const v2 = item as Partial<SavedMigrationV2>;
          if (!Array.isArray(v2.splitVouchers)) return null;
          return v2 as SavedMigrationV2;'''
          if old not in source:
              raise SystemExit("savedMigration target not found")
          source = source.replace(old, new, 1)

          old_description = '''                  description: `Account migration from ${sourceCompany.name}: ${sourceVoucher.description || sourceVoucher.voucherNumber}`,'''
          new_description = '''                  description: /* data-business-value */ `Account migration from ${sourceCompany.name}: ${sourceVoucher.description || sourceVoucher.voucherNumber}`,'''
          if old_description not in source:
              raise SystemExit("migration description target not found")
          source = source.replace(old_description, new_description, 1)
          path.write_text(source)
          PY

      - name: Format exact failing files
        run: >-
          node node_modules/prettier/bin/prettier.cjs --write
          client/src/pages/payroll/WorkersTab.tsx
          server/routes/admin/accountMigrationSafeRoutes.ts
          tests/api-parameterized-write-error-sweep.test.ts
          tests/phase33-chat-prompt-behavior.test.ts

      - name: Verify type-check and formatting
        run: |
          npm run check
          node node_modules/prettier/bin/prettier.cjs --check \
            client/src/pages/payroll/WorkersTab.tsx \
            server/routes/admin/accountMigrationSafeRoutes.ts \
            tests/api-parameterized-write-error-sweep.test.ts \
            tests/phase33-chat-prompt-behavior.test.ts
          node scripts/audit-i18n-phase14.mjs

      - name: Commit branch fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No autofix changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/pages/payroll/WorkersTab.tsx \
            server/routes/admin/accountMigrationSafeRoutes.ts \
            tests/api-parameterized-write-error-sweep.test.ts \
            tests/phase33-chat-prompt-behavior.test.ts
          git commit -m "fix: clear Phase 33 type format and i18n gates"
          git push origin HEAD:test/phase33-final-80-80-80-70-closure
