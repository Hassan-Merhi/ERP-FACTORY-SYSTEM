name: Temporary format finalized sale return import
on:
  push:
    branches:
      - feature/finalized-sale-return-excel-reference-import
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format changed source and tests
        run: |
          node node_modules/prettier/bin/prettier.cjs --write             client/src/pages/factory/FinalizedSaleReturnImport.tsx             client/src/pages/factory/FactoryFinalizedSaleReturns.tsx             client/src/pages/factory/finalizedSaleReturnImportFile.ts             client/src/i18n/factoryFinalizedSaleReturnTranslations.ts             server/routes/factory/customer-orders/bale-scanning/finalized-return-import-preview.ts             server/routes/factory/customer-orders/bale-scanning/finalized-returns.ts             tests/factory-finalized-return-import-preview.test.ts             tests/factory-finalized-return-excel-parser.test.ts
      - name: Push Prettier corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/factory/FinalizedSaleReturnImport.tsx client/src/pages/factory/FactoryFinalizedSaleReturns.tsx client/src/pages/factory/finalizedSaleReturnImportFile.ts client/src/i18n/factoryFinalizedSaleReturnTranslations.ts server/routes/factory/customer-orders/bale-scanning/finalized-return-import-preview.ts server/routes/factory/customer-orders/bale-scanning/finalized-returns.ts tests/factory-finalized-return-import-preview.test.ts tests/factory-finalized-return-excel-parser.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: prettier formatting for finalized-sale return import"
          git push origin HEAD:feature/finalized-sale-return-excel-reference-import
