name: Semgrep

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regression-scan:
    name: Semgrep CE new-findings gate
    if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    env:
      SEMGREP_BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate baseline commit
        shell: sh
        run: |
          case "$SEMGREP_BASELINE_COMMIT" in
            ""|0000000000000000000000000000000000000000)
              echo "A usable baseline commit is required for the Semgrep regression gate."
              exit 2
              ;;
          esac
          if ! printf '%s' "$SEMGREP_BASELINE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Semgrep baseline is not a 40-character commit SHA."
            exit 2
          fi
          git config --global --add safe.directory "$PWD"
          git cat-file -e "${SEMGREP_BASELINE_COMMIT}^{commit}"
          git merge-base "$SEMGREP_BASELINE_COMMIT" HEAD >/dev/null

      - name: Scan for newly introduced findings
        run: semgrep scan --config auto --baseline-commit "$SEMGREP_BASELINE_COMMIT" --error

  full-audit:
    name: Semgrep CE full repository audit
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit complete repository
        run: semgrep scan --config auto
