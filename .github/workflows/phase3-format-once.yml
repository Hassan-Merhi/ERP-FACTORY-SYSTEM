name: Phase 3 Format Once

on:
  push:
    branches:
      - test/backend-coverage-phase2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/backend-coverage-phase2
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Format Phase 3 files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/chat/reports/implementations/reportImplementationRegistry.ts \
            server/chat/reports/implementations/schemaCompatibleReportOverrides.ts \
            tests/backend-coverage-phase3-report-workflows.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/chat/reports/implementations/reportImplementationRegistry.ts \
            server/chat/reports/implementations/schemaCompatibleReportOverrides.ts \
            tests/backend-coverage-phase3-report-workflows.test.ts
          git commit -m "style: format Phase 3 coverage files"
          git push origin HEAD:test/backend-coverage-phase2
