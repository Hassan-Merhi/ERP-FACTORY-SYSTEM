name: Retail Wave 2 I18n Fix

on:
  push:
    branches:
      - feat/retail-pos-stock-movement-wave2

permissions:
  contents: write

jobs:
  i18n-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/retail-pos-stock-movement-wave2
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Normalize registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Register Retail Wave 2 translations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"target not found in {path}: {old!r}")
              p.write_text(s.replace(old, new, 1))

          translator = "client/src/components/ApplicationInterfaceTranslator.tsx"
          replace_once(
              translator,
              'import { isRetailWave1Text, translateRetailWave1Text } from "@/i18n/retailWave1Translations";\n',
              'import { isRetailWave1Text, translateRetailWave1Text } from "@/i18n/retailWave1Translations";\nimport { isRetailWave2Text, translateRetailWave2Text } from "@/i18n/retailWave2Translations";\n',
          )
          replace_once(
              translator,
              '    isPosItemReplacementText(value) ||\n    isRetailWave1Text(value)\n',
              '    isPosItemReplacementText(value) ||\n    isRetailWave1Text(value) ||\n    isRetailWave2Text(value)\n',
          )
          replace_once(
              translator,
              '    translateRetailWave1Text(value, language) ??\n    translateTabsFiltersText(value, language) ??\n',
              '    translateRetailWave1Text(value, language) ??\n    translateRetailWave2Text(value, language) ??\n    translateTabsFiltersText(value, language) ??\n',
          )

          audit = "scripts/audit-i18n-phase14.mjs"
          replace_once(
              audit,
              '  "client/src/i18n/retailWave1Translations.ts",\n',
              '  "client/src/i18n/retailWave1Translations.ts",\n  "client/src/i18n/retailWave2Translations.ts",\n',
          )
          PY

      - name: Format translation wiring
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/i18n/retailWave2Translations.ts \
            client/src/components/ApplicationInterfaceTranslator.tsx \
            scripts/audit-i18n-phase14.mjs

      - name: Run classified i18n audit
        run: node scripts/audit-i18n-phase14.mjs

      - name: Typecheck
        run: npm run check

      - name: Commit i18n fix
        run: |
          git checkout -- package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/i18n/retailWave2Translations.ts client/src/components/ApplicationInterfaceTranslator.tsx scripts/audit-i18n-phase14.mjs
          if git diff --cached --quiet; then
            echo "No translation wiring changes needed"
          else
            git commit -m "Complete Retail Wave 2 translations"
            git push origin HEAD:feat/retail-pos-stock-movement-wave2
          fi
