name: Phase 1 Maintenance

on:
  push:
    branches: [test/backend-coverage-phase1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format Phase 1 and inherited failure-mode tests
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            "tests/backend-coverage-*.test.ts" \
            tests/backendTestSetup.mjs \
            "tests/failure-mode-*.test.ts"
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/backend-coverage-*.test.ts tests/backendTestSetup.mjs tests/failure-mode-*.test.ts
          git commit -m "style: format Phase 1 and inherited coverage tests"
          git push
