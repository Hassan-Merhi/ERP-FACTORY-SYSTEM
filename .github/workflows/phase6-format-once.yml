# One-time Phase 6 formatter; this workflow deletes itself in its formatting commit.
name: Phase 6 One-Time Prettier
on:
  push:
    branches:
      - feature/unified-search-phase1-20261120
    paths:
      - .github/workflows/phase6-format-once.yml

permissions:
  contents: write

concurrency:
  group: phase6-prettier-unified-search
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'Hassan-Merhi/ERP-FACTORY-SYSTEM' && github.ref == 'refs/heads/feature/unified-search-phase1-20261120'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout target branch with merge-base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/unified-search-phase1-20261120
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm

      - name: Format and verify changed source files against merge-base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base_sha="$(git merge-base origin/main HEAD)"
          if [ -z "$base_sha" ]; then
            echo "::error::Unable to identify the merge base; refusing to format."
            exit 1
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- client/src server shared tests scripts | grep -E '\.(ts|tsx|css|mjs)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No changed source files were identified; refusing to commit."
            exit 1
          fi
          printf 'Formatting %s changed source files (merge-base %s).\n' "${#files[@]}" "$base_sha"
          npm ci --ignore-scripts --no-audit --bin-links=true
          node node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
          node node_modules/prettier/bin/prettier.cjs --check "${files[@]}"
          rm .github/workflows/phase6-format-once.yml
          git add -- "${files[@]}" .github/workflows/phase6-format-once.yml
          if git diff --cached --quiet; then
            echo "::error::No formatting/self-removal changes staged; refusing to push."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(phase6): format all changed sources with locked Prettier"
          git push origin HEAD:refs/heads/feature/unified-search-phase1-20261120
