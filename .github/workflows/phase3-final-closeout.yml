name: Phase 3 Final Closeout

on:
  push:
    branches:
      - phase3/reconciliation-accounting-audit

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase3/reconciliation-accounting-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install supported TypeScript API compatibility package
        run: npm install --save-dev --save-exact typescript@npm:@typescript/typescript6@6.0.3

      - name: Format changed source inherited by the PR merge base
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/factory/FactoryProductionTargets.tsx \
            client/src/pages/factory/FactoryStaffTracking.tsx \
            client/src/pages/factory/factorycontainerloadingscan/useFactoryContainerLoadingScanModel.ts \
            server/routes/factory-reports/whatsapp.ts \
            shared/realtimeInvalidation.ts \
            tests/factory-partial-offload-cost-consistency.test.ts \
            tests/reusable-proforma-new-loading-lifecycle.test.ts

      - name: Verify lint and type-escape audit
        run: |
          npm run lint
          npm run audit:type-escapes

      - name: Print current i18n actionable findings
        run: |
          node scripts/audit-i18n-phase14.mjs --no-enforce --json-out /tmp/i18n.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/i18n.json','utf8'));
          for (const f of r.findings.filter(x => x.status === 'actionable')) {
            console.log(JSON.stringify({module:f.module,file:f.file,line:f.line,kind:f.kind,text:f.text}));
          }
          NODE

      - name: Commit closeout fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json \
            client/src/pages/factory/FactoryProductionTargets.tsx \
            client/src/pages/factory/FactoryStaffTracking.tsx \
            client/src/pages/factory/factorycontainerloadingscan/useFactoryContainerLoadingScanModel.ts \
            server/routes/factory-reports/whatsapp.ts \
            shared/realtimeInvalidation.ts \
            tests/factory-partial-offload-cost-consistency.test.ts \
            tests/reusable-proforma-new-loading-lifecycle.test.ts
          if git diff --cached --quiet; then
            echo "No closeout changes required"
          else
            git commit -m "Restore lint toolchain and formatting gates"
            git push origin HEAD:phase3/reconciliation-accounting-audit
          fi
