name: Temporary Account Migration Format
on:
  push:
    branches:
      - fix/account-migration-properties-403-20261026
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/account-migration-properties-403-20261026
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format affected files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/AccountMigration.tsx \
            server/routes/admin/accountMigrationSafeRoutes.ts \
            tests/account-migration-source-picker.test.ts \
            tests/phase33e-tenant-isolation-boundary.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/AccountMigration.tsx server/routes/admin/accountMigrationSafeRoutes.ts tests/account-migration-source-picker.test.ts tests/phase33e-tenant-isolation-boundary.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format account migration changed files"
            git push origin HEAD:fix/account-migration-properties-403-20261026
          fi
