name: Temporary Universal Excel Phase 10 Main Sync

on:
  push:
    branches:
      - feature/universal-excel-export-system

permissions:
  contents: write

concurrency:
  group: universal-excel-phase10-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: "!startsWith(github.event.head_commit.message, 'chore(excel): sync current main')"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/universal-excel-export-system
          persist-credentials: true
          fetch-depth: 0
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge current main into feature only (fail closed on conflicts)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Feature already contains current main"
            exit 0
          fi
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [ "$status" != 0 ]; then
            # Manual 3-way review confirmed these two conflicts differ ONLY
            # in Excel formula-injection escaping. Current main is safer:
            # it strips leading Unicode whitespace and control characters.
            # Preserve that security fix, while keeping the feature branch's
            # universal export changes in every other file.
            expected="$(printf '%s\\n' \\
              client/src/pages/factory/erpSupplierReturnMatchWorkbook.ts \\
              client/src/pages/factory/finalizedSaleReturnMatchWorkbook.ts)"
            actual="$(git diff --name-only --diff-filter=U)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Unexpected merge conflict; branch unchanged"
              printf '%s\\n' "$actual"
              exit 1
            fi
            git checkout --theirs -- \\
              client/src/pages/factory/erpSupplierReturnMatchWorkbook.ts \\
              client/src/pages/factory/finalizedSaleReturnMatchWorkbook.ts
            git add -- \\
              client/src/pages/factory/erpSupplierReturnMatchWorkbook.ts \\
              client/src/pages/factory/finalizedSaleReturnMatchWorkbook.ts
            echo "Resolved the two reviewed formula-safety conflicts using current main"
          fi
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::Conflicts remain; refusing to update branch"
            exit 1
          fi
          git diff --check
          git commit -m "chore(excel): sync current main into Phase 10 branch"
          # Reject if another writer updated the feature branch mid-run.
          git push origin HEAD:feature/universal-excel-export-system
