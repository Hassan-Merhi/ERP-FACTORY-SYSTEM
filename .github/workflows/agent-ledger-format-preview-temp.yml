name: Temporary Agent Ledger Prettier Preview
on:
  push:
    branches:
      - fix/factory-agent-ledger-company-scope-20261009
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print Prettier patch for changed routes
        run: |
          node node_modules/prettier/bin/prettier.cjs --write server/routes/accountStatementRoutes.ts server/routes/admin/import-export/accounts.ts
          echo '<<<BEGIN_AGENT_LEDGER_FORMAT_PATCH>>>'
          git diff --no-ext-diff --unified=3 -- server/routes/accountStatementRoutes.ts server/routes/admin/import-export/accounts.ts
          echo '<<<END_AGENT_LEDGER_FORMAT_PATCH>>>'
