# Temporary feature-branch-only formatter; removed before merging.
name: Finalized Sale Return Match One-Time Format
on:
  push:
    branches:
      - feature/finalized-sale-return-customer-match-export
permissions:
  contents: write
jobs:
  format-feature:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/finalized-sale-return-customer-match-export
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
      - name: Normalize package registry
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format changed Supplier Return source
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/factory/FinalizedSaleReturnImport.tsx \
            client/src/pages/factory/finalizedSaleReturnMatchWorkbook.ts \
            client/src/pages/factory/finalizedSaleReturnMatchWorkbook.test.ts \
            client/src/i18n/factoryFinalizedSaleReturnTranslations.ts \
            server/routes/factory/customer-orders/bale-scanning/finalized-return-import-preview.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/factory/FinalizedSaleReturnImport.tsx client/src/pages/factory/finalizedSaleReturnMatchWorkbook.ts client/src/pages/factory/finalizedSaleReturnMatchWorkbook.test.ts client/src/i18n/factoryFinalizedSaleReturnTranslations.ts server/routes/factory/customer-orders/bale-scanning/finalized-return-import-preview.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format customer-scoped sale return Excel matching"
            git push origin HEAD:feature/finalized-sale-return-customer-match-export
          fi
