name: Performance & Database Safety

on:
  pull_request:
    paths:
      - "server/**"
      - "scripts/**"
      - "render.yaml"
      - "docs/program-6d-query-classifications.json"
      - "docs/program-6d-phase10-current-review.json"
      - "docs/archive/program-6d-database-query-optimization.md"
      - ".github/workflows/performance-database-safety.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "scripts/**"
      - "render.yaml"
      - "docs/program-6d-query-classifications.json"
      - "docs/program-6d-phase10-current-review.json"
      - "docs/archive/program-6d-database-query-optimization.md"
      - ".github/workflows/performance-database-safety.yml"

permissions:
  contents: read

jobs:
  query-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download repository source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" |
            tar --extract --gzip --strip-components=1

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"

      - name: Materialize reviewed Phase 10 evidence
        run: |
          node scripts/materialize-program6d-phase10-review.mjs \
            --manifest=docs/program-6d-phase10-current-review.json \
            --output=tmp/phase10-current-query-classifications.json

      - name: Strict query-risk classification gate
        id: query_review
        continue-on-error: true
        run: |
          node scripts/run-program6d-query-review.mjs \
            --report=tmp/performance-database-query-report.json \
            --classifications=tmp/phase10-current-query-classifications.json \
            --strict

      - name: Query-safety invariants
        id: query_safety
        if: always()
        continue-on-error: true
        run: node scripts/verify-program6d-query-safety.mjs

      - name: Resource-control invariants
        id: resource_controls
        if: always()
        continue-on-error: true
        run: node scripts/verify-program6f-export-resource-controls.mjs

      - name: Phase 2 scheduler-residency invariants
        id: scheduler_residency
        if: always()
        continue-on-error: true
        run: node scripts/verify-render-phase2-lazy-schedulers.mjs

      - name: Phase 3 route-residency invariants
        id: route_residency
        if: always()
        continue-on-error: true
        run: node scripts/verify-render-phase3-lazy-routes.mjs

      - name: Phase 4 operational-route residency invariants
        id: operational_route_residency
        if: always()
        continue-on-error: true
        run: node scripts/verify-render-phase4-operational-routes.mjs

      - name: Upload query-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-database-audit-${{ github.sha }}
          path: |
            tmp/performance-database-query-report.json
            tmp/phase10-current-query-classifications.json
            docs/program-6d-phase10-current-review.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce performance/database gate
        if: always()
        env:
          QUERY_REVIEW_OUTCOME: ${{ steps.query_review.outcome }}
          QUERY_SAFETY_OUTCOME: ${{ steps.query_safety.outcome }}
          RESOURCE_CONTROLS_OUTCOME: ${{ steps.resource_controls.outcome }}
          SCHEDULER_RESIDENCY_OUTCOME: ${{ steps.scheduler_residency.outcome }}
          ROUTE_RESIDENCY_OUTCOME: ${{ steps.route_residency.outcome }}
          OPERATIONAL_ROUTE_RESIDENCY_OUTCOME: ${{ steps.operational_route_residency.outcome }}
        run: |
          if [ "$QUERY_REVIEW_OUTCOME" != "success" ] || [ "$QUERY_SAFETY_OUTCOME" != "success" ] || [ "$RESOURCE_CONTROLS_OUTCOME" != "success" ] || [ "$SCHEDULER_RESIDENCY_OUTCOME" != "success" ] || [ "$ROUTE_RESIDENCY_OUTCOME" != "success" ] || [ "$OPERATIONAL_ROUTE_RESIDENCY_OUTCOME" != "success" ]; then
            echo "Performance/database safety gate failed."
            exit 1
          fi
