name: Raw SQL Inventory
on:
  push:
    branches:
      - security/raw-sql-allowlist-audit
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install scanner dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Generate raw SQL source inventory
        run: |
          node scripts/verify-raw-sql-allowlist.mjs --inventory > raw-sql-inventory.json
          node -e 'const r=require("./raw-sql-inventory.json");const kinds={};for(const f of r.findings)kinds[f.kind]=(kinds[f.kind]||0)+1; console.log(JSON.stringify({scannedFiles:r.scannedFiles,found:r.found,byKind:kinds}))'
      - uses: actions/upload-artifact@v4
        with:
          name: raw-sql-inventory
          path: raw-sql-inventory.json
          if-no-files-found: error
