name: Temporary Normal Voucher Auto-Mirror Formatter
on:
  push:
    branches:
      - feature/intercompany-container-trading
    paths:
      - .github/workflows/intercompany-normal-voucher-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[normal-voucher-format-once]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intercompany-container-trading
          persist-credentials: true
      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install formatting dependencies
        run: npm ci --ignore-scripts --no-audit --bin-links=true
      - name: Format only normal voucher auto-mirror changes
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/services/intercompany/normalVoucherMatching.ts \
            server/routes/vouchers/normalIntercompanyVoucherRoutes.ts \
            server/routes/voucherRoutes.ts \
            client/src/pages/vouchers/useNormalIntercompanyVoucher.tsx \
            client/src/pages/vouchers/useVoucherSaveMutation.ts \
            client/src/pages/vouchers/voucherSidebarGroups.ts \
            client/src/pages/Vouchers.tsx \
            client/src/pages/intercompany/intercompanyLegacyNavigation.ts \
            client/src/properties/config/propertiesNavigation.ts \
            client/src/i18n/intercompanyVoucherTranslations.ts \
            tests/intercompany-normal-voucher-auto-mirror.test.ts \
            tests/intercompany-phase6-voucher-payments.test.ts \
            tests/intercompany-phase7-navigation.test.ts
      - name: Commit formatted files to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/intercompany/normalVoucherMatching.ts server/routes/vouchers/normalIntercompanyVoucherRoutes.ts server/routes/voucherRoutes.ts client/src/pages/vouchers/useNormalIntercompanyVoucher.tsx client/src/pages/vouchers/useVoucherSaveMutation.ts client/src/pages/vouchers/voucherSidebarGroups.ts client/src/pages/Vouchers.tsx client/src/pages/intercompany/intercompanyLegacyNavigation.ts client/src/properties/config/propertiesNavigation.ts client/src/i18n/intercompanyVoucherTranslations.ts tests/intercompany-normal-voucher-auto-mirror.test.ts tests/intercompany-phase6-voucher-payments.test.ts tests/intercompany-phase7-navigation.test.ts
          if git diff --cached --quiet; then
            echo "Auto-mirror files already formatted"
          else
            git commit -m "style(intercompany): format normal voucher auto-mirror"
            git push origin HEAD:feature/intercompany-container-trading
          fi
