name: Main Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-certification
  cancel-in-progress: true

jobs:
  # Main Certification used to run every gate one after another in a single
  # 180-minute job, including the whole backend suite twice (a plain pass and
  # then a coverage pass of the same tests). The gates now run as parallel
  # jobs: the backend suite once, under coverage, across eight shards that each
  # own a PostgreSQL service (files stay serial within a shard, shards share
  # nothing), and the coverage floors are enforced on the merged map. Target
  # wall clock is 10-20 minutes. "certify" keeps the old job's name and
  # aggregates every component, and "publish" is unchanged.
  verify:
    name: Verify exact main SHA
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact merged main SHA
        id: exact_sha
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Checkout SHA ${checked_out_sha} does not match workflow SHA ${GITHUB_SHA}."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Main Certification only accepts pushes to refs/heads/main; got ${GITHUB_REF}."
              exit 1
            fi
            if [[ "$PUSH_AFTER_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::Push after SHA ${PUSH_AFTER_SHA} does not match workflow SHA ${GITHUB_SHA}."
              exit 1
            fi
          else
            authoritative_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$authoritative_main_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Manual certification must target current main ${authoritative_main_sha}; got ${GITHUB_SHA}."
              exit 1
            fi
          fi

          echo "Exact merged main SHA verified: ${GITHUB_SHA}"

      - name: Mark certification pending
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state='pending' \
            -f context='Main Certification' \
            -f description='Main certification is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  static:
    name: Static and build checks
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_ENV: test
      SESSION_SECRET: main-certification-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGSSLMODE: disable
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PORT: "5000"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changed-file format check compares the merged commit to its
          # first parent, so retain both commits while keeping checkout shallow.
          fetch-depth: 2
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        env:
          SKIP_GIT_HOOKS: "1"
        run: npm ci --no-audit --bin-links=true
      - name: Static and build checks
        id: static
        run: |
          set -euo pipefail
          npm run verify:lockfile
          npm run verify:production-dependencies
          npm run format:check:changed -- --base HEAD^
          npm run lint
          npm run audit:lint-ratchet
          npm run check
          npm run build
      - name: Verify server bundle
        if: always() && steps.static.outcome == 'success'
        run: npm run verify:server-bundle
      - name: Verify production readiness
        if: always()
        run: npm run verify:final-production-readiness
      - name: Verify observability and stabilization
        if: always()
        run: |
          set -euo pipefail
          npm run verify:observability
          node scripts/verify-observability-disaster-recovery.mjs
          npm run verify:stabilization
      - name: Verify bandwidth and mobile-routing contracts
        if: always()
        run: |
          set -euo pipefail
          npm run verify:mobile-web-routing
          npm run verify:bandwidth
          npm run verify:performance-wave5
          node scripts/verify-program7d-accessibility-responsive.mjs

  backend:
    # Raise the shard count here and BACKEND_TEST_SHARDS in backend-coverage
    # together as the suite grows; a shard took 7-9 minutes at ~1,500 files.
    name: Backend verification (${{ matrix.shard }}/8)
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      SESSION_SECRET: main-certification-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGSSLMODE: disable
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PORT: "5000"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        env:
          SKIP_GIT_HOOKS: "1"
        run: npm ci --no-audit --bin-links=true
      - name: Build
        run: npm run build
      - name: Build PostgreSQL schema from migrations and boot
        run: |
          set -euo pipefail
          npm run audit:runtime-ddl
          MIGRATION_CONFIRMATION=APPLY_SCHEMA_MIGRATIONS node scripts/db/migrate.mjs apply
          node scripts/db/migrate.mjs verify

          # The migrations own the whole schema. Boot the compiled server through
          # the production preload (read-only schema gate) and prove the database
          # health endpoint becomes ready.
          node --import ./server/startupPreload.mjs dist/index.js > "$RUNNER_TEMP/startup-migrations.txt" 2>&1 &
          app_pid=$!
          # shellcheck disable=SC2317,SC2329  # reached through the EXIT trap below
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _attempt in $(seq 1 180); do
            if curl --fail --silent --show-error "http://127.0.0.1:${PORT}/api/health/db" > "$RUNNER_TEMP/health-db.json"; then
              cat "$RUNNER_TEMP/health-db.json"
              echo
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application exited before becoming ready."
              cat "$RUNNER_TEMP/startup-migrations.txt"
              exit 1
            fi
            sleep 1
          done

          echo "Timed out waiting for the application to become ready."
          cat "$RUNNER_TEMP/startup-migrations.txt"
          exit 1

      - name: Backend tests and shard coverage
        env:
          BACKEND_COVERAGE_SHARD: "1"
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          npm run test:backend:coverage -- "--shard=${SHARD}/8"
      - name: Upload backend shard coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: main-backend-coverage-shard-${{ matrix.shard }}
          path: coverage/backend/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  backend-coverage:
    name: Backend coverage floors
    needs: backend
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        env:
          SKIP_GIT_HOOKS: "1"
        run: npm ci --no-audit --bin-links=true
      - name: Download shard coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: main-backend-coverage-shard-*
          path: coverage/shard-artifacts
      - name: Merge shard coverage and enforce backend floors
        env:
          BACKEND_TEST_SHARDS: "8"
        run: |
          set -euo pipefail
          # run-backend-verification.mjs reads coverage/backend-shards/shard-<0-based>/.
          for shard in $(seq 1 "$BACKEND_TEST_SHARDS"); do
            source_file="coverage/shard-artifacts/main-backend-coverage-shard-${shard}/coverage-final.json"
            if [[ ! -s "$source_file" ]]; then echo "::error::Missing coverage for backend shard ${shard}"; exit 1; fi
            mkdir -p "coverage/backend-shards/shard-$((shard - 1))"
            cp "$source_file" "coverage/backend-shards/shard-$((shard - 1))/coverage-final.json"
          done
          node scripts/run-backend-verification.mjs --merge-only

  smoke:
    name: API smoke sweep
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      SESSION_SECRET: main-certification-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGSSLMODE: disable
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PORT: "5000"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        env:
          SKIP_GIT_HOOKS: "1"
        run: npm ci --no-audit --bin-links=true
      - name: Build
        run: npm run build
      - name: Build PostgreSQL schema from migrations and boot
        run: |
          set -euo pipefail
          npm run audit:runtime-ddl
          MIGRATION_CONFIRMATION=APPLY_SCHEMA_MIGRATIONS node scripts/db/migrate.mjs apply
          node scripts/db/migrate.mjs verify

          # The migrations own the whole schema. Boot the compiled server through
          # the production preload (read-only schema gate) and prove the database
          # health endpoint becomes ready.
          node --import ./server/startupPreload.mjs dist/index.js > "$RUNNER_TEMP/startup-migrations.txt" 2>&1 &
          app_pid=$!
          # shellcheck disable=SC2317,SC2329  # reached through the EXIT trap below
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _attempt in $(seq 1 180); do
            if curl --fail --silent --show-error "http://127.0.0.1:${PORT}/api/health/db" > "$RUNNER_TEMP/health-db.json"; then
              cat "$RUNNER_TEMP/health-db.json"
              echo
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application exited before becoming ready."
              cat "$RUNNER_TEMP/startup-migrations.txt"
              exit 1
            fi
            sleep 1
          done

          echo "Timed out waiting for the application to become ready."
          cat "$RUNNER_TEMP/startup-migrations.txt"
          exit 1

      - name: API smoke sweep
        run: npm run test:smoke-sweep

  frontend:
    name: Frontend verification and coverage
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_ENV: test
      SESSION_SECRET: main-certification-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGSSLMODE: disable
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PORT: "5000"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
      - name: Normalize package registry URLs
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - name: Install dependencies
        env:
          SKIP_GIT_HOOKS: "1"
        run: npm ci --no-audit --bin-links=true
      # The coverage run executes the full frontend suite; a separate plain
      # pass would only repeat the same tests.
      - name: Frontend tests and coverage floors
        run: npm run test:frontend:coverage

  certify:
    name: Application Certification
    needs: [verify, static, backend, backend-coverage, smoke, frontend]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Evaluate certification components
        env:
          VERIFY: ${{ needs.verify.result }}
          STATIC: ${{ needs.static.result }}
          BACKEND: ${{ needs.backend.result }}
          BACKEND_COVERAGE: ${{ needs.backend-coverage.result }}
          SMOKE: ${{ needs.smoke.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail

          failed_checks=()
          check_result() {
            local label="$1"
            local result="$2"
            printf '%s=%s\n' "$label" "$result"
            if [[ "$result" != 'success' ]]; then
              failed_checks+=("${label}:${result}")
            fi
          }

          check_result verify "$VERIFY"
          check_result static "$STATIC"
          check_result backend "$BACKEND"
          check_result backend_coverage "$BACKEND_COVERAGE"
          check_result smoke "$SMOKE"
          check_result frontend "$FRONTEND"

          {
            echo '## Main Certification application suite'
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            if [[ "${#failed_checks[@]}" -eq 0 ]]; then
              echo '- Result: **success**'
            else
              echo '- Result: **failure**'
              echo "- Failed components: \`${failed_checks[*]}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${#failed_checks[@]}" -ne 0 ]]; then
            echo "::error::Main Certification failed components: ${failed_checks[*]}"
            exit 1
          fi

          echo 'All Main Certification application components passed.'

  publish:
    name: Publish authoritative certification status
    needs: certify
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Publish authoritative certification status
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFICATION_RESULT: ${{ needs.certify.result }}
        run: |
          set -euo pipefail

          state='failure'
          description='Main certification failed'
          if [[ "$CERTIFICATION_RESULT" == 'success' ]]; then
            state='success'
            description='Main certification passed'
          fi

          # This publisher is deliberately a separate job with no PostgreSQL
          # service. It still runs if the application job cannot start, so the
          # exact SHA never gets stranded with a stale/pending authoritative
          # status because a service or runner setup failed before test steps.
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='Main Certification' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo '## Authoritative Main Certification status'
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Application job result: \`${CERTIFICATION_RESULT}\`"
            echo "- Published status: **${state}**"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$state" = 'success'
