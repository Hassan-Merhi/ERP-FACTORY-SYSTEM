name: Temporary fuzz dependency preparation

on:
  push:
    branches:
      - security/priority3-property-fuzzing-20261019
    paths:
      - .github/workflows/temporary-fuzz-dependency-setup.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fuzz test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.0"
      - name: Install property-based fuzz test dependency
        run: |
          npm install --save-dev --save-exact fast-check@4.3.0 --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify fuzz invariants
        env:
          FUZZ_RUNS: "1000"
        run: npm run test:fuzz
      - name: Format fuzz source
        run: node node_modules/prettier/bin/prettier.cjs --write tests/security-input-fuzz.test.ts
      - name: Confirm artifact security and package lock consistency
        run: |
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.devDependencies['fast-check']!=='4.3.0')process.exit(1);if(l.packages['node_modules/fast-check']?.version!=='4.3.0')process.exit(1);console.log('Pinned fast-check dependency and lockfile agree')"
          node node_modules/prettier/bin/prettier.cjs --check tests/security-input-fuzz.test.ts
      - name: Commit tested lockfile and formatted fuzz source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json tests/security-input-fuzz.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "test(fuzz): pin fast-check and format fuzz property tests"
            git push origin HEAD:refs/heads/security/priority3-property-fuzzing-20261019
          fi
