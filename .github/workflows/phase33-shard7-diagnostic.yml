name: Phase 33 shard 7 diagnostic

on:
  push:
    branches:
      - test/phase33-final-80-80-80-70-closure
    paths:
      - .github/workflows/phase33-shard7-diagnostic.yml

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
  PGSSLMODE: disable
  NODE_ENV: test
  SESSION_SECRET: ci-session-secret
  CSRF_ENFORCE: "0"
  ENABLE_SCHEDULERS: "false"
  NODE_OPTIONS: --max-old-space-size=4096
  PORT: "5000"
  BACKEND_TEST_SHARDS: "8"
  BACKEND_TEST_SHARD_INDEX: "7"
  BACKEND_TEST_COVERAGE_SHARD_BUDGET_SECONDS: "900"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heliumdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Prepare schema
        run: node node_modules/drizzle-kit/bin.cjs push --force

      - name: Run shard 7 and preserve reporter
        shell: bash
        run: |
          set +e
          node scripts/run-backend-verification.mjs --coverage 2>&1 | tee phase33-shard7-diagnostic.log
          status=${PIPESTATUS[0]}
          echo "--- VITEST JSON REPORT ---"
          if [ -f .artifacts/backend-verification/shard-7.json ]; then
            cat .artifacts/backend-verification/shard-7.json
          else
            echo "Reporter file missing"
          fi
          exit "$status"

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase33-shard7-diagnostic
          path: |
            .artifacts/backend-verification/shard-7.json
            coverage/backend-shards/shard-7/coverage-final.json
            phase33-shard7-diagnostic.log
          if-no-files-found: warn
          retention-days: 7
