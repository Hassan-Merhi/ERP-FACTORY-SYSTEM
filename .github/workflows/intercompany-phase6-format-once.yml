name: Temporary Phase 6 Voucher Formatter
on:
  push:
    branches:
      - feature/intercompany-container-trading
    paths:
      - .github/workflows/intercompany-phase6-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[phase6-format-once]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intercompany-container-trading
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned formatting dependencies
        run: npm ci --ignore-scripts --no-audit --bin-links=true
      - name: Format only Phase 6 source and tests
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/vouchers/intercompanyTransferPolicy.ts \
            client/src/i18n/intercompanyVoucherTranslations.ts \
            client/src/pages/vouchers/voucherSidebarGroups.ts \
            client/src/pages/Vouchers.tsx \
            client/src/pages/intercompany/IntercompanyPayments.tsx \
            server/services/intercompany/pairedPaymentAuthorization.ts \
            server/services/intercompany/paymentSync.ts \
            server/services/intercompany/paymentQueries.ts \
            tests/intercompany-phase6-voucher-payments.test.ts
      - name: Commit formatted files to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/vouchers/intercompanyTransferPolicy.ts client/src/i18n/intercompanyVoucherTranslations.ts client/src/pages/vouchers/voucherSidebarGroups.ts client/src/pages/Vouchers.tsx client/src/pages/intercompany/IntercompanyPayments.tsx server/services/intercompany/pairedPaymentAuthorization.ts server/services/intercompany/paymentSync.ts server/services/intercompany/paymentQueries.ts tests/intercompany-phase6-voucher-payments.test.ts
          if git diff --cached --quiet; then
            echo "Phase 6 files already formatted"
          else
            git commit -m "style(intercompany): format Phase 6 voucher integration"
            git push origin HEAD:feature/intercompany-container-trading
          fi
