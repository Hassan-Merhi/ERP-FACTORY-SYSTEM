name: Format ERP Tester Company Types Once

on:
  push:
    branches:
      - fix/erp-tester-settings-all-company-types-20261022

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/erp-tester-settings-all-company-types-20261022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format changed source and self-remove
        run: |
          npx prettier --write \
            client/src/components/FactorySidebar.tsx \
            client/src/components/FactoryRoutes.tsx \
            client/src/components/PropertiesSidebar.tsx \
            client/src/app/PropertiesRoutes.tsx \
            client/src/components/CommandPalette.tsx \
            client/src/app/authenticatedAppRouteGuard.ts \
            shared/erpTestCompanyAccess.ts \
            tests/ui/factory-bootstrap-phase3.test.ts
          rm -f .github/workflows/format-erp-tester-company-types-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format ERP Tester company-type access guards' || exit 0
          git push origin HEAD:fix/erp-tester-settings-all-company-types-20261022
