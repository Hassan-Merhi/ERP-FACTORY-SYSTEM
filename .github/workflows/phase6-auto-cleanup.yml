name: Phase 6 one-shot cleanup

on:
  push:
    branches:
      - perf/full-list-wave1-audit-architecture
    paths:
      - .github/workflows/phase6-auto-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/full-list-wave1-audit-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Print current accounting i18n findings
        run: |
          node scripts/audit-i18n-phase14.mjs --no-enforce --json-out=/tmp/i18n.json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/i18n.json','utf8'));
          const rows = report.findings.filter((f) => f.module === 'accounting' && f.status === 'actionable');
          console.log(JSON.stringify(rows, null, 2));
          NODE
      - name: Lock earned type-escape reduction
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'config/type-escape-boundaries.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          delete data.scan.baseline['server/routes/accountTransactionPaginationRoutes.ts'];
          data.totals.typeEscapeCeiling = 1058;
          fs.writeFileSync(p, JSON.stringify(data, null, 2) + '\n');
          NODE
      - name: Format changed source files
        run: |
          npx prettier --write \
            client/src/hooks/useBoundedTableRows.ts \
            client/src/lib/accountStatementPaginationClient.ts \
            client/src/lib/continuousListClient.ts \
            client/src/lib/erpDaybookPaginationClient.ts \
            client/src/pages/accounts/AccountTransactionRows.tsx \
            client/src/pages/git-containers/ContainerTable.tsx \
            client/src/pages/git-containers/usePaginatedGITContainers.ts \
            server/lib/continuousCursor.test.ts \
            server/routes/accountTransactionPaginationRoutes.ts \
            server/routes/daybookPaginationRoutes.ts \
            server/routes/git/gitContinuousSnapshots.test.ts \
            server/routes/git/gitContinuousSnapshots.ts \
            server/routes/git/gitReportRoutes.ts \
            tests/account-transaction-continuous-route.test.ts \
            tests/ui/bounded-table-rows.test.tsx \
            tests/ui/continuous-list-client.test.ts \
            tests/ui/data-tools-page-behavior.test.tsx \
            tests/ui/git-continuous-containers-hook.test.tsx \
            config/type-escape-boundaries.json
      - name: Commit cleanup and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase6-auto-cleanup.yml
          git add -A
          git commit -m "chore: finish phase 6 formatting and ratchets"
          git push origin HEAD:perf/full-list-wave1-audit-architecture
