name: Phase 3 Formatting Preview (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/intercompany-phase3-formatter-preview.yml
      - server/services/intercompany/**
      - client/src/pages/intercompany/**
      - tests/intercompany-phase3*
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-26.04
    timeout-minutes: 14
    steps:
      - name: Download exact branch commit for read-only formatting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$TARGET_SHA" \
            | tar --extract --gzip --strip-components=1
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compute formatted files without writing to repository
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/prettier/bin/prettier.cjs --write server/services/intercompany/sharedChargePermissions.ts
          node node_modules/prettier/bin/prettier.cjs --write server/services/intercompany/sharedChargeSync.ts
          node node_modules/prettier/bin/prettier.cjs --write server/services/intercompany/tradeRevisionMath.ts
          node node_modules/prettier/bin/prettier.cjs --write server/services/intercompany/tradeSync.ts
          node node_modules/prettier/bin/prettier.cjs --write client/src/pages/intercompany/LinkedTradesEditor.tsx
          node node_modules/prettier/bin/prettier.cjs --write client/src/routes/ErpRoutes.tsx
          node node_modules/prettier/bin/prettier.cjs --write client/src/app/PropertiesRoutes.tsx
          node node_modules/prettier/bin/prettier.cjs --write client/src/components/PropertiesSidebar.tsx
          node node_modules/prettier/bin/prettier.cjs --write client/src/pages/containers/ContainerToolbar.tsx
          node node_modules/prettier/bin/prettier.cjs --write server/routes/import/index.ts
          node node_modules/prettier/bin/prettier.cjs --write server/routes/import/intercompany-phase3.ts
          node node_modules/prettier/bin/prettier.cjs --write shared/schema/intercompanyTrading.ts
          node node_modules/prettier/bin/prettier.cjs --write tests/intercompany-phase3-pricing.test.ts
          node node_modules/prettier/bin/prettier.cjs --write tests/intercompany-phase3-database-guards.test.ts
          node - <<'NODE'
          const fs = require("node:fs");
          const paths = ["server/services/intercompany/sharedChargePermissions.ts","server/services/intercompany/sharedChargeSync.ts","server/services/intercompany/tradeRevisionMath.ts","server/services/intercompany/tradeSync.ts","client/src/pages/intercompany/LinkedTradesEditor.tsx","client/src/routes/ErpRoutes.tsx","client/src/app/PropertiesRoutes.tsx","client/src/components/PropertiesSidebar.tsx","client/src/pages/containers/ContainerToolbar.tsx","server/routes/import/index.ts","server/routes/import/intercompany-phase3.ts","shared/schema/intercompanyTrading.ts","tests/intercompany-phase3-pricing.test.ts","tests/intercompany-phase3-database-guards.test.ts"];
          for(const path of paths) {
            console.log("BEGIN_FORMATTED_FILE:" + path);
            console.log(fs.readFileSync(path).toString("base64"));
            console.log("END_FORMATTED_FILE:" + path);
          }
          NODE
