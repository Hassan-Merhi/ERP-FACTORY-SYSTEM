name: One-time supplier PR formatter
on:
  push:
    branches:
      - fix/factory-supplier-ledger-reconciliation-20261014
    paths:
      - .github/workflows/factory-reconciliation-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Format changed accounting source files
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/prettier/bin/prettier.cjs --write "client/src/pages/factory/factory-suppliers/LedgerBalancePanel.tsx" "scripts/reconcile-fixed-factory-historical-fx-20261014.ts" "server/middleware/factoryBackendAccessBoundary.ts" "server/routes/accounting-integrity/index.ts" "server/routes/factory/containers/delete.ts" "server/routes/factory/containers/update.ts" "server/routes/factory/suppliers/balance/single.ts" "server/routes/factory/suppliers/balance/with-balances.ts" "server/routes/factory/suppliers/supplierStatementRoutes.ts" "server/services/factory/factoryFxLegacyRepair.ts" "server/startup/postStartupJobs.ts" "tests/factory-fx-legacy-repair.test.ts"
          git add -- "client/src/pages/factory/factory-suppliers/LedgerBalancePanel.tsx" "scripts/reconcile-fixed-factory-historical-fx-20261014.ts" "server/middleware/factoryBackendAccessBoundary.ts" "server/routes/accounting-integrity/index.ts" "server/routes/factory/containers/delete.ts" "server/routes/factory/containers/update.ts" "server/routes/factory/suppliers/balance/single.ts" "server/routes/factory/suppliers/balance/with-balances.ts" "server/routes/factory/suppliers/supplierStatementRoutes.ts" "server/services/factory/factoryFxLegacyRepair.ts" "server/startup/postStartupJobs.ts" "tests/factory-fx-legacy-repair.test.ts"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(factory): format historical supplier reconciliation source'
            git push origin HEAD:fix/factory-supplier-ledger-reconciliation-20261014
          fi
