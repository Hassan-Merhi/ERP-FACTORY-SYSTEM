name: Mobile Responsiveness

on:
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "scripts/verify-mobile-responsive-*.mjs"
      - "scripts/audit-ux-module-consistency.mjs"
      - "scripts/prepare-phase9-browser-smoke-fixture.mjs"
      - "scripts/run-phase9-language-browser-smoke.mjs"
      - "scripts/verify-bandwidth-*.mjs"
      - "scripts/verify-phase10-dialog-form-consistency.mjs"
      - "tests/ui/mobile-responsive-*.test.ts"
      - "tests/ui/**/*filter*.test.*"
      - "docs/mobile-tablet-web-regression.md"
      - "docs/archive/mobile-responsive-phase-status.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-responsive.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-responsive-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      SESSION_SECRET: ux-regression-browser-secret
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      PORT: "5000"
      ERP_SMOKE_BASE_URL: http://127.0.0.1:5000
      ERP_SMOKE_OUTPUT_DIR: artifacts/ux-regression-browser
      ERP_SMOKE_USERNAME: ux_ci_${{ github.run_id }}
      ERP_SMOKE_PASSWORD: ux-ci-${{ github.run_id }}-${{ github.run_attempt }}
      ERP_SMOKE_REQUIRE_AUTHENTICATED: "1"
      ERP_SMOKE_REQUIRE_EXACT_ROUTES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chrome for rendered smoke
        run: node node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome
      - name: TypeScript
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Cross-module UX consistency audit
        run: npm run audit:ux-consistency
      - name: Prepare disposable browser fixture
        run: |
          node node_modules/drizzle-kit/bin.cjs push --force
          node scripts/prepare-phase9-browser-smoke-fixture.mjs
      - name: Authenticated responsive and multilingual browser smoke
        run: |
          mkdir -p artifacts/ux-regression-startup
          npm start > artifacts/ux-regression-startup/server.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 180); do
            if curl --fail --silent --show-error "http://127.0.0.1:${PORT}/api/health/db" \
              > artifacts/ux-regression-startup/health-db.json; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat artifacts/ux-regression-startup/server.log
              exit 1
            fi
            if [ "$attempt" = "180" ]; then
              cat artifacts/ux-regression-startup/server.log
              exit 1
            fi
            sleep 1
          done

          node scripts/run-phase9-language-browser-smoke.mjs
      - name: Full responsive contract matrix
        run: node scripts/verify-mobile-responsive-phase11-regression.mjs
      - name: Focused responsive tests
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.frontend.ts tests/ui/mobile-responsive-*.test.ts
      - name: Frontend regression suite
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run test:frontend -- --maxWorkers=1
      - name: Security and dependency contracts
        run: |
          npm run verify:lockfile
          npm run verify:dependency-audit
          npm run verify:production-dependencies
      - name: Upload rendered UX evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ux-regression-browser
          path: |
            artifacts/ux-regression-browser
            artifacts/ux-regression-startup
          if-no-files-found: warn
          retention-days: 7
