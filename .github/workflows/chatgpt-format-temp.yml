name: ChatGPT Temporary Formatter

on:
  push:
    branches:
      - fix/loading-scan-feedback-first-pass
    paths:
      - .github/workflows/chatgpt-format-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/loading-scan-feedback-first-pass

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format changed source and remove temporary workflow
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/routes/factory/customer-orders/proformaCapacityEnforcement.ts \
            client/src/pages/factory/factorycontainerloadingscan/ScanOverlays.tsx \
            tests/proforma-capacity-enforcement.test.ts
          git rm .github/workflows/chatgpt-format-temp.yml
          git config user.name "chatgpt-format-bot"
          git config user.email "noreply@openai.com"
          git add server/routes/factory/customer-orders/proformaCapacityEnforcement.ts \
            client/src/pages/factory/factorycontainerloadingscan/ScanOverlays.tsx \
            tests/proforma-capacity-enforcement.test.ts
          git commit -m "Format loading scan fix"
          git push origin HEAD:fix/loading-scan-feedback-first-pass
