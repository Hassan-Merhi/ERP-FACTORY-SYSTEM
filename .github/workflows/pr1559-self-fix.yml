name: PR 1563 one-shot doc-index repair

on:
  push:
    branches:
      - test/phase33e-supplier-intercompany-permissions-20260917

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/phase33e-supplier-intercompany-permissions-20260917
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Classify missing archived docs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'config/doc-index.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.classification['docs/archive/remote-support-audit-authorization.md'] = 'record';
          data.classification['docs/archive/remote-support-phase-12-usable-allowlists.md'] = 'record';
          data.classification = Object.fromEntries(
            Object.entries(data.classification).sort(([a], [b]) => a.localeCompare(b)),
          );
          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          NODE

      - name: Verify failing repository audits
        run: |
          npm run audit:doc-index
          npm run audit:scripts
          node node_modules/prettier/bin/prettier.cjs --check config/doc-index.json

      - name: Restore helper and commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/pr1559-self-fix.yml
          git add .github/workflows/pr1559-self-fix.yml config/doc-index.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: classify remote-support archive records"
          git push origin HEAD:test/phase33e-supplier-intercompany-permissions-20260917
