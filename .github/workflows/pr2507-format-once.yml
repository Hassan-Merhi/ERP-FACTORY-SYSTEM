name: Format supplier reconciliation PR (one time)

on:
  push:
    branches:
      - feature/supplier-profit-reconciliation
    paths:
      - .github/workflows/pr2507-format-once.yml

permissions:
  contents: write

jobs:
  apply-format:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/supplier-profit-reconciliation
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Format changed report files and remove temporary workflow
        run: |
          set -euo pipefail
          npm ci --no-audit
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/SupplierProfitReconciliation.tsx \
            server/routes/stats/supplierProfitReconciliationRoutes.ts \
            client/src/i18n/supplierProfitReconciliationTranslations.ts \
            client/src/components/ApplicationInterfaceTranslator.tsx
          git rm .github/workflows/pr2507-format-once.yml
          git config user.name 'ERP CI Formatter'
          git config user.email 'ci-formatter@users.noreply.github.com'
          git add client/src/pages/SupplierProfitReconciliation.tsx \
            server/routes/stats/supplierProfitReconciliationRoutes.ts \
            client/src/i18n/supplierProfitReconciliationTranslations.ts \
            client/src/components/ApplicationInterfaceTranslator.tsx
          git commit -m 'style: format supplier reconciliation source'
          git push origin HEAD:feature/supplier-profit-reconciliation
