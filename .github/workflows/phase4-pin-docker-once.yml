name: Phase 4 - Pin immutable Node Docker image and smoke-test edge

on:
  push:
    branches: [fix/security-quality-36-20261104]
    paths:
      - .github/workflows/phase4-pin-docker-once.yml

permissions: {}

jobs:
  pin-and-verify:
    if: github.repository == 'Hassan-Merhi/ERP-FACTORY-SYSTEM' && github.ref == 'refs/heads/fix/security-quality-36-20261104'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout isolated shared security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/security-quality-36-20261104
          persist-credentials: true

      - name: Verify registry manifest and freeze digest for both Docker stages
        shell: bash
        run: |
          set -euo pipefail
          tag="node:24.22.1-bookworm-slim"
          docker buildx imagetools inspect "$tag" > "$RUNNER_TEMP/node-image.txt"
          cat "$RUNNER_TEMP/node-image.txt" | head -n 22
          digest="$(sed -nE 's/^Digest:[[:space:]]*(sha256:[0-9a-f]{64})[[:space:]]*$/\1/p' "$RUNNER_TEMP/node-image.txt" | head -n 1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to resolve an immutable multi-platform digest for $tag"
            exit 1
          fi
          echo "Verified official Node image digest: $digest"
          NODE_IMAGE_DIGEST="$digest" python3 - <<'PY'
          import os, pathlib
          path = pathlib.Path("deploy/lan/Dockerfile")
          data = path.read_text()
          current = "FROM node:24-bookworm-slim"
          if data.count(current) != 2:
              raise SystemExit("Expected exactly two unpinned Node Docker stages")
          pinned = "FROM node:24.22.1-bookworm-slim@" + os.environ["NODE_IMAGE_DIGEST"]
          data = data.replace(current, pinned)
          before = "COPY scripts/setup-git-hooks.mjs ./scripts/setup-git-hooks.mjs\nRUN npm ci --no-audit --bin-links=true"
          after = ("COPY scripts/setup-git-hooks.mjs ./scripts/setup-git-hooks.mjs\n"
                   "# The Puppeteer Extra deepmerge file override must exist before npm ci.\n"
                   "COPY vendor/secure-deepmerge/ ./vendor/secure-deepmerge/\n"
                   "RUN npm ci --no-audit --bin-links=true")
          if data.count(before) != 1:
              raise SystemExit("Unexpected builder dependency-layer layout")
          data = data.replace(before, after)
          path.write_text(data)
          PY
          grep '^FROM ' deploy/lan/Dockerfile
          test "$(grep -c '^FROM node:24.22.1-bookworm-slim@sha256:' deploy/lan/Dockerfile)" -eq 2
          test "$(grep -cF "COPY vendor/secure-deepmerge/" deploy/lan/Dockerfile)" -eq 1

      - name: Smoke-build the real factory edge Dockerfile with immutable image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --progress=plain -f deploy/lan/Dockerfile -t erp-factory-edge-security-phase4:verify . 2>&1 | tee "$RUNNER_TEMP/edge-build.log"
          docker image inspect erp-factory-edge-security-phase4:verify --format '{{.Config.User}}' | grep -Fx node
          docker run --rm --entrypoint node erp-factory-edge-security-phase4:verify --version
          # Keep this a build-only smoke. No live database, ERP transaction,
          # credentials, or production endpoint is accessed.

      - name: Commit verified digest and remove temporary privileged workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "security-docker-pin[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/phase4-pin-docker-once.yml
          git add -- deploy/lan/Dockerfile
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(supply-chain): pin verified Node 24.22.1 Docker digest in both LAN build stages"
          git push origin HEAD:refs/heads/fix/security-quality-36-20261104
