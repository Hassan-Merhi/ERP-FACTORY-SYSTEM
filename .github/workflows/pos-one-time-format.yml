name: POS one-time formatting
on:
  push:
    branches:
      - feature/modern-pos-ui-theme-seasonal-20261107
    paths:
      - .github/workflows/pos-one-time-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feature/modern-pos-ui-theme-seasonal-20261107'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply repository Prettier formatting
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/pos/POS.tsx \
            client/src/pages/pos/pos-components/InventoryPicker.tsx \
            client/src/pages/pos/pos-components/POSHeader.tsx \
            client/src/pages/pos/pos-components/PosCheckoutStrip.tsx \
            client/src/pages/pos/pos-components/PosWorkspaceColumns.tsx \
            client/src/pages/pos/pos-components/SaleGrid.tsx \
            client/src/styles/pos-workspace-premium.css \
            client/src/i18n/applicationTranslations.ts \
            client/src/i18n/applicationTranslations.ar.ts \
            client/src/i18n/applicationTranslations.fr.ts
      - name: Commit formatted source to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/pos/POS.tsx client/src/pages/pos/pos-components client/src/styles/pos-workspace-premium.css client/src/i18n/applicationTranslations.ts client/src/i18n/applicationTranslations.ar.ts client/src/i18n/applicationTranslations.fr.ts
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "style(pos): apply repository Prettier formatting"
            git push origin HEAD:feature/modern-pos-ui-theme-seasonal-20261107
          fi
