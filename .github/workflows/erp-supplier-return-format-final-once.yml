name: ERP Supplier Return Final One-Time Format
on:
  push:
    branches:
      - feature/erp-supplier-return-code-matching-review
permissions:
  contents: write
jobs:
  format-feature:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/erp-supplier-return-code-matching-review
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
      - run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci --no-audit --bin-links=true
      - run: node node_modules/prettier/bin/prettier.cjs --write client/src/pages/factory/FactorySupplierReturns.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/factory/FactorySupplierReturns.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format ERP return allocation safety"
            git push origin HEAD:feature/erp-supplier-return-code-matching-review
          fi
