name: Format simple supplier report (one time)
on:
  push:
    branches: [feature/simplify-supplier-profit-excel]
    paths: [.github/workflows/pr2512-format-once.yml]
permissions:
  contents: write
jobs:
  format-report:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/simplify-supplier-profit-excel
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Format files and self-delete
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit
          node node_modules/prettier/bin/prettier.cjs --write client/src/pages/SupplierProfitReconciliation.tsx client/src/i18n/supplierProfitReconciliationTranslations.ts
          git rm .github/workflows/pr2512-format-once.yml
          git add client/src/pages/SupplierProfitReconciliation.tsx client/src/i18n/supplierProfitReconciliationTranslations.ts
          git config user.name 'ERP CI Formatter'
          git config user.email 'ci-formatter@users.noreply.github.com'
          git commit -m 'style: format Excel-style supplier profit report'
          git push origin HEAD:feature/simplify-supplier-profit-excel
