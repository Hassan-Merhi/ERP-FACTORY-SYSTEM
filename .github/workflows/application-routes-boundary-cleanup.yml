name: Application Routes Boundary Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/application-routes-god-file-boundary-20260910
      - run: |
          git rm -f .github/workflows/application-routes-boundary-verification.yml .github/workflows/application-routes-boundary-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove temporary application routes verification"
          git push origin HEAD:fix/application-routes-god-file-boundary-20260910
