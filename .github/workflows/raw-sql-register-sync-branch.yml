name: One-time raw SQL review register sync (audit branch only)
on:
  push:
    branches: [fix/program6d-query-safety-20261117]
    paths: [.github/workflows/raw-sql-register-sync-branch.yml]
permissions:
  contents: write
jobs:
  regenerate-reviewed-register:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Regenerate register from actual source inventory
        run: node scripts/verify-raw-sql-allowlist.mjs --write-register || true
      - name: Ensure all SQL sites are reviewed
        run: node scripts/verify-raw-sql-allowlist.mjs
      - name: Commit generated register to audit branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add docs/security/raw-sql-audit-findings.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(audit): refresh raw SQL findings register from scanned sources'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" "HEAD:refs/heads/fix/program6d-query-safety-20261117"
