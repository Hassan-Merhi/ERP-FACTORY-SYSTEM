name: Temporary canonical invoice formatter

on:
  push:
    branches:
      - fix/canonical-invoice-category

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/canonical-invoice-category
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit --bin-links=true
      - name: Format only canonical invoice changes
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/routes/factory/factoryBilingualDocumentRoutes.ts \
            server/services/factoryInvoiceDocumentService.ts \
            tests/customer-order-excel-export-behavior.test.ts
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/temp-canonical-invoice-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/factory/factoryBilingualDocumentRoutes.ts server/services/factoryInvoiceDocumentService.ts tests/customer-order-excel-export-behavior.test.ts
          git commit -m "style: format canonical invoice changes"
          git push origin HEAD:fix/canonical-invoice-category
