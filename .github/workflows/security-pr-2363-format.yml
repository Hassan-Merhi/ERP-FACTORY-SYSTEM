name: Temporary PR 2363 Prettier repair

on:
  push:
    branches:
      - security/harden-export-paths-and-privileged-passwords-20261019
    paths:
      - .github/workflows/security-pr-2363-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.0"
      - name: Install pinned repo dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format relevant source
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            server/helpers/exportAttachmentSource.ts \
            server/routes/_helpers.ts \
            server/routes/auth/coreAuthRoutes.ts \
            tests/export-attachment-path-security.test.ts \
            client/src/pages/BarcodeManager.tsx \
            client/src/pages/accounts/HistoricalOpeningResolver.tsx \
            client/src/pages/factory/factory-suppliers/SupplierFormDialog.tsx \
            client/src/pages/pos/pos-components/PosCheckoutStrip.tsx \
            client/src/pages/pos/pos-components/PosMobileLayout.tsx \
            client/src/pages/stockitems/StockItemsView.tsx \
            client/src/pages/vouchers/journalform/JournalEntriesEditor.tsx
      - name: Commit formatting only to the security PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "security-pr-format-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            server/helpers/exportAttachmentSource.ts \
            server/routes/_helpers.ts \
            server/routes/auth/coreAuthRoutes.ts \
            tests/export-attachment-path-security.test.ts \
            client/src/pages/BarcodeManager.tsx \
            client/src/pages/accounts/HistoricalOpeningResolver.tsx \
            client/src/pages/factory/factory-suppliers/SupplierFormDialog.tsx \
            client/src/pages/pos/pos-components/PosCheckoutStrip.tsx \
            client/src/pages/pos/pos-components/PosMobileLayout.tsx \
            client/src/pages/stockitems/StockItemsView.tsx \
            client/src/pages/vouchers/journalform/JournalEntriesEditor.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format security PR and select-handler fixes"
            git push origin HEAD:refs/heads/security/harden-export-paths-and-privileged-passwords-20261019
          fi
