name: Phase 33F Format Probe

on:
  push:
    branches:
      - test/phase33f-auth-import-export-integrations

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - name: Download repository source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" | \
            tar --extract --gzip --strip-components=1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Format Phase 33F tests
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            tests/phase33f-phase5-reports.test.ts \
            tests/phase33f-route-guards.test.ts \
            tests/phase33f-scheduler-exports.test.ts \
            tests/phase33f-tracking-integrations.test.ts \
            tests/phase33f-websocket-auth.test.ts

      - name: Upload canonical formatting
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase33f-prettier-output
          path: |
            tests/phase33f-phase5-reports.test.ts
            tests/phase33f-route-guards.test.ts
            tests/phase33f-scheduler-exports.test.ts
            tests/phase33f-tracking-integrations.test.ts
            tests/phase33f-websocket-auth.test.ts
          if-no-files-found: error
          retention-days: 1
