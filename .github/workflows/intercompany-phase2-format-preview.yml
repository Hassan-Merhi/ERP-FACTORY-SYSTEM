name: Phase 2 Formatter Preview (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/intercompany-phase2-format-preview.yml
      - server/services/intercompany/**
      - client/src/pages/properties/PropertiesContainerTrading.tsx
      - tests/intercompany-phase2-*.test.ts
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Read feature branch source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$TARGET_SHA" \
            | tar --extract --gzip --strip-components=1
      - name: Install locked formatter
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print formatted source as base64 for branch update
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/prettier/bin/prettier.cjs --write shared/schema/intercompanyTrading.ts server/services/intercompany/containerImportPlan.ts server/services/intercompany/containerTradingImport.ts server/routes/import/intercompany-container-trading.ts server/routes/import/index.ts client/src/pages/properties/PropertiesContainerTrading.tsx client/src/app/PropertiesRoutes.tsx client/src/components/PropertiesSidebar.tsx tests/intercompany-phase2-container-pricing.test.ts tests/intercompany-phase2-database-guards.test.ts
          node - <<'NODE'
          const fs = require("node:fs");
          const files = ["shared/schema/intercompanyTrading.ts","server/services/intercompany/containerImportPlan.ts","server/services/intercompany/containerTradingImport.ts","server/routes/import/intercompany-container-trading.ts","server/routes/import/index.ts","client/src/pages/properties/PropertiesContainerTrading.tsx","client/src/app/PropertiesRoutes.tsx","client/src/components/PropertiesSidebar.tsx","tests/intercompany-phase2-container-pricing.test.ts","tests/intercompany-phase2-database-guards.test.ts"];
          for (const file of files) {
            console.log("BEGIN_FORMATTED_FILE:" + file);
            console.log(fs.readFileSync(file).toString("base64"));
            console.log("END_FORMATTED_FILE:" + file);
          }
          NODE
