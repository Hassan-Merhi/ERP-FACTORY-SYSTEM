name: Retail Wave 1 Format I18n Once

on:
  push:
    branches:
      - feature/retail-fashion-variants-wave1
    paths:
      - ".github/workflows/retail-wave1-format-i18n-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/retail-fashion-variants-wave1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Format translation catalog
        run: node node_modules/prettier/bin/prettier.cjs --write client/src/i18n/retailWave1Translations.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/i18n/retailWave1Translations.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style(retail): format wave 1 translations"
            git push origin HEAD:feature/retail-fashion-variants-wave1
          fi
