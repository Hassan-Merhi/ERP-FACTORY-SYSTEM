name: Priority Scan Model Formatter

on:
  push:
    branches:
      - feat/priority-scan-wave-1
    paths:
      - ".github/workflows/priority-scan-format-model-temp.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/priority-scan-wave-1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format remaining changed model
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/factory/factorycontainerloadingscan/useFactoryContainerLoadingScanModel.ts

      - name: Commit formatted file
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/factory/factorycontainerloadingscan/useFactoryContainerLoadingScanModel.ts
          git commit -m "Format shared loading model"
          git push origin HEAD:feat/priority-scan-wave-1
