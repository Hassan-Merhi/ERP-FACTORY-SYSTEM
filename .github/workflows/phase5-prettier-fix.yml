name: Phase 5 Prettier Fix

on:
  push:
    branches:
      - phase5-dependencies-toolchain
    paths:
      - server/routes/chatbot/_helpers.ts
      - .github/workflows/phase5-prettier-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase5-dependencies-toolchain
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install dependencies without scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Format chatbot helper
        run: node node_modules/prettier/bin/prettier.cjs --write server/routes/chatbot/_helpers.ts
      - name: Commit canonical formatting when needed
        run: |
          if git diff --quiet -- server/routes/chatbot/_helpers.ts; then
            echo "Chatbot helper already matches repository Prettier output."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/chatbot/_helpers.ts
          git commit -m "style(phase5): apply repository Prettier output"
          git push origin "HEAD:${GITHUB_REF_NAME}"
