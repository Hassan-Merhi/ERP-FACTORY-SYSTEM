name: Temporary Phase 7 Intercompany Navigation Formatter
on:
  push:
    branches:
      - feature/intercompany-container-trading
    paths:
      - .github/workflows/intercompany-phase7-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[phase7-format-once]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intercompany-container-trading
          persist-credentials: true
      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked formatting dependencies
        run: npm ci --ignore-scripts --no-audit --bin-links=true
      - name: Format Phase 7 files only
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/intercompany/intercompanyLegacyNavigation.ts \
            client/src/properties/config/propertiesNavigation.ts \
            client/src/components/PropertiesSidebar.tsx \
            client/src/app/PropertiesRoutes.tsx \
            client/src/routes/ErpRoutes.tsx \
            tests/intercompany-phase7-navigation.test.ts
      - name: Commit formatting only on the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/intercompany/intercompanyLegacyNavigation.ts client/src/properties/config/propertiesNavigation.ts client/src/components/PropertiesSidebar.tsx client/src/app/PropertiesRoutes.tsx client/src/routes/ErpRoutes.tsx tests/intercompany-phase7-navigation.test.ts
          if git diff --cached --quiet; then
            echo "Phase 7 files already formatted"
          else
            git commit -m "style(intercompany): format Phase 7 navigation cleanup"
            git push origin HEAD:feature/intercompany-container-trading
          fi
