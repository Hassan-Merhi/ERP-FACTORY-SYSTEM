name: Nightly ERP Training Audit

on:
  # Rerun the disposable audit when its implementation or CI harness changes.
  # Ordinary ERP application commits still do not trigger this heavyweight audit.
  push:
    branches: [main]
    paths:
      - ".github/workflows/nightly-training-audit.yml"
      - ".github/workflows/nightly-system-regression.yml"
      - ".github/workflows/training-videos.yml"
      - "scripts/record-training-guides.mjs"
      - "scripts/training-narration.mjs"
      - "scripts/training-narration-tts.py"
      - "scripts/verify-nightly-transaction-reconciliation.mjs"
      - "scripts/validate-training-recording.mjs"
      - "scripts/upload-reviewed-training-vercel.mjs"
      - "training/gateway/**"
      - "scripts/nightly-system-regression.test.mjs"
      - "scripts/generate-program6c-inventory-classifications.mjs"
      - "scripts/generate-program6c-inventory-classifications.test.mjs"
      - "client/src/factory-mobile-touch-targets.css"
      - "client/src/main.tsx"
  schedule:
    # 02:15 UTC: 04:15 in Beirut winter / 05:15 summer. Cron runs in UTC.
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-erp-training-main
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    outputs:
      record: ${{ steps.classify.outputs.record }}
      topics: ${{ steps.classify.outputs.topics }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
      - name: Find last successful nightly source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Nightly must compare against the most recent successful NIGHTLY run,
          # never against an unrelated manual recording or a failed capture.
          prior=$(gh run list --workflow nightly-training-audit.yml --branch main \
            --status success --limit 30 --json headSha,event,databaseId \
            --jq '[.[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].headSha // ""')
          echo "TRAINING_BASELINE_SHA=$prior" >> "$GITHUB_ENV"
      - id: classify
        name: Identify new or outdated tutorials
        run: |
          node --test scripts/plan-nightly-training.test.mjs
          node scripts/plan-nightly-training.mjs
      - name: Keep reviewable change-detection report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-training-plan
          path: artifacts/training-plan/plan.json
          if-no-files-found: error
          retention-days: 30

  record:
    needs: plan
    if: needs.plan.outputs.record == 'true'
    uses: ./.github/workflows/training-videos.yml
    with:
      topic: ${{ needs.plan.outputs.topics }}
    permissions:
      contents: read

  transactions:
    name: Exercise fake transactions and reconcile financial / stock totals
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
      NODE_ENV: test
      ERP_E2E_DISPOSABLE_DB: "1"
      TRAINING_SANDBOX_VERIFIED: "1"
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
      PORT: "5000"
      API_RATE_LIMIT_MAX: "100000"
      API_RATE_LIMIT_ANON_MAX: "100000"
      ERP_E2E_USERNAME: nightly_erp_${{ github.run_id }}
      ERP_E2E_POS_USERNAME: nightly_pos_${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
      - name: Generate unique throwaway credentials
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          for (const key of ["SESSION_SECRET", "ERP_E2E_PASSWORD", "ERP_E2E_POS_PASSWORD"]) {
            fs.appendFileSync(process.env.GITHUB_ENV, key + "=" + crypto.randomBytes(48).toString("hex") + "\n");
          }
          NODE
      - run: npm ci --ignore-scripts
      - name: Install browser
        run: node node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome
      - name: Build current ERP with its real transaction handlers
        run: |
          npm run prebuild
          node --max-old-space-size=4096 node_modules/vite/bin/vite.js build
          node scripts/build-server.mjs
          node scripts/verify-server-bundle.mjs
          node scripts/verify-runtime-dependencies.mjs
      - name: Seed ONLY disposable example companies and accounts
        run: |
          node node_modules/drizzle-kit/bin.cjs push --force
          node scripts/prepare-phase7-browser-e2e-fixture.mjs
      - name: Run real fake-company transactions and reconcile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nightly-transactions
          npm start > artifacts/nightly-transactions/server.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:5000/api/health/db >/dev/null 2>&1; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat artifacts/nightly-transactions/server.log
              exit 1
            fi
            if [ "$attempt" = 180 ]; then
              cat artifacts/nightly-transactions/server.log
              exit 1
            fi
            sleep 1
          done
          set +e
          node scripts/run-phase7-browser-e2e.mjs
          browser_result=$?
          node scripts/verify-nightly-transaction-reconciliation.mjs
          reconciliation_result=$?
          set -e
          test "$browser_result" -eq 0 && test "$reconciliation_result" -eq 0
      - name: Upload transaction and reconciliation evidence for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-fake-company-reconciliation
          path: |
            artifacts/phase7-browser-e2e
            artifacts/nightly-transactions
          if-no-files-found: warn
          retention-days: 30

  whole-system:
    name: All backend / frontend / security / accounting coverage
    uses: ./.github/workflows/nightly-system-regression.yml
    permissions:
      contents: read

  publish:
    name: Publish validated recordings to private training storage
    needs: [plan, record]
    # Nightly publication is automatic: a captured, fully decoded recording of
    # this exact main commit replaces the topic's previous video in the ERP.
    if: needs.plan.outputs.record == 'true' && needs.record.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: training-publication
    concurrency:
      group: training-publisher
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TRAINING_PUBLICATION_APPROVAL_ENABLED: ${{ vars.TRAINING_PUBLICATION_APPROVAL_ENABLED }}
      TRAINING_SOURCE_SHA: ${{ github.sha }}
      TRAINING_REVIEW_DIR: ${{ github.workspace }}/.training-review
      TRAINING_VALIDATION: ${{ github.workspace }}/.training-review/validated-recordings.json
      TRAINING_PUBLISHED_BY: nightly-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
      - name: Fail closed unless the protected publication environment is configured
        shell: bash
        run: |
          set -euo pipefail
          test "$TRAINING_PUBLICATION_APPROVAL_ENABLED" = "true" || {
            echo "::error::Protected training publication is not enabled on the training-publication environment"; exit 1;
          }
          [[ "$TRAINING_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || {
            echo "::error::Protected GitHub OIDC identity is unavailable"; exit 1;
          }
      - name: Install the decoder used to re-verify every recording
        timeout-minutes: 35
        run: |
          # The runner's apt mirror is sometimes very slow (one install took 30
          # minutes). Give each attempt 15 minutes, skip optional packages, and
          # retry once against the main Ubuntu archive instead of the mirror.
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=60)
          for attempt in 1 2; do
            if [ "$attempt" = 2 ]; then
              echo "ffmpeg install attempt 1 failed; retrying against archive.ubuntu.com"
              sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' \
                /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            fi
            if timeout 900 sudo apt-get "${apt_opts[@]}" update -qq &&
               timeout 900 sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install -y -q --no-install-recommends ffmpeg; then
              break
            fi
            if [ "$attempt" = 2 ]; then echo "::error::ffmpeg could not be installed"; exit 1; fi
          done
      - name: Download tonight's recordings from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Every recording shard of this run, merged into one review folder.
          pattern: real-erp-training-${{ github.run_id }}-shard-*
          merge-multiple: true
          path: ${{ github.workspace }}/.training-review/
      - name: Validate every captured recording of this commit (codec, narration, duration, captions, guide)
        run: node scripts/validate-training-recording.mjs
        env:
          TRAINING_VALIDATION_OUTPUT: ${{ env.TRAINING_VALIDATION }}
      - name: Upload to PRIVATE Vercel Blob and replace the runtime manifest
        run: node scripts/upload-reviewed-training-vercel.mjs
      - name: Keep the publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-training-publication
          path: |
            ${{ github.workspace }}/.training-review/published-upload-report.json
            ${{ github.workspace }}/.training-review/validated-recordings.json
          if-no-files-found: warn
          retention-days: 30

  notify:
    needs: [plan, record, publish]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.record == 'true'
    permissions:
      issues: write
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Report what was recorded and published
        env:
          GH_TOKEN: ${{ github.token }}
          TOPICS: ${{ needs.plan.outputs.topics }}
          RECORD_RESULT: ${{ needs.record.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Nightly training capture result: **$RECORD_RESULT**. Automatic publication: **$PUBLISH_RESULT**."
            echo
            echo "Affected modules: \`$TOPICS\`"
            echo
            if [ "$PUBLISH_RESULT" = "success" ]; then
              echo "Every validated recording above is now live in Help & Training, replacing that topic's previous video."
              echo "The previous files remain in private storage; to roll one back, run 'Approve & Publish ERP Training Video'"
              echo "with the earlier recording run ID and that topic."
            else
              echo "Nothing was published. Inspect the recorder and publication logs, then re-run the workflow or publish"
              echo "one topic manually with 'Approve & Publish ERP Training Video'."
            fi
            echo
            echo "Videos, screenshots, VTT captions, written guides and the publication receipt:"
            echo "$RUN_URL"
          } > "$RUNNER_TEMP/training-review-body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Nightly training recordings – run $GITHUB_RUN_ID (recorded: $RECORD_RESULT, published: $PUBLISH_RESULT)" \
            --body-file "$RUNNER_TEMP/training-review-body.md"

  notify-transaction-failure:
    needs: [transactions, whole-system]
    if: always() && (needs.transactions.result != 'success' || needs.whole-system.result != 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Collect backend suite evidence when it exists
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-backend-regression
          path: evidence/backend
      - name: Open human investigation task for failed fake transactions
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRANSACTIONS_RESULT: ${{ needs.transactions.result }}
          WHOLE_SYSTEM_RESULT: ${{ needs.whole-system.result }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "The nightly disposable ERP/Factory transaction suite, its reconciliation, or the full system regression suite failed."
            echo
            echo "- Fake transactions and reconciliation: **$TRANSACTIONS_RESULT**"
            echo "- Whole-system regression: **$WHOLE_SYSTEM_RESULT**"
            echo
            echo "Inspect browser screenshots, the reconciliation JSON report and server logs:"
            echo "$RUN_URL"
            echo
            log=evidence/backend/artifacts/nightly-whole-system/backend-tests.log
            if [ -f "$log" ]; then
              echo "### Backend suite summary"
              echo
              echo '```'
              grep -E "^ (FAIL|×|✗)|^ *(×|✗) |Test Files|Tests  |ERROR: Coverage|does not meet|threshold" "$log" | head -80 || echo "(no failure lines matched)"
              echo '```'
              echo
            fi
            echo "No real-company accounting or inventory was touched. Do not publish affected tutorials until the discrepancy is investigated."
          } > "$RUNNER_TEMP/nightly-reconciliation-failure.md"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Nightly ERP/Factory system audit failed – run $GITHUB_RUN_ID" \
            --body-file "$RUNNER_TEMP/nightly-reconciliation-failure.md"
