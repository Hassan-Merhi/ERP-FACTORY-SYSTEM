name: Temporary Account Layout Formatting
on:
  push:
    branches:
      - feat/account-display-groups-shared-order-20261019
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'Hassan-Merhi/ERP-FACTORY-SYSTEM' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/account-display-groups-shared-order-20261019
          persist-credentials: true
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.0"
          cache: npm
      - name: Install
        run: npm ci --no-audit --bin-links=true
      - name: Apply code formatting to feature changes
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/AccountGroups.tsx \
            client/src/pages/AccountsLegacy.tsx \
            client/src/pages/NetProfitDetails.tsx \
            client/src/pages/accounts/AccountTable.tsx \
            client/src/pages/accounts/DisplayAccountGroups.tsx \
            client/src/pages/factory/FactoryNetPositionDetails.tsx \
            client/src/components/accounts/InlineOrderButtons.tsx \
            client/src/hooks/useAccountDisplayOrder.ts \
            server/routes/accountDisplayLayoutRoutes.ts \
            server/routes/ledgerRoutes.ts \
            server/startup/ensureRuntimeSchema.ts
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/AccountGroups.tsx client/src/pages/AccountsLegacy.tsx \
            client/src/pages/NetProfitDetails.tsx client/src/pages/accounts/AccountTable.tsx \
            client/src/pages/accounts/DisplayAccountGroups.tsx \
            client/src/pages/factory/FactoryNetPositionDetails.tsx \
            client/src/components/accounts/InlineOrderButtons.tsx \
            client/src/hooks/useAccountDisplayOrder.ts \
            server/routes/accountDisplayLayoutRoutes.ts server/routes/ledgerRoutes.ts \
            server/startup/ensureRuntimeSchema.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format account display grouping feature"
            git push origin HEAD:feat/account-display-groups-shared-order-20261019
          fi
