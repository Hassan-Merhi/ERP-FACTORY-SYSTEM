name: Retail Wave 1 TDD

on:
  push:
    branches:
      - feature/retail-fashion-variants-wave1

permissions:
  contents: read

concurrency:
  group: retail-wave1-tdd
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      SESSION_SECRET: retail-wave1-tdd
      CSRF_ENFORCE: "0"
      ENABLE_SCHEDULERS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true
      - name: Run Wave 1 contract
        run: node node_modules/vitest/vitest.mjs run tests/retail-fashion-variants-wave1.test.ts
