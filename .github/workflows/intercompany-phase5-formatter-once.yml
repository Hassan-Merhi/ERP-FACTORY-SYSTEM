name: Intercompany Phase 5 One-Time Branch Formatter

on:
  push:
    branches:
      - feature/intercompany-container-trading
    paths:
      - .github/workflows/intercompany-phase5-formatter-once.yml

permissions:
  contents: write

concurrency:
  group: intercompany-phase5-formatter-once
  cancel-in-progress: false

jobs:
  format-feature-branch:
    if: github.ref == 'refs/heads/feature/intercompany-container-trading'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden GitHub runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout exact feature commit without persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install locked formatter without running dependency scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format only TypeScript and CSS changed by the draft PR
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base_commit="$(git merge-base origin/main HEAD)"
          mapfile -d '' changed_files < <(git diff --name-only --diff-filter=ACMR -z "$base_commit" HEAD -- '*.ts' '*.tsx' '*.css')
          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed TypeScript, TSX or CSS files."
            exit 0
          fi
          printf '%s\n' "${changed_files[@]}"
          node node_modules/prettier/bin/prettier.cjs --write "${changed_files[@]}"
          git add -- "${changed_files[@]}"

      - name: Commit formatted feature files only, refusing changed branch heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No formatting correction needed."
            exit 0
          fi
          git fetch origin feature/intercompany-container-trading --no-tags
          if [ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD)" ]; then
            echo "Branch advanced during formatting. Refusing stale push."
            exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "style(intercompany): format changed feature branch sources"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
            push origin HEAD:refs/heads/feature/intercompany-container-trading
