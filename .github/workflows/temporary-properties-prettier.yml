name: Temporary Properties PR formatting
on:
  push:
    branches:
      - fix/properties-rent-payments-account-kpis-nov06
    paths:
      - .github/workflows/temporary-properties-prettier.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref_name == 'fix/properties-rent-payments-account-kpis-nov06'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/properties-rent-payments-account-kpis-nov06
          persist-credentials: true
      - name: Install locked dependencies
        run: npm ci --no-audit --ignore-scripts
      - name: Format only the five reviewed Properties source files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/properties/PropertyRentalPage.tsx \
            client/src/pages/properties/RentalPaymentsLog.tsx \
            client/src/pages/properties/property-rental/components/PaymentsReconciliation.tsx \
            client/src/pages/properties/property-rental/paymentsReceiptMath.ts \
            tests/properties-payment-history-reconciliation.test.ts
          git diff --check
      - name: Commit source-only formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            client/src/pages/properties/PropertyRentalPage.tsx \
            client/src/pages/properties/RentalPaymentsLog.tsx \
            client/src/pages/properties/property-rental/components/PaymentsReconciliation.tsx \
            client/src/pages/properties/property-rental/paymentsReceiptMath.ts \
            tests/properties-payment-history-reconciliation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(properties): apply Prettier to reconciliation changes'
            git push origin HEAD:refs/heads/fix/properties-rent-payments-account-kpis-nov06
          fi
