name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Capture production dependency audit
        run: |
          npm audit --omit=dev --json > production-audit.json || true
          npm audit --omit=dev --audit-level=high || true

      - name: Block unreviewed high and critical production vulnerabilities
        run: npm run verify:dependency-audit

      - name: Audit all dependencies on deep scans
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run verify:dependency-audit -- --include-dev

      - name: Upload production dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-dependency-audit
          path: production-audit.json
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency Review
    needs: dependency-audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve dependency-review protection context without duplicate audit
        env:
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          set -euo pipefail
          echo "Canonical dependency audit result: ${DEPENDENCY_AUDIT_RESULT}"
          if [[ "$DEPENDENCY_AUDIT_RESULT" != "success" ]]; then
            echo "::error::Dependency Review is blocked because the canonical Dependency audit did not succeed."
            exit 1
          fi
          echo "Dependency Review is satisfied by the canonical reviewed dependency policy gate."

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked secret-bearing files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            lower_file="${file,,}"
            case "$lower_file" in
              .env.example|.env.production|client/.env.production|client/.env.capacitor|android/keystore.properties.example)
                continue
                ;;
              .env|.env.*|*/.env|*/.env.*|*.pem|*.key|*.jks|*.keystore|*/keystore.properties)
                echo "::error file=${file}::Secret-bearing file type must not be tracked in Git."
                failed=1
                ;;
            esac
          done < <(git ls-files -z)
          exit "$failed"

      - name: Block verified secrets across reachable history
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --results=verified

      - name: Report unknown secret candidates
        continue-on-error: true
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --results=unknown

  focused-security-readiness:
    name: Focused security readiness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heliumdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heliumdb
      PGSSLMODE: disable
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare disposable security schema
        run: npm run db:push

      - name: Run focused security readiness
        env:
          PROGRAM6_SKIP_TYPESCRIPT: "1"
        run: npm run check:security
