name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  # Cancel superseded pull-request runs only; every commit on main is gated.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Normalize Replit registry URLs for CI
        run: sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --bin-links=true

      - name: Capture production dependency audit
        id: production_audit_report
        if: always()
        run: |
          npm audit --omit=dev --json > production-audit.json || true
          npm audit --omit=dev --audit-level=high || true

      - name: Block unreviewed high and critical production vulnerabilities
        run: npm run verify:dependency-audit

      - name: Upload production dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-dependency-audit
          path: production-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Audit all dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run verify:dependency-audit -- --include-dev

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked secret-bearing files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            case "$file" in
              .env.example|.env.production|client/.env.production|client/.env.capacitor|android/keystore.properties.example)
                continue
                ;;
              .env|.env.*|*/.env|*/.env.*|*.pem|*.key|*.jks|*.keystore|*/keystore.properties)
                echo "::error file=${file}::Secret-bearing file type must not be tracked in Git."
                failed=1
                ;;
            esac
          done < <(git ls-files -z)
          exit "$failed"

      - name: Block verified secrets across reachable history
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --results=verified

      - name: Report unknown secret candidates
        continue-on-error: true
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --results=unknown
