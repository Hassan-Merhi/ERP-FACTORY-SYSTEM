name: Phase 1 Format Repair

on:
  push:
    branches:
      - fix/proforma-capacity-phase1-format-20260910

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/proforma-capacity-phase1-format-20260910

      - name: Set up canonical Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format Phase 1 source
        run: node node_modules/prettier/bin/prettier.cjs --write server/routes/factory/customer-orders/proformaCapacity.ts

      - name: Verify Phase 1 source formatting
        run: node node_modules/prettier/bin/prettier.cjs --check server/routes/factory/customer-orders/proformaCapacity.ts

      - name: Remove temporary repair files and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm docs/phase1-format-repair-request.md .github/workflows/phase1-format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/factory/customer-orders/proformaCapacity.ts
          git diff --cached --exit-code && { echo "Expected formatting changes were not produced"; exit 1; } || true
          git commit -m "style: format Phase 1 proforma capacity engine"
          git push origin HEAD:fix/proforma-capacity-phase1-format-20260910
