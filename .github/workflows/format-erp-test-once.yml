name: One-time ERP Test Company formatting
on:
  push:
    branches:
      - feature/isolated-erp-test-user
    paths:
      - .github/workflows/format-erp-test-once.yml
permissions:
  contents: write
jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format changed files and delete this one-time workflow
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            client/src/pages/settings/CreateErpTestCompanyDialog.tsx \
            server/routes/auth/companyAccessRoutes.ts \
            shared/erpTestCompanyAccess.ts \
            tests/erp-test-company-access.test.ts \
            client/src/i18n/phase3RemainingTranslations.part01.ts
          git rm .github/workflows/format-erp-test-once.yml
          git add client/src/pages/settings/CreateErpTestCompanyDialog.tsx server/routes/auth/companyAccessRoutes.ts shared/erpTestCompanyAccess.ts tests/erp-test-company-access.test.ts client/src/i18n/phase3RemainingTranslations.part01.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format ERP test company feature" || true
          git push origin HEAD:feature/isolated-erp-test-user
