name: Temporary PR 2927 Prettier Preview
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/properties-rename-location-groups-20261106
permissions:
  contents: read
jobs:
  print-formatted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Print Prettier formatted rental files in chunks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/prettier/bin/prettier.cjs --write client/src/pages/properties/PropertyRentalPage.tsx client/src/pages/properties/property-rental/components/RentalUnitCards.tsx server/routes/rental/units-contracts/units-write.ts client/src/i18n/propertiesRentalsPhase5Translations.part3.ts
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const files = [
            "client/src/pages/properties/PropertyRentalPage.tsx",
            "client/src/pages/properties/property-rental/components/RentalUnitCards.tsx",
            "server/routes/rental/units-contracts/units-write.ts",
            "client/src/i18n/propertiesRentalsPhase5Translations.part3.ts",
          ];
          for (const p of files) {
            const s = JSON.stringify(fs.readFileSync(p,"utf8"));
            for (let i=0; i<s.length; i+=3000) {
              console.log("__FMT_CHUNK__:"+p+":"+String(i).padStart(7,"0")+":"+s.slice(i,i+3000));
            }
            console.log("__FMT_DONE__:"+p);
          }
          NODE
