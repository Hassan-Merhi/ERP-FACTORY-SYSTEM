version: 2.1

# The canonical test/build/security work now runs in GitHub Actions. The five
# CircleCI job names below are retained only because the main protection policy
# historically required those exact status contexts. They do not repeat the test
# suites: one fail-closed bridge waits for the GitHub Actions CI workflow on the
# exact same commit, then releases the five compatibility statuses.
#
# This repository is private. Configure a read-only GITHUB_TOKEN (or GH_TOKEN)
# in CircleCI so the bridge can read GitHub Actions for the exact commit. The
# bridge fails closed when that API is inaccessible rather than treating missing
# evidence as success.
executors:
  node24:
    docker:
      - image: cimg/node:24.19.0
    resource_class: medium
    working_directory: ~/project

jobs:
  github-ci-gate:
    executor: node24
    steps:
      - run:
          name: Wait for exact-head GitHub CI gate
          no_output_timeout: 3h
          command: |
            node -e '
            (async () => {
              const owner = process.env.CIRCLE_PROJECT_USERNAME;
              const repo = process.env.CIRCLE_PROJECT_REPONAME;
              const sha = process.env.CIRCLE_SHA1;
              const token = process.env.GITHUB_TOKEN || process.env.GH_TOKEN;

              if (!owner || !repo || !sha) {
                console.error("Missing CircleCI repository/commit identity; failing closed.");
                process.exit(1);
              }

              const api = `https://api.github.com/repos/${owner}/${repo}/actions/runs?head_sha=${sha}&per_page=100`;
              const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
              const headers = {
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
                "User-Agent": "etshadierp-circleci-github-ci-bridge",
              };
              if (token) headers.Authorization = `Bearer ${token}`;

              for (let attempt = 1; attempt <= 60; attempt += 1) {
                let response;
                try {
                  response = await fetch(api, { headers });
                } catch (error) {
                  console.error(`GitHub API request failed on attempt ${attempt}:`, error);
                  if (attempt === 60) process.exit(1);
                  await sleep(120_000);
                  continue;
                }

                if (!response.ok) {
                  const remaining = response.headers.get("x-ratelimit-remaining");
                  const reset = response.headers.get("x-ratelimit-reset");
                  console.error(`GitHub API returned ${response.status}; rate remaining=${remaining ?? "unknown"} reset=${reset ?? "unknown"}.`);
                  if (!token && (response.status === 401 || response.status === 404)) {
                    console.error("GitHub Actions is not anonymously readable. Configure a read-only GITHUB_TOKEN or GH_TOKEN in CircleCI; failing closed.");
                    process.exit(1);
                  }
                  if (attempt === 60) process.exit(1);
                  await sleep(120_000);
                  continue;
                }

                const payload = await response.json();
                const runs = (payload.workflow_runs ?? [])
                  .filter((run) => run.name === "CI" && run.head_sha === sha)
                  .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
                const run = runs[0];

                if (!run) {
                  console.log(`Attempt ${attempt}/60: GitHub CI run for ${sha} is not visible yet.`);
                } else if (run.status === "completed") {
                  console.log(`GitHub CI completed: ${run.conclusion} (${run.html_url})`);
                  if (run.conclusion === "success") process.exit(0);
                  console.error("GitHub CI did not succeed; CircleCI compatibility gate is failing closed.");
                  process.exit(1);
                } else {
                  console.log(`Attempt ${attempt}/60: GitHub CI is ${run.status} (${run.html_url}).`);
                }

                if (attempt < 60) await sleep(120_000);
              }

              console.error("Timed out waiting for the exact-head GitHub CI gate; failing closed.");
              process.exit(1);
            })().catch((error) => {
              console.error("Unexpected compatibility-gate error:", error);
              process.exit(1);
            });
            '

  static-build:
    executor: node24
    steps:
      - run: echo "GitHub CI gate certified ${CIRCLE_SHA1}; static-build compatibility context is green."

  postgres-regression:
    executor: node24
    steps:
      - run: echo "GitHub CI gate certified ${CIRCLE_SHA1}; postgres-regression compatibility context is green."

  backend-core-regression:
    executor: node24
    steps:
      - run: echo "GitHub CI gate certified ${CIRCLE_SHA1}; backend-core-regression compatibility context is green."

  frontend-regression:
    executor: node24
    steps:
      - run: echo "GitHub CI gate certified ${CIRCLE_SHA1}; frontend-regression compatibility context is green."

  security-readiness:
    executor: node24
    steps:
      - run: echo "GitHub CI gate certified ${CIRCLE_SHA1}; security-readiness compatibility context is green."

workflows:
  full-erp-verification:
    jobs:
      - github-ci-gate
      - static-build:
          requires: [github-ci-gate]
      - postgres-regression:
          requires: [github-ci-gate]
      - backend-core-regression:
          requires: [github-ci-gate]
      - frontend-regression:
          requires: [github-ci-gate]
      - security-readiness:
          requires: [github-ci-gate]
